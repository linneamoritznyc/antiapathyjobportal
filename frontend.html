<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Apathy Job Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { font-family: system-ui, -apple-system, sans-serif; }
        .gradient { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%); }
        .tab-active { border-bottom: 3px solid white; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // ============== COMPONENTS ==============

        // User menu dropdown
        const UserMenu = ({ user, onLogout }) => {
            const [isOpen, setIsOpen] = useState(false);
            const initials = user.full_name
                ? user.full_name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2)
                : user.email[0].toUpperCase();

            return (
                <div className="relative">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="flex items-center gap-2 bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg transition"
                    >
                        <div className="w-8 h-8 bg-white/30 rounded-full flex items-center justify-center text-sm font-medium">
                            {initials}
                        </div>
                        <span className="text-sm font-medium hidden sm:block">
                            {user.full_name || user.email.split('@')[0]}
                        </span>
                        <svg className={`w-4 h-4 transition ${isOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    {isOpen && (
                        <>
                            <div className="fixed inset-0 z-10" onClick={() => setIsOpen(false)} />
                            <div className="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-lg border border-slate-200 py-2 z-20">
                                <div className="px-4 py-3 border-b border-slate-100">
                                    <p className="font-medium text-slate-800">{user.full_name || 'Användare'}</p>
                                    <p className="text-sm text-slate-500 truncate">{user.email}</p>
                                </div>
                                <a
                                    href="/account"
                                    className="block px-4 py-2 text-slate-700 hover:bg-slate-50 transition"
                                >
                                    Mitt konto
                                </a>
                                <a
                                    href="/account#settings"
                                    className="block px-4 py-2 text-slate-700 hover:bg-slate-50 transition"
                                >
                                    Inställningar
                                </a>
                                <hr className="my-2 border-slate-100" />
                                <button
                                    onClick={() => { setIsOpen(false); onLogout(); }}
                                    className="w-full text-left px-4 py-2 text-slate-700 hover:bg-slate-50 transition"
                                >
                                    Logga ut
                                </button>
                            </div>
                        </>
                    )}
                </div>
            );
        };

        // Navigation tabs
        const NavTabs = ({ activeTab, setActiveTab }) => (
            <div className="flex gap-6">
                {[
                    { id: 'today', label: 'Idag', icon: '🎯' },
                    { id: 'jobs', label: 'Jobb', icon: '🔍' },
                    { id: 'cvs', label: 'Mina CV', icon: '📄' },
                    { id: 'applications', label: 'Ansokningar', icon: '📬' }
                ].map(tab => (
                    <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`pb-2 text-white/80 hover:text-white transition ${activeTab === tab.id ? 'tab-active text-white font-medium' : ''}`}
                    >
                        {tab.icon} {tab.label}
                    </button>
                ))}
            </div>
        );

        // Stats dashboard
        const Stats = ({ stats }) => (
            <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
                {[
                    { label: "Jobb", value: stats.total_jobs, color: "text-indigo-600", bg: "bg-indigo-50" },
                    { label: "CV-vibes", value: stats.cv_vibes || 0, color: "text-purple-600", bg: "bg-purple-50" },
                    { label: "Skickade", value: stats.sent, color: "text-green-600", bg: "bg-green-50" },
                    { label: "Intervjuer", value: stats.interviews, color: "text-amber-600", bg: "bg-amber-50" },
                    { label: "Deadline idag", value: stats.deadline_today || 0, color: "text-red-600", bg: "bg-red-50" }
                ].map(({ label, value, color, bg }) => (
                    <div key={label} className={`${bg} rounded-xl p-4`}>
                        <div className={`text-3xl font-bold ${color}`}>{value || 0}</div>
                        <div className="text-slate-500 text-sm">{label}</div>
                    </div>
                ))}
            </div>
        );

        // Job card with save functionality
        const JobCard = ({ job, onApply, onSave, loading, savedJobs = [] }) => {
            const [saving, setSaving] = useState(false);
            const isSaved = savedJobs.includes(job.id);

            const priorityColors = {
                urgent: "bg-red-100 text-red-700",
                soon: "bg-amber-100 text-amber-700",
                normal: "bg-green-100 text-green-700"
            };

            const handleSave = async (e) => {
                e.stopPropagation();
                setSaving(true);
                try {
                    const token = localStorage.getItem('auth_token');
                    const method = isSaved ? 'DELETE' : 'POST';
                    await fetch(`/api/jobs/${job.id}/save`, {
                        method,
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (onSave) onSave(job.id, !isSaved);
                } catch (err) {
                    console.error('Error saving job:', err);
                }
                setSaving(false);
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
                    <div className="flex justify-between items-start mb-2">
                        <span className={`text-xs px-2 py-1 rounded-full ${priorityColors[job.priority] || priorityColors.normal}`}>
                            {job.priority === 'urgent' ? '⚡ Akut' : job.priority === 'soon' ? '⏰ Snart' : '✓'}
                        </span>
                        <div className="flex items-center gap-2">
                            <button
                                onClick={handleSave}
                                disabled={saving}
                                className={`text-lg hover:scale-110 transition ${isSaved ? 'text-blue-500' : 'text-slate-300 hover:text-blue-400'}`}
                                title={isSaved ? 'Ta bort från sparade' : 'Spara för senare'}
                            >
                                {saving ? '...' : isSaved ? '📌' : '📍'}
                            </button>
                            {job.deadline && (
                                <span className="text-xs text-slate-400">
                                    {new Date(job.deadline).toLocaleDateString('sv-SE')}
                                </span>
                            )}
                        </div>
                    </div>
                    <h3 className="text-lg font-semibold text-slate-800">{job.title}</h3>
                    <p className="text-indigo-600 font-medium text-sm">{job.company}</p>
                    <p className="text-slate-400 text-xs mb-3">{job.location}</p>

                    <div className="bg-slate-50 rounded-lg p-2 mb-3">
                        <p className="text-xs text-slate-600">
                            📧 <a href={`mailto:${job.contact_email}`} className="text-indigo-600">{job.contact_email}</a>
                        </p>
                    </div>

                    <div className="flex gap-2">
                        <button
                            onClick={() => onApply(job)}
                            disabled={loading}
                            className="flex-1 bg-indigo-600 text-white py-2 px-3 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50"
                        >
                            {loading ? '...' : '✨ Ansök'}
                        </button>
                        <a href={job.url} target="_blank" className="px-3 py-2 border border-slate-200 rounded-lg text-slate-500 text-sm hover:bg-slate-50">
                            ↗
                        </a>
                    </div>
                </div>
            );
        };

        // CV Vibe card
        const CVVibeCard = ({ vibe, userCV, onSelect }) => {
            const hasCV = !!userCV;
            return (
                <div
                    className={`rounded-xl p-5 border-2 cursor-pointer transition ${hasCV ? 'bg-white border-green-200 hover:border-green-400' : 'bg-slate-50 border-slate-200 hover:border-indigo-300'}`}
                    onClick={() => onSelect(vibe, userCV)}
                >
                    <div className="text-3xl mb-2">{vibe.emoji}</div>
                    <h3 className="font-semibold text-slate-800">{vibe.name}</h3>
                    <p className="text-xs text-slate-500 mt-1">{vibe.focus}</p>
                    {hasCV ? (
                        <span className="inline-block mt-3 text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full">✓ CV finns</span>
                    ) : (
                        <span className="inline-block mt-3 text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-full">Inte skapat</span>
                    )}
                </div>
            );
        };

        // Application modal
        const ApplyModal = ({ isOpen, job, result, onClose, onSaveApplication }) => {
            const [letter, setLetter] = useState('');
            const [feedback, setFeedback] = useState('');
            const [showFeedback, setShowFeedback] = useState(false);
            const [savingFeedback, setSavingFeedback] = useState(false);
            const [applicationSaved, setApplicationSaved] = useState(false);

            useEffect(() => {
                if (result?.cover_letter) setLetter(result.cover_letter);
                setApplicationSaved(false);
            }, [result]);

            if (!isOpen || !job) return null;

            const saveApplication = async (status = 'draft') => {
                if (applicationSaved && status === 'draft') return;
                try {
                    const token = localStorage.getItem('auth_token');
                    await fetch('/api/applications', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            job_id: job.id,
                            cover_letter: letter,
                            status: status
                        })
                    });
                    setApplicationSaved(true);
                    if (onSaveApplication) onSaveApplication();
                } catch (err) {
                    console.error('Error saving application:', err);
                }
            };

            const openGmail = async () => {
                // Save as draft first
                await saveApplication('draft');
                const subject = encodeURIComponent(`Ansokan: ${job.title}`);
                const body = encodeURIComponent(letter);
                window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${job.contact_email}&su=${subject}&body=${body}`, '_blank');
            };

            const markAsSent = async () => {
                await saveApplication('sent');
                alert('Markerad som skickad!');
                onClose();
            };

            const copyLetter = () => {
                navigator.clipboard.writeText(letter);
                alert('Kopierat!');
            };

            const saveFeedback = async () => {
                if (!feedback.trim()) return;
                setSavingFeedback(true);
                try {
                    const token = localStorage.getItem('auth_token');
                    await fetch('/api/user/ai-feedback', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            feedback_text: feedback,
                            feedback_type: 'cover_letter',
                            applies_to_vibes: result?.matched_vibe ? [result.matched_vibe] : null
                        })
                    });
                    setFeedback('');
                    setShowFeedback(false);
                    alert('Feedback sparad! AI kommer anvanda denna nasta gang.');
                } catch (err) {
                    console.error(err);
                }
                setSavingFeedback(false);
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-hidden">
                        <div className="gradient text-white p-5">
                            <h3 className="text-xl font-bold">{job.title}</h3>
                            <p className="opacity-90">{job.company}</p>
                            {result?.matched_vibe && (
                                <span className="inline-block mt-2 text-xs bg-white/20 px-2 py-1 rounded-full">
                                    CV: {result.matched_vibe}
                                </span>
                            )}
                        </div>
                        <div className="p-5">
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="block text-sm font-medium text-slate-700 mb-2">Personligt brev</label>
                                    <textarea
                                        value={letter}
                                        onChange={(e) => setLetter(e.target.value)}
                                        className="w-full h-48 p-3 border border-slate-200 rounded-lg text-sm"
                                    />
                                </div>

                                {showFeedback && (
                                    <div className="w-64">
                                        <label className="block text-sm font-medium text-slate-700 mb-2">Feedback till AI</label>
                                        <textarea
                                            value={feedback}
                                            onChange={(e) => setFeedback(e.target.value)}
                                            placeholder="Ex: Namna alltid min kundtjanst-erfarenhet for dessa jobb..."
                                            className="w-full h-32 p-3 border border-amber-200 bg-amber-50 rounded-lg text-sm"
                                        />
                                        <button
                                            onClick={saveFeedback}
                                            disabled={savingFeedback || !feedback.trim()}
                                            className="w-full mt-2 bg-amber-500 text-white py-2 rounded-lg text-sm font-medium hover:bg-amber-600 disabled:opacity-50"
                                        >
                                            {savingFeedback ? 'Sparar...' : 'Spara feedback'}
                                        </button>
                                        <p className="text-xs text-slate-500 mt-2">
                                            AI anvander din feedback for framtida brev.
                                        </p>
                                    </div>
                                )}
                            </div>

                            {result?.cv && (
                                <div className="mt-4 p-3 bg-slate-50 rounded-lg">
                                    <p className="text-sm font-medium text-slate-700 mb-1">Bifogat CV: {result.cv.vibe_name}</p>
                                    <p className="text-xs text-slate-500 line-clamp-2">{result.cv.cv_text?.slice(0, 150)}...</p>
                                </div>
                            )}

                            <div className="flex gap-3 mt-4 flex-wrap">
                                <button onClick={openGmail} className="flex-1 bg-green-600 text-white py-2.5 px-4 rounded-lg font-medium hover:bg-green-700">
                                    Oppna i Gmail
                                </button>
                                <button
                                    onClick={markAsSent}
                                    className="px-4 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700"
                                >
                                    Markera skickad
                                </button>
                                <button onClick={copyLetter} className="px-4 py-2.5 border border-slate-200 rounded-lg hover:bg-slate-50">
                                    Kopiera
                                </button>
                                <button
                                    onClick={() => {
                                        const blob = new Blob([letter], { type: 'text/plain;charset=utf-8' });
                                        const url = URL.createObjectURL(blob);
                                        const a = document.createElement('a');
                                        a.href = url;
                                        a.download = `personligt-brev-${job.title || 'jobb'}.txt`;
                                        a.click();
                                        URL.revokeObjectURL(url);
                                    }}
                                    className="px-4 py-2.5 border border-slate-200 rounded-lg hover:bg-slate-50"
                                >
                                    Ladda ner
                                </button>
                                <button
                                    onClick={() => setShowFeedback(!showFeedback)}
                                    className={`px-4 py-2.5 rounded-lg ${showFeedback ? 'bg-amber-100 border-amber-300 text-amber-700' : 'border border-slate-200 hover:bg-slate-50'}`}
                                >
                                    Feedback
                                </button>
                                <button onClick={onClose} className="px-4 py-2.5 border border-slate-200 rounded-lg hover:bg-slate-50">
                                    Stang
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // CV Detail Modal
        const CVModal = ({ isOpen, vibe, cvText, onClose, onSave }) => {
            const [text, setText] = useState(cvText || '');

            useEffect(() => setText(cvText || ''), [cvText]);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden">
                        <div className="gradient text-white p-5">
                            <h3 className="text-xl font-bold">{vibe?.emoji} {vibe?.name}</h3>
                            <p className="opacity-90 text-sm">{vibe?.focus}</p>
                        </div>
                        <div className="p-5">
                            <textarea
                                value={text}
                                onChange={(e) => setText(e.target.value)}
                                className="w-full h-64 p-3 border border-slate-200 rounded-lg text-sm font-mono"
                                placeholder="Ditt CV-innehåll här..."
                            />
                            <div className="flex gap-3 mt-4">
                                <button
                                    onClick={() => onSave(vibe.id, text)}
                                    className="flex-1 bg-indigo-600 text-white py-2.5 px-4 rounded-lg font-medium hover:bg-indigo-700"
                                >
                                    Spara CV
                                </button>
                                <button onClick={onClose} className="px-4 py-2.5 border border-slate-200 rounded-lg hover:bg-slate-50">
                                    Avbryt
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ============== PAGES ==============

        // Quiz page - step by step job preferences
        const QuizPage = ({ onComplete, saving }) => {
            const [step, setStep] = useState(0);
            const [answers, setAnswers] = useState({
                job_titles: [],
                industries: [],
                experience_level: '',
                work_type: [],
                locations: [],
                salary_range: '',
                company_size: [],
                dealbreakers: []
            });

            const questions = [
                {
                    id: 'job_titles',
                    question: 'Vilken typ av jobb soker du?',
                    subtitle: 'Valj en eller flera',
                    type: 'multi',
                    options: [
                        { value: 'servitor', label: 'Servitor/Restaurang' },
                        { value: 'kundtjanst', label: 'Kundtjanst/Support' },
                        { value: 'butik', label: 'Butik/Kassa' },
                        { value: 'lager', label: 'Lager/Logistik' },
                        { value: 'kontor', label: 'Kontor/Admin' },
                        { value: 'tech', label: 'IT/Tech' },
                        { value: 'vard', label: 'Vard/Omsorg' },
                        { value: 'annat', label: 'Annat' }
                    ]
                },
                {
                    id: 'experience_level',
                    question: 'Hur mycket erfarenhet har du?',
                    type: 'single',
                    options: [
                        { value: 'entry', label: 'Nybörjare (0-1 år)' },
                        { value: 'mid', label: 'Lite erfarenhet (1-3 år)' },
                        { value: 'senior', label: 'Erfaren (3+ år)' }
                    ]
                },
                {
                    id: 'work_type',
                    question: 'Vilken typ av anställning passar dig?',
                    type: 'multi',
                    options: [
                        { value: 'heltid', label: 'Heltid' },
                        { value: 'deltid', label: 'Deltid' },
                        { value: 'extra', label: 'Extra/Timmar' },
                        { value: 'sommar', label: 'Sommarjobb' }
                    ]
                },
                {
                    id: 'locations',
                    question: 'Var vill du jobba?',
                    type: 'multi',
                    options: [
                        { value: 'stockholm', label: 'Stockholm' },
                        { value: 'goteborg', label: 'Goteborg' },
                        { value: 'malmo', label: 'Malmo' },
                        { value: 'remote', label: 'Distans/Remote' },
                        { value: 'anywhere', label: 'Hela Sverige' }
                    ]
                },
                {
                    id: 'dealbreakers',
                    question: 'Finns det något du INTE vill gora?',
                    subtitle: 'Vi filtrerar bort dessa jobb',
                    type: 'multi',
                    options: [
                        { value: 'natt', label: 'Nattarbete' },
                        { value: 'helg', label: 'Helgarbete' },
                        { value: 'kall', label: 'Utomhus/Kallt' },
                        { value: 'telefon', label: 'Telefonforssaljning' },
                        { value: 'aldrevard', label: 'Aldrevård' }
                    ]
                }
            ];

            const currentQ = questions[step];
            const isLastStep = step === questions.length - 1;
            const progress = ((step + 1) / questions.length) * 100;

            const handleSelect = (value) => {
                if (currentQ.type === 'single') {
                    setAnswers({ ...answers, [currentQ.id]: value });
                } else {
                    const current = answers[currentQ.id] || [];
                    if (current.includes(value)) {
                        setAnswers({ ...answers, [currentQ.id]: current.filter(v => v !== value) });
                    } else {
                        setAnswers({ ...answers, [currentQ.id]: [...current, value] });
                    }
                }
            };

            const isSelected = (value) => {
                if (currentQ.type === 'single') {
                    return answers[currentQ.id] === value;
                }
                return (answers[currentQ.id] || []).includes(value);
            };

            const canProceed = currentQ.type === 'single'
                ? !!answers[currentQ.id]
                : (answers[currentQ.id] || []).length > 0;

            return (
                <div className="min-h-[60vh] flex flex-col">
                    {/* Progress bar */}
                    <div className="mb-8">
                        <div className="h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div
                                className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-500"
                                style={{ width: `${progress}%` }}
                            />
                        </div>
                        <p className="text-sm text-slate-500 mt-2">Steg {step + 1} av {questions.length}</p>
                    </div>

                    {/* Question */}
                    <div className="flex-1">
                        <h2 className="text-2xl font-bold text-slate-800 mb-2">{currentQ.question}</h2>
                        {currentQ.subtitle && (
                            <p className="text-slate-500 mb-6">{currentQ.subtitle}</p>
                        )}

                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mt-6">
                            {currentQ.options.map(opt => (
                                <button
                                    key={opt.value}
                                    onClick={() => handleSelect(opt.value)}
                                    className={`p-4 rounded-xl border-2 text-left transition ${
                                        isSelected(opt.value)
                                            ? 'border-indigo-500 bg-indigo-50 text-indigo-700'
                                            : 'border-slate-200 hover:border-slate-300 text-slate-700'
                                    }`}
                                >
                                    <span className="font-medium">{opt.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Navigation */}
                    <div className="flex justify-between mt-8 pt-6 border-t border-slate-200">
                        <button
                            onClick={() => setStep(Math.max(0, step - 1))}
                            disabled={step === 0}
                            className="px-6 py-3 text-slate-600 hover:text-slate-800 disabled:opacity-30 transition"
                        >
                            Tillbaka
                        </button>

                        {isLastStep ? (
                            <button
                                onClick={() => onComplete(answers)}
                                disabled={!canProceed || saving}
                                className="px-8 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition"
                            >
                                {saving ? 'Sparar...' : 'Klar - Borja soka jobb!'}
                            </button>
                        ) : (
                            <button
                                onClick={() => setStep(step + 1)}
                                disabled={!canProceed}
                                className="px-8 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition"
                            >
                                Nasta
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // Jobs page
        const JobsPage = ({ jobs, onScrape, onApply, scraping, applyingJob, savedJobs, onSaveJob }) => {
            const [keywords, setKeywords] = useState('');
            const [filterText, setFilterText] = useState('');
            const [filterPriority, setFilterPriority] = useState('all');
            const [sortBy, setSortBy] = useState('deadline');
            const [currentPage, setCurrentPage] = useState(1);
            const jobsPerPage = 12;

            // Reset to page 1 when filters change
            useEffect(() => {
                setCurrentPage(1);
            }, [filterText, filterPriority, sortBy, jobs.length]);

            // Filter and sort jobs
            const filteredJobs = jobs
                .filter(job => {
                    // Text filter
                    if (filterText) {
                        const search = filterText.toLowerCase();
                        const matchesText =
                            job.title?.toLowerCase().includes(search) ||
                            job.company?.toLowerCase().includes(search) ||
                            job.location?.toLowerCase().includes(search);
                        if (!matchesText) return false;
                    }
                    // Priority filter
                    if (filterPriority !== 'all' && job.priority !== filterPriority) {
                        return false;
                    }
                    return true;
                })
                .sort((a, b) => {
                    if (sortBy === 'deadline') {
                        // Urgent first, then by deadline date
                        const priorityOrder = { urgent: 0, soon: 1, normal: 2 };
                        const aPriority = priorityOrder[a.priority] ?? 2;
                        const bPriority = priorityOrder[b.priority] ?? 2;
                        if (aPriority !== bPriority) return aPriority - bPriority;
                        return new Date(a.deadline || '2099-12-31') - new Date(b.deadline || '2099-12-31');
                    }
                    if (sortBy === 'company') {
                        return (a.company || '').localeCompare(b.company || '');
                    }
                    if (sortBy === 'title') {
                        return (a.title || '').localeCompare(b.title || '');
                    }
                    return 0;
                });

            return (
                <div>
                    <div className="bg-white rounded-xl p-5 shadow-sm mb-6">
                        <h2 className="text-lg font-semibold mb-3">🔍 Sök jobb på Platsbanken</h2>
                        <div className="flex gap-3">
                            <input
                                type="text"
                                value={keywords}
                                onChange={(e) => setKeywords(e.target.value)}
                                placeholder="t.ex. servitör, kundtjänst, butik"
                                className="flex-1 border border-slate-200 rounded-lg px-4 py-2"
                                onKeyDown={(e) => e.key === 'Enter' && onScrape(keywords)}
                            />
                            <button
                                onClick={() => onScrape(keywords)}
                                disabled={scraping}
                                className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-indigo-700 disabled:opacity-50"
                            >
                                {scraping ? 'Söker...' : 'Sök'}
                            </button>
                        </div>
                        <p className="text-xs text-slate-500 mt-2">Visar endast jobb med e-postansökan.</p>
                    </div>

                    {/* Filter bar */}
                    {jobs.length > 0 && (
                        <div className="bg-white rounded-xl p-4 shadow-sm mb-6">
                            <div className="flex flex-wrap gap-3 items-center">
                                <div className="flex-1 min-w-[200px]">
                                    <input
                                        type="text"
                                        value={filterText}
                                        onChange={(e) => setFilterText(e.target.value)}
                                        placeholder="Filtrera: titel, företag, plats..."
                                        className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"
                                    />
                                </div>
                                <select
                                    value={filterPriority}
                                    onChange={(e) => setFilterPriority(e.target.value)}
                                    className="border border-slate-200 rounded-lg px-3 py-2 text-sm"
                                >
                                    <option value="all">Alla prioriteter</option>
                                    <option value="urgent">⚡ Akut (3 dagar)</option>
                                    <option value="soon">⏰ Snart (7 dagar)</option>
                                    <option value="normal">✓ Normal</option>
                                </select>
                                <select
                                    value={sortBy}
                                    onChange={(e) => setSortBy(e.target.value)}
                                    className="border border-slate-200 rounded-lg px-3 py-2 text-sm"
                                >
                                    <option value="deadline">Sortera: Deadline</option>
                                    <option value="company">Sortera: Företag</option>
                                    <option value="title">Sortera: Titel</option>
                                </select>
                                {(filterText || filterPriority !== 'all') && (
                                    <button
                                        onClick={() => { setFilterText(''); setFilterPriority('all'); }}
                                        className="text-sm text-slate-500 hover:text-slate-700"
                                    >
                                        Rensa filter
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Pagination calculation */}
                    {(() => {
                        const totalPages = Math.ceil(filteredJobs.length / jobsPerPage);
                        const startIdx = (currentPage - 1) * jobsPerPage;
                        const paginatedJobs = filteredJobs.slice(startIdx, startIdx + jobsPerPage);

                        return (
                            <>
                                <h2 className="text-lg font-semibold mb-4">
                                    📋 Jobb ({filteredJobs.length}{filteredJobs.length !== jobs.length ? ` av ${jobs.length}` : ''})
                                    {totalPages > 1 && <span className="text-slate-400 font-normal text-sm ml-2">Sida {currentPage} av {totalPages}</span>}
                                </h2>
                                {jobs.length === 0 ? (
                                    <div className="bg-white rounded-xl p-10 text-center shadow-sm">
                                        <p className="text-slate-500">Inga jobb ännu. Sök för att hitta nya!</p>
                                    </div>
                                ) : filteredJobs.length === 0 ? (
                                    <div className="bg-white rounded-xl p-10 text-center shadow-sm">
                                        <p className="text-slate-500">Inga jobb matchar ditt filter.</p>
                                        <button
                                            onClick={() => { setFilterText(''); setFilterPriority('all'); }}
                                            className="mt-2 text-indigo-600 hover:underline text-sm"
                                        >
                                            Rensa filter
                                        </button>
                                    </div>
                                ) : (
                                    <>
                                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {paginatedJobs.map(job => (
                                                <JobCard
                                                    key={job.id}
                                                    job={job}
                                                    onApply={onApply}
                                                    onSave={onSaveJob}
                                                    loading={applyingJob === job.id}
                                                    savedJobs={savedJobs || []}
                                                />
                                            ))}
                                        </div>

                                        {/* Pagination controls */}
                                        {totalPages > 1 && (
                                            <div className="flex justify-center items-center gap-2 mt-6">
                                                <button
                                                    onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                                                    disabled={currentPage === 1}
                                                    className="px-4 py-2 border border-slate-200 rounded-lg text-sm hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed"
                                                >
                                                    ← Föregående
                                                </button>
                                                <div className="flex gap-1">
                                                    {Array.from({ length: Math.min(5, totalPages) }, (_, i) => {
                                                        let pageNum;
                                                        if (totalPages <= 5) {
                                                            pageNum = i + 1;
                                                        } else if (currentPage <= 3) {
                                                            pageNum = i + 1;
                                                        } else if (currentPage >= totalPages - 2) {
                                                            pageNum = totalPages - 4 + i;
                                                        } else {
                                                            pageNum = currentPage - 2 + i;
                                                        }
                                                        return (
                                                            <button
                                                                key={pageNum}
                                                                onClick={() => setCurrentPage(pageNum)}
                                                                className={`w-10 h-10 rounded-lg text-sm font-medium ${
                                                                    currentPage === pageNum
                                                                        ? 'bg-indigo-600 text-white'
                                                                        : 'border border-slate-200 hover:bg-slate-50'
                                                                }`}
                                                            >
                                                                {pageNum}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                                <button
                                                    onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                                                    disabled={currentPage === totalPages}
                                                    className="px-4 py-2 border border-slate-200 rounded-lg text-sm hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed"
                                                >
                                                    Nästa →
                                                </button>
                                            </div>
                                        )}
                                    </>
                                )}
                            </>
                        );
                    })()}
                </div>
            );
        };

        // Master CV Editor Modal
        const MasterCVEditor = ({ isOpen, onClose, masterCV, onSave, saving }) => {
            const [editedCV, setEditedCV] = useState(null);
            const [activeSection, setActiveSection] = useState('experiences');

            useEffect(() => {
                if (isOpen) {
                    // Initialize with masterCV data or empty defaults
                    const defaultCV = {
                        profile: { full_name: '', email: '', phone: '', location: '' },
                        experiences: [],
                        education: [],
                        skills: [],
                        volunteer: [],
                        awards: []
                    };
                    if (masterCV) {
                        setEditedCV({
                            ...defaultCV,
                            ...JSON.parse(JSON.stringify(masterCV)),
                            experiences: masterCV.experiences || [],
                            education: masterCV.education || [],
                            skills: masterCV.skills || []
                        });
                    } else {
                        setEditedCV(defaultCV);
                    }
                }
            }, [masterCV, isOpen]);

            if (!isOpen) return null;
            if (!editedCV) return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
                    <div className="bg-white rounded-xl p-8">
                        <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mx-auto"></div>
                        <p className="mt-4 text-slate-600">Laddar Master CV...</p>
                    </div>
                </div>
            );

            const updateExperience = (index, field, value) => {
                const newExp = [...editedCV.experiences];
                newExp[index] = { ...newExp[index], [field]: value };
                setEditedCV({ ...editedCV, experiences: newExp });
            };

            const addExperience = () => {
                setEditedCV({
                    ...editedCV,
                    experiences: [...editedCV.experiences, {
                        company: '', title: '', location: '', start_date: '', end_date: '', description: '', categories: []
                    }]
                });
            };

            const deleteExperience = (index) => {
                setEditedCV({
                    ...editedCV,
                    experiences: editedCV.experiences.filter((_, i) => i !== index)
                });
            };

            const updateEducation = (index, field, value) => {
                const newEdu = [...editedCV.education];
                newEdu[index] = { ...newEdu[index], [field]: value };
                setEditedCV({ ...editedCV, education: newEdu });
            };

            const addEducation = () => {
                setEditedCV({
                    ...editedCV,
                    education: [...editedCV.education, {
                        school: '', degree: '', field_of_study: '', location: '', start_date: '', end_date: ''
                    }]
                });
            };

            const [importStatus, setImportStatus] = useState(null);

            // Parse LinkedIn CSV data
            const parseLinkedInCSV = (csvText, type) => {
                const lines = csvText.split('\n');
                if (lines.length < 2) return [];

                // Parse header
                const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g, ''));
                const results = [];

                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;

                    // Handle CSV with quoted fields
                    const values = [];
                    let current = '';
                    let inQuotes = false;
                    for (const char of lines[i]) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            values.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    values.push(current.trim());

                    const row = {};
                    headers.forEach((h, idx) => {
                        row[h] = values[idx] || '';
                    });
                    results.push(row);
                }
                return results;
            };

            // Handle LinkedIn file upload
            const handleLinkedInUpload = async (e, type) => {
                const file = e.target.files[0];
                if (!file) return;

                setImportStatus('importing');

                try {
                    const text = await file.text();

                    if (type === 'positions') {
                        const positions = parseLinkedInCSV(text, 'positions');
                        const newExperiences = positions.map(p => ({
                            company: p['company name'] || p['company'] || '',
                            title: p['title'] || '',
                            location: p['location'] || '',
                            start_date: p['started on'] || '',
                            end_date: p['finished on'] || '',
                            description: p['description'] || '',
                            categories: []
                        })).filter(exp => exp.company || exp.title);

                        setEditedCV(prev => ({
                            ...prev,
                            experiences: [...prev.experiences, ...newExperiences]
                        }));
                        setImportStatus(`Importerade ${newExperiences.length} erfarenheter!`);
                    } else if (type === 'education') {
                        const education = parseLinkedInCSV(text, 'education');
                        const newEducation = education.map(e => ({
                            school: e['school name'] || e['school'] || '',
                            degree: e['degree name'] || e['degree'] || '',
                            field_of_study: e['field of study'] || e['notes'] || '',
                            location: '',
                            start_date: e['start date'] || '',
                            end_date: e['end date'] || ''
                        })).filter(edu => edu.school);

                        setEditedCV(prev => ({
                            ...prev,
                            education: [...prev.education, ...newEducation]
                        }));
                        setImportStatus(`Importerade ${newEducation.length} utbildningar!`);
                    } else if (type === 'skills') {
                        const skills = parseLinkedInCSV(text, 'skills');
                        const newSkills = skills.map(s => ({
                            category: 'all',
                            skill_type: 'technical',
                            skill_text: s['name'] || s['skill'] || ''
                        })).filter(s => s.skill_text);

                        setEditedCV(prev => ({
                            ...prev,
                            skills: [...prev.skills, ...newSkills]
                        }));
                        setImportStatus(`Importerade ${newSkills.length} kompetenser!`);
                    } else if (type === 'profile') {
                        const profiles = parseLinkedInCSV(text, 'profile');
                        if (profiles.length > 0) {
                            const p = profiles[0];
                            setEditedCV(prev => ({
                                ...prev,
                                profile: {
                                    ...prev.profile,
                                    full_name: `${p['first name'] || ''} ${p['last name'] || ''}`.trim() || prev.profile.full_name,
                                    email: p['email address'] || p['email'] || prev.profile.email,
                                    location: p['geo location'] || p['location'] || prev.profile.location
                                }
                            }));
                            setImportStatus('Profildata importerad!');
                        }
                    }

                    setTimeout(() => setImportStatus(null), 3000);
                } catch (err) {
                    console.error('Import error:', err);
                    setImportStatus('Fel vid import. Kontrollera filformatet.');
                    setTimeout(() => setImportStatus(null), 3000);
                }

                e.target.value = '';
            };

            const sections = [
                { id: 'experiences', label: 'Erfarenheter', icon: '💼', count: editedCV.experiences?.length || 0 },
                { id: 'education', label: 'Utbildning', icon: '🎓', count: editedCV.education?.length || 0 },
                { id: 'skills', label: 'Kompetenser', icon: '⭐', count: editedCV.skills?.length || 0 },
                { id: 'profile', label: 'Profil', icon: '👤', count: null },
                { id: 'import', label: 'LinkedIn Import', icon: '📥', count: null }
            ];

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex">
                    {/* Sidebar */}
                    <div className="w-64 bg-slate-800 text-white p-4 flex flex-col">
                        <h2 className="text-lg font-bold mb-6">📋 Master CV</h2>
                        <nav className="space-y-1 flex-1">
                            {sections.map(s => (
                                <button
                                    key={s.id}
                                    onClick={() => setActiveSection(s.id)}
                                    className={`w-full text-left px-3 py-2 rounded-lg flex items-center justify-between ${
                                        activeSection === s.id ? 'bg-white/20' : 'hover:bg-white/10'
                                    }`}
                                >
                                    <span>{s.icon} {s.label}</span>
                                    {s.count !== null && <span className="bg-white/20 px-2 py-0.5 rounded text-xs">{s.count}</span>}
                                </button>
                            ))}
                        </nav>
                        <div className="pt-4 border-t border-white/20 space-y-2">
                            <button
                                onClick={() => onSave(editedCV)}
                                disabled={saving}
                                className="w-full bg-green-600 hover:bg-green-700 py-2 rounded-lg font-medium disabled:opacity-50"
                            >
                                {saving ? 'Sparar...' : '💾 Spara ändringar'}
                            </button>
                            <button
                                onClick={onClose}
                                className="w-full bg-white/10 hover:bg-white/20 py-2 rounded-lg"
                            >
                                Stäng
                            </button>
                        </div>
                    </div>

                    {/* Content */}
                    <div className="flex-1 bg-white overflow-auto p-6">
                        {/* Experiences Section */}
                        {activeSection === 'experiences' && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold">💼 Arbetslivserfarenhet</h3>
                                    <button
                                        onClick={addExperience}
                                        className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700"
                                    >
                                        + Lägg till
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    {editedCV.experiences?.map((exp, i) => (
                                        <div key={i} className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                            <div className="flex justify-between items-start mb-3">
                                                <span className="text-xs font-medium text-slate-500">#{i + 1}</span>
                                                <button
                                                    onClick={() => deleteExperience(i)}
                                                    className="text-red-500 hover:text-red-700 text-sm"
                                                >
                                                    🗑️ Ta bort
                                                </button>
                                            </div>
                                            <div className="grid md:grid-cols-2 gap-3">
                                                <input
                                                    placeholder="Företag"
                                                    value={exp.company || ''}
                                                    onChange={(e) => updateExperience(i, 'company', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Titel"
                                                    value={exp.title || ''}
                                                    onChange={(e) => updateExperience(i, 'title', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Plats"
                                                    value={exp.location || ''}
                                                    onChange={(e) => updateExperience(i, 'location', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <div className="flex gap-2">
                                                    <input
                                                        placeholder="Start (YYYY-MM)"
                                                        value={exp.start_date || ''}
                                                        onChange={(e) => updateExperience(i, 'start_date', e.target.value)}
                                                        className="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                    />
                                                    <input
                                                        placeholder="Slut"
                                                        value={exp.end_date || ''}
                                                        onChange={(e) => updateExperience(i, 'end_date', e.target.value)}
                                                        className="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                    />
                                                </div>
                                            </div>
                                            <textarea
                                                placeholder="Beskrivning - vad du gjorde, ansvar, resultat..."
                                                value={exp.description || ''}
                                                onChange={(e) => updateExperience(i, 'description', e.target.value)}
                                                rows={3}
                                                className="w-full mt-3 px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                            />
                                            <div className="mt-2">
                                                <label className="text-xs text-slate-500 block mb-1">Kategorier (komma-separerade)</label>
                                                <input
                                                    placeholder="restaurant, retail, tech..."
                                                    value={(exp.categories || []).join(', ')}
                                                    onChange={(e) => updateExperience(i, 'categories', e.target.value.split(',').map(c => c.trim()).filter(Boolean))}
                                                    className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Education Section */}
                        {activeSection === 'education' && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold">🎓 Utbildning</h3>
                                    <button
                                        onClick={addEducation}
                                        className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700"
                                    >
                                        + Lägg till
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    {editedCV.education?.map((edu, i) => (
                                        <div key={i} className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                            <div className="grid md:grid-cols-2 gap-3">
                                                <input
                                                    placeholder="Skola/Universitet"
                                                    value={edu.school || ''}
                                                    onChange={(e) => updateEducation(i, 'school', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Examen"
                                                    value={edu.degree || ''}
                                                    onChange={(e) => updateEducation(i, 'degree', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Ämne/Inriktning"
                                                    value={edu.field_of_study || ''}
                                                    onChange={(e) => updateEducation(i, 'field_of_study', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Plats"
                                                    value={edu.location || ''}
                                                    onChange={(e) => updateEducation(i, 'location', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Startår"
                                                    value={edu.start_date || ''}
                                                    onChange={(e) => updateEducation(i, 'start_date', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Slutår"
                                                    value={edu.end_date || ''}
                                                    onChange={(e) => updateEducation(i, 'end_date', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Skills Section */}
                        {activeSection === 'skills' && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold">⭐ Kompetenser</h3>
                                    <button
                                        onClick={() => setEditedCV({
                                            ...editedCV,
                                            skills: [...(editedCV.skills || []), { category: 'all', skill_type: 'technical', skill_text: '' }]
                                        })}
                                        className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700"
                                    >
                                        + Lägg till
                                    </button>
                                </div>
                                <p className="text-sm text-slate-500 mb-4">
                                    Dina kompetenser grupperade per kategori. Dessa används för att matcha mot jobb.
                                </p>
                                <div className="space-y-3">
                                    {editedCV.skills?.map((skill, i) => (
                                        <div key={i} className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                            <div className="flex justify-between items-start mb-3">
                                                <span className="text-xs font-medium text-slate-500">#{i + 1}</span>
                                                <button
                                                    onClick={() => setEditedCV({
                                                        ...editedCV,
                                                        skills: editedCV.skills.filter((_, idx) => idx !== i)
                                                    })}
                                                    className="text-red-500 hover:text-red-700 text-sm"
                                                >
                                                    🗑️ Ta bort
                                                </button>
                                            </div>
                                            <div className="grid md:grid-cols-3 gap-3">
                                                <select
                                                    value={skill.category || 'all'}
                                                    onChange={(e) => {
                                                        const newSkills = [...editedCV.skills];
                                                        newSkills[i] = { ...newSkills[i], category: e.target.value };
                                                        setEditedCV({ ...editedCV, skills: newSkills });
                                                    }}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                >
                                                    <option value="all">Alla branscher</option>
                                                    <option value="tech">Tech</option>
                                                    <option value="restaurant">Restaurang</option>

            const handleSaveNotes = async (appId) => {

                full_name: '',

                linkedin_url: '',

                { id: 'full_time', label: 'Heltid' },
                { id: 'part_time', label: 'Deltid' },
                { id: 'temporary', label: 'Visstid' },
                { id: 'internship', label: 'Praktik' },
                { id: 'remote', label: 'Distans' }
            ];

            const experienceLevels = [
                { id: 'entry', label: 'Nyutexaminerad / Första jobbet' },

                { id: 'mid', label: '3-5 års erfarenhet' },
                { id: 'senior', label: '5+ års erfarenhet' }
            ];

            const toggleJobType = (id) => {
                setPreferences(prev => ({
                    ...prev,
                    job_types: prev.job_types.includes(id)
                        ? prev.job_types.filter(t => t !== id)
                        : [...prev.job_types, id]
                }));
            };

            const addExperience = () => {
                setProfile(prev => ({
                    ...prev,
                    experiences: [...prev.experiences, { company: '', title: '', start_date: '', end_date: '', description: '' }]
                }));
            };

            const updateExperience = (index, field, value) => {
                setProfile(prev => ({
                    ...prev,
                    experiences: prev.experiences.map((exp, i) => i === index ? { ...exp, [field]: value } : exp)
                }));
            };

            const addEducation = () => {
                setProfile(prev => ({
                    ...prev,
                    education: [...prev.education, { school: '', degree: '', field: '', start_date: '', end_date: '' }]
                }));
            };

            const updateEducation = (index, field, value) => {
                setProfile(prev => ({
                    ...prev,
                    education: prev.education.map((edu, i) => i === index ? { ...edu, [field]: value } : edu)
                }));
            };

            const importFromLinkedIn = async () => {
                if (!profile.linkedin_url) {
                    alert('Klistra in din LinkedIn-URL först');
                    return;
                }
                setImporting(true);
                const token = localStorage.getItem('auth_token');
                try {
                    const res = await fetch('/api/user/import-linkedin', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ linkedin_url: profile.linkedin_url })
                    });
                    const data = await res.json();
                    if (data.success && data.profile) {
                        setProfile(prev => ({
                            ...prev,
                            ...data.profile,
                            linkedin_url: prev.linkedin_url
                        }));
                        alert('LinkedIn-profil importerad!');
                    } else {
                        alert(data.message || 'Kunde inte importera från LinkedIn. Fyll i manuellt.');
                    }
                } catch (err) {
                    alert('Kunde inte importera. Fyll i manuellt.');
                } finally {
                    setImporting(false);
                }
            };

            const handleSave = async () => {
                setSaving(true);
                const token = localStorage.getItem('auth_token');
                try {
                    // Save preferences
                    await fetch('/api/user/preferences', {
                        method: 'POST',

            const [batchApplying, setBatchApplying] = useState(false);
            const [readyJobs, setReadyJobs] = useState([]);
            const [selectedForBatch, setSelectedForBatch] = useState([]);

                } catch (err) {
                    console.error('Error fetching today session:', err);
                }
                setLoading(false);
            };

            const fetchReadyJobs = async () => {
                try {
                    const res = await fetch('/api/jobs/ready?limit=20');
                    const data = await res.json();
                    if (data.success) setReadyJobs(data.jobs || []);
                } catch (err) {
                    console.error('Error fetching ready jobs:', err);
                }
            };

            useEffect(() => {
                fetchTodaySession();
                fetchReadyJobs();
            }, []);

            const handleQuickApply = async (jobId) => {
                setQuickApplying(jobId);
                try {
                    const res = await fetch(`/api/quick-apply/${jobId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({})
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert(`${data.message}`);
                        fetchTodaySession();
                        fetchReadyJobs();
                    } else {
                        alert('Kunde inte skapa ansokan: ' + (data.detail || 'Okant fel'));
                    }
                } catch (err) {
                    alert('Fel vid snabbansokan');
                }
                setQuickApplying(null);
            };

            const handleBatchApply = async () => {
                if (selectedForBatch.length === 0) return;
                setBatchApplying(true);

                    const res = await fetch('/api/batch-apply', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            job_ids: selectedForBatch,
                            auto_draft: true
                        })
                    });
                    const data = await res.json();
                    setBatchResult(data);
                    fetchTodaySession();
                    fetchReadyJobs();
                    setSelectedForBatch([]);

                }
                setBatchApplying(false);
            };

                setSelectedForBatch(prev =>
                    prev.includes(jobId)
                        ? prev.filter(id => id !== jobId)
                        : [...prev, jobId]

            };

                return (
                    <div className="flex justify-center py-20">

                    </div>

            return (
                <div>

                            >

                                <div className="text-2xl font-bold text-indigo-600">{s.applied_today || 0}</div>

                            </div>

                                <div className="text-xs text-slate-500">Utkast skapade</div>
                            </div>

                                <div className="text-2xl font-bold text-amber-600">{s.pending_jobs || 0}</div>
