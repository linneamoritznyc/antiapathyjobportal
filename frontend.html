                                            <a href={job.url} target="_blank" className="px-3 py-1.5 text-sm border border-slate-200 rounded-lg hover:bg-slate-50">Se annons</a>
                                            <button
                                                onClick={() => handleQuickApply(job.id)}
                                                disabled={quickApplying === job.id}
                                                className="px-3 py-1.5 text-sm bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50"
                                            >
                                                {quickApplying === job.id ? '...' : 'Snabbansokan'}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Ready to apply (have email) */}
                    <div className="bg-white rounded-xl shadow-sm p-5 mb-6">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-semibold text-slate-800">
                                Redo att soka ({readyJobs.length} jobb med email)
                            </h3>
                            {selectedForBatch.length > 0 && (
                                <button
                                    onClick={handleBatchApply}
                                    disabled={batchApplying}
                                    className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50"
                                >
                                    {batchApplying ? 'Skapar ansokningar...' : `Sok till ${selectedForBatch.length} jobb`}
                                </button>
                            )}
                        </div>

                        {batchResult && (
                            <div className="bg-green-50 border border-green-200 rounded-lg p-3 mb-4">
                                <p className="text-sm text-green-800 font-medium">{batchResult.message}</p>
                                <div className="mt-2 space-y-1">
                                    {batchResult.results?.filter(r => r.success).map(r => (
                                        <p key={r.job_id} className="text-xs text-green-700">
                                            {r.title} hos {r.company} {r.draft_created ? '(utkast skapat)' : '(brev genererat)'}
                                        </p>
                                    ))}
                                </div>
                                <button
                                    onClick={() => setBatchResult(null)}
                                    className="text-xs text-green-600 hover:underline mt-2"
                                >
                                    Stang
                                </button>
                            </div>
                        )}

                        {readyJobs.length === 0 ? (
                            <div className="text-center py-8">
                                <p className="text-slate-500 mb-3">Inga jobb med email-adress hittade.</p>
                                <button
                                    onClick={() => onScrape('')}
                                    disabled={scraping}
                                    className="bg-indigo-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50"
                                >
                                    {scraping ? 'Soker...' : 'Sok nya jobb'}
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-2">
                                {readyJobs.map(job => (
                                    <div key={job.id} className="flex items-center gap-3 p-3 rounded-lg border border-slate-100 hover:border-slate-200 transition">
                                        <input
                                            type="checkbox"
                                            checked={selectedForBatch.includes(job.id)}
                                            onChange={() => toggleBatchSelect(job.id)}
                                            className="w-4 h-4 text-indigo-600 rounded border-slate-300"
                                        />
                                        <div className="flex-1 min-w-0">
                                            <p className="font-medium text-slate-800 truncate">{job.title}</p>
                                            <p className="text-sm text-slate-500">{job.company} - {job.location}</p>
                                            {job.deadline && (
                                                <p className="text-xs text-slate-400">
                                                    Deadline: {new Date(job.deadline).toLocaleDateString('sv-SE')}
                                                </p>
                                            )}
                                        </div>
                                        <div className="text-xs text-slate-400 hidden md:block">
                                            {job.contact_email}
                                        </div>
                                        <div className="flex gap-2">
                                            <a href={job.url} target="_blank" className="px-2 py-1 text-xs border border-slate-200 rounded hover:bg-slate-50">Se</a>
                                            <button
                                                onClick={() => handleQuickApply(job.id)}
                                                disabled={quickApplying === job.id}
                                                className="px-3 py-1 text-xs bg-indigo-600 text-white rounded hover:bg-indigo-700 disabled:opacity-50"
                                            >
                                                {quickApplying === job.id ? '...' : 'Snabbok'}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Today's completed applications */}
                    {s.today_applications && s.today_applications.length > 0 && (
                        <div className="bg-white rounded-xl shadow-sm p-5">
                            <h3 className="text-lg font-semibold text-slate-800 mb-3">Idag har du sokt</h3>
                            <div className="space-y-2">
                                {s.today_applications.map(app => (
                                    <div key={app.id} className="flex items-center justify-between p-3 bg-green-50 rounded-lg">
                                        <div>
                                            <p className="font-medium text-slate-800">{app.title}</p>
                                            <p className="text-sm text-slate-500">{app.company}</p>
                                        </div>
                                        <span className={`text-xs px-2 py-1 rounded-full ${
                                            app.status === 'draft_saved' ? 'bg-blue-100 text-blue-700' :
                                            app.status === 'sent' ? 'bg-green-100 text-green-700' :
                                            'bg-slate-100 text-slate-600'
                                        }`}>
                                            {app.status === 'draft_saved' ? 'Utkast' :
                                             app.status === 'sent' ? 'Skickad' :
                                             app.status === 'letter_generated' ? 'Brev klart' :
                                             app.status}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Tip */}
                    {session?.tip && (
                        <div className="mt-6 p-4 bg-indigo-50 border border-indigo-200 rounded-xl">
                            <p className="text-sm text-indigo-800">{session.tip}</p>
                        </div>
                    )}
                </div>
            );
        };

        // ============== MAIN APP ==============

        const App = () => {
            const [activeTab, setActiveTab] = useState('today');
            const [jobs, setJobs] = useState([]);
            const [vibes, setVibes] = useState([]);
            const [userCVs, setUserCVs] = useState([]);
            const [applications, setApplications] = useState([]);
            const [stats, setStats] = useState({});
            const [showOnboarding, setShowOnboarding] = useState(false);

            const [scraping, setScraping] = useState(false);
            const [generating, setGenerating] = useState(false);
            const [applyingJob, setApplyingJob] = useState(null);

            const [showApplyModal, setShowApplyModal] = useState(false);
            const [showCVModal, setShowCVModal] = useState(false);
            const [showMasterCVModal, setShowMasterCVModal] = useState(false);
            const [selectedJob, setSelectedJob] = useState(null);
            const [applyResult, setApplyResult] = useState(null);
            const [selectedVibe, setSelectedVibe] = useState(null);
            const [selectedCVText, setSelectedCVText] = useState('');
            const [masterCV, setMasterCV] = useState(null);
            const [savingMasterCV, setSavingMasterCV] = useState(false);

            // Fetch initial data
            useEffect(() => {
                fetchJobs();
                fetchVibes();
                fetchUserCVs();
                fetchApplications();
                fetchStats();
                checkOnboarding();
            }, []);

            const checkOnboarding = async () => {
                const token = localStorage.getItem('auth_token');
                if (!token) return;

                // Check if onboarding is complete
                const onboardingComplete = localStorage.getItem('onboarding_complete');
                if (onboardingComplete) return;

                // Check with server
                try {
                    const res = await fetch('/api/user/preferences', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (!data.success || !data.preferences?.job_titles) {
                        setShowOnboarding(true);
                    } else {
                        localStorage.setItem('onboarding_complete', 'true');
                    }
                } catch (err) {
                    // If error, show onboarding
                    setShowOnboarding(true);
                }
            };

            const fetchJobs = async () => {
                const res = await fetch('/api/jobs');
                const data = await res.json();
                if (data.success) setJobs(data.jobs || []);
            };

            const fetchVibes = async () => {
                const res = await fetch('/api/cv/vibes');
                const data = await res.json();
                if (data.success) setVibes(data.vibes || []);
            };

            const fetchUserCVs = async () => {
                const token = localStorage.getItem('auth_token');
                const res = await fetch('/api/cv/all', {
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                const data = await res.json();
                if (data.success) setUserCVs(data.cvs || []);
            };

            const fetchApplications = async () => {
                const res = await fetch('/api/applications');
                const data = await res.json();
                if (data.success) {
                    setApplications(data.applications || []);
                    // Extract saved job IDs
                    const saved = (data.applications || [])
                        .filter(a => a.status === 'saved')
                        .map(a => a.job_id);
                    setSavedJobs(saved);
                }
            };

            const [savedJobs, setSavedJobs] = useState([]);

            const handleSaveJob = (jobId, isSaved) => {
                if (isSaved) {
                    setSavedJobs(prev => [...prev, jobId]);
                } else {
                    setSavedJobs(prev => prev.filter(id => id !== jobId));
                }
                // Refresh applications list
                fetchApplications();
            };

            const fetchStats = async () => {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if (data.success) {
                    setStats({...data.stats, cv_vibes: userCVs.length});
                }
            };

            const fetchMasterCV = async () => {
                try {
                    const token = localStorage.getItem('auth_token');
                    if (!token) {
                        console.error('No auth token');
                        return false;
                    }
                    const res = await fetch('/api/cv/master', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!res.ok) {
                        console.error('Fetch master CV failed:', res.status);
                        return false;
                    }
                    const data = await res.json();
                    if (data.success && data.master_cv) {
                        setMasterCV(data.master_cv);
                    }
                    return true;
                } catch (err) {
                    console.error('Error fetching master CV:', err);
                    return false;
                }
            };

            const handleOpenMasterCV = async () => {
                await fetchMasterCV();
                setShowMasterCVModal(true);
            };

            const handleSaveMasterCV = async (editedCV) => {
                setSavingMasterCV(true);
                const token = localStorage.getItem('auth_token');

                try {
                    // Save experiences
                    for (const exp of editedCV.experiences) {
                        if (exp.id) {
                            // Update existing
                            await fetch(`/api/user/experience/${exp.id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify(exp)
                            });
                        } else {
                            // Create new
                            await fetch('/api/user/experience', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify(exp)
                            });
                        }
                    }

                    // Save education
                    for (const edu of editedCV.education) {
                        if (edu.id) {
                            await fetch(`/api/user/education/${edu.id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify(edu)
                            });
                        } else {
                            await fetch('/api/user/education', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify(edu)
                            });
                        }
                    }

                    // Save skills
                    for (const skill of (editedCV.skills || [])) {
                        if (skill.id) {
                            await fetch(`/api/user/skill/${skill.id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify(skill)
                            });
                        } else if (skill.skill_text) {
                            await fetch('/api/user/skill', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify(skill)
                            });
                        }
                    }

                    // Refresh master CV
                    await fetchMasterCV();
                    alert('Master CV sparad!');
                } catch (err) {
                    console.error('Error saving master CV:', err);
                    alert('Kunde inte spara. Försök igen.');
                } finally {
                    setSavingMasterCV(false);
                }
            };

            const handleScrape = async (keywords) => {
                setScraping(true);
                const kw = keywords.trim() ? keywords.split(',').map(k => k.trim()) : null;
                const res = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keywords: kw })
                });
                const data = await res.json();
                if (data.success) {
                    setJobs(data.jobs || []);
                    fetchStats();
                }
                setScraping(false);
            };

            const handleApply = async (job) => {
                setApplyingJob(job.id);
                setSelectedJob(job);

                const token = localStorage.getItem('auth_token');
                const res = await fetch(`/api/jobs/${job.id}/apply-with-cv`, {
                    method: 'POST',
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                const data = await res.json();

                if (data.success) {
                    setApplyResult(data);
                    setShowApplyModal(true);
                } else {
                    alert(data.detail || 'Kunde inte skapa ansökan. Har du genererat CV:n?');
                }
                setApplyingJob(null);
            };

            const handleSelectVibe = (vibe, userCV) => {
                setSelectedVibe(vibe);
                setSelectedCVText(userCV?.cv_text || '');
                setShowCVModal(true);
            };

            const handleSaveCV = async (vibeId, text) => {
                // Save or update CV
                const existingCV = userCVs.find(cv => cv.vibe_id === vibeId);

                if (existingCV) {
                    // Update
                    await fetch(`/api/cv/${vibeId}?cv_text=${encodeURIComponent(text)}`, { method: 'PATCH' });
                } else {
                    // Create (simplified - in real app, would need full data)
                    const vibe = vibes.find(v => v.id === vibeId);
                    await fetch('/api/cv/all', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            vibe_id: vibeId,
                            vibe_name: vibe?.name,
                            vibe_emoji: vibe?.emoji,
                            cv_text: text
                        })
                    });
                }

                fetchUserCVs();
                setShowCVModal(false);
            };

            const handleGenerateVibes = async () => {
                setGenerating(true);
                try {
                    const token = localStorage.getItem('auth_token');
                    const res = await fetch('/api/cv/generate-branscher', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                        },
                        body: JSON.stringify({})
                    });
                    const data = await res.json();
                    if (data.success) {
                        await fetchUserCVs();
                        alert(`${data.message || 'CV:n genererade!'}`);
                    } else {
                        alert(data.detail || data.message || 'Kunde inte generera CV:n. Lägg till erfarenheter först i Master CV.');
                    }
                } catch (err) {
                    console.error(err);
                    alert('Något gick fel vid genereringen.');
                }
                setGenerating(false);
            };

            const [migrating, setMigrating] = useState(false);
            const handleMigrateData = async () => {
                if (!confirm('Vill du ladda in fardiga CV:n och erfarenheter?')) return;
                setMigrating(true);
                try {
                    const token = localStorage.getItem('auth_token');
                    const res = await fetch('/api/migrate-my-data', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert('Data inladdat! Laddar om...');
                        window.location.reload();
                    } else {
                        alert(data.detail || 'Kunde inte ladda data.');
                    }
                } catch (err) {
                    console.error(err);
                    alert('Fel vid inladdning.');
                }
                setMigrating(false);
            };

            // Check auth on mount
            const [user, setUser] = useState(null);

            useEffect(() => {
                const storedUser = localStorage.getItem('user');
                if (storedUser) {
                    setUser(JSON.parse(storedUser));
                }
            }, []);

            const handleLogout = () => {
                localStorage.removeItem('auth_token');
                localStorage.removeItem('refresh_token');
                localStorage.removeItem('user');
                localStorage.removeItem('onboarding_complete');
                setUser(null);
                window.location.href = '/login';
            };

            // Show onboarding if needed
            if (showOnboarding && user) {
                return <OnboardingWizard onComplete={() => setShowOnboarding(false)} />;
            }

            // Landing page for non-logged-in users
            if (!user) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500">
                        <header className="px-6 py-5">
                            <div className="max-w-5xl mx-auto flex justify-between items-center">
                                <span className="text-white/90 font-mono text-sm tracking-wide">anti-apathy</span>
                                <a href="/login" className="text-white/70 hover:text-white text-sm transition">
                                    Logga in →
                                </a>
                            </div>
                        </header>

                        <main className="px-6">
                            <div className="max-w-5xl mx-auto">
                                {/* Hero - left aligned */}
                                <div className="py-20 max-w-xl">
                                    <h1 className="text-4xl md:text-5xl font-bold text-white leading-tight mb-6">
                                        Jobbsökande<br/>
                                        utan ångest.
                                    </h1>
                                    <p className="text-white/80 text-lg mb-8 leading-relaxed">
                                        Skräddarsydda CV:n för olika branscher. AI-genererade personliga brev.
                                        Allt på ett ställe så du kan fokusera på det som spelar roll.
                                    </p>
                                    <a href="/login" className="inline-block bg-white text-indigo-700 px-6 py-3 text-sm font-semibold hover:bg-white/90 transition">
                                        Kom igång
                                    </a>
                                </div>

                                {/* Features - asymmetric grid */}
                                <div className="border-t border-white/20 py-16">
                                    <div className="grid md:grid-cols-2 gap-x-16 gap-y-10">
                                        <div>
                                            <h3 className="text-white font-semibold mb-2">Master CV</h3>
                                            <p className="text-white/60 text-sm leading-relaxed">
                                                All din erfarenhet, utbildning och kompetenser samlade.
                                                Uppdatera en gång, använd överallt.
                                            </p>
                                        </div>
                                        <div>
                                            <h3 className="text-white font-semibold mb-2">Branschanpassade versioner</h3>
                                            <p className="text-white/60 text-sm leading-relaxed">
                                                Restaurang, kundtjänst, tech, butik, vård. Varje version
                                                lyfter rätt erfarenheter för rätt jobb.
                                            </p>
                                        </div>
                                        <div>
                                            <h3 className="text-white font-semibold mb-2">Platsbanken-integration</h3>
                                            <p className="text-white/60 text-sm leading-relaxed">
                                                Hämta jobb direkt från Arbetsförmedlingen. Se vilka som
                                                accepterar mail-ansökningar.
                                            </p>
                                        </div>
                                        <div>
                                            <h3 className="text-white font-semibold mb-2">Personliga brev</h3>
                                            <p className="text-white/60 text-sm leading-relaxed">
                                                AI skriver brevet baserat på ditt CV och jobbannonsen.
                                                Granska, justera, skicka.
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {/* How it works - minimal */}
                                <div className="border-t border-white/20 py-12">
                                    <p className="text-white/50 text-sm mb-6">Så funkar det</p>
                                    <div className="flex flex-wrap gap-6 text-white/80 text-sm">
                                        <span>1. Skapa konto</span>
                                        <span className="text-white/30">→</span>
                                        <span>2. Fyll i Master CV</span>
                                        <span className="text-white/30">→</span>
                                        <span>3. Generera bransch-CV:n</span>
                                        <span className="text-white/30">→</span>
                                        <span>4. Sök jobb</span>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="px-6 py-8 border-t border-white/10 mt-12">
                            <div className="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 text-white/40 text-xs">
                                <div className="flex gap-6">
                                    <a href="/integritetspolicy" className="hover:text-white/70">Integritetspolicy</a>
                                    <a href="/anvandarvillkor" className="hover:text-white/70">Användarvillkor</a>
                                </div>
                                <span>2026</span>
                            </div>
                        </footer>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    <header className="gradient text-white py-6 px-4">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <h1 className="text-2xl font-bold">Anti-Apathy Job Portal</h1>
                                    <p className="opacity-80 text-sm">Sök jobb utan apati. En ansökan i taget.</p>
                                </div>
                                <UserMenu user={user} onLogout={handleLogout} />
                            </div>
                            <NavTabs activeTab={activeTab} setActiveTab={setActiveTab} />
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-6">
                        <Stats stats={{...stats, cv_vibes: userCVs.length}} />

                        {activeTab === 'today' && (
                            <TodayPage
                                onScrape={handleScrape}
                                scraping={scraping}
                                onApply={handleApply}
                                applyingJob={applyingJob}
                            />
                        )}

                        {activeTab === 'jobs' && (
                            <JobsPage
                                jobs={jobs}
                                onScrape={handleScrape}
                                onApply={handleApply}
                                scraping={scraping}
                                applyingJob={applyingJob}
                                savedJobs={savedJobs}
                                onSaveJob={handleSaveJob}
                            />
                        )}

                        {activeTab === 'cvs' && (
                            <CVsPage
                                vibes={vibes}
                                userCVs={userCVs}
                                onSelectVibe={handleSelectVibe}
                                onGenerateVibes={handleGenerateVibes}
                                generating={generating}
                                onOpenMasterCV={handleOpenMasterCV}
                                onMigrate={handleMigrateData}
                                migrating={migrating}
                            />
                        )}

                        {activeTab === 'applications' && (
                            <ApplicationsPage
                                applications={applications}
                                onRefresh={fetchApplications}
                            />
                        )}
                    </main>

                    <ApplyModal
                        isOpen={showApplyModal}
                        job={selectedJob}
                        result={applyResult}
                        onClose={() => { setShowApplyModal(false); fetchApplications(); fetchStats(); }}
                        onSaveApplication={() => { fetchApplications(); fetchStats(); }}
                    />

                    <CVModal
                        isOpen={showCVModal}
                        vibe={selectedVibe}
                        cvText={selectedCVText}
                        onClose={() => setShowCVModal(false)}
                        onSave={handleSaveCV}
                    />

                    <MasterCVEditor
                        isOpen={showMasterCVModal}
                        masterCV={masterCV}
                        onClose={() => setShowMasterCVModal(false)}
                        onSave={handleSaveMasterCV}
                        saving={savingMasterCV}
                    />

                    <footer className="border-t border-slate-200 mt-8">
                        <div className="max-w-6xl mx-auto px-4 py-6 text-center text-sm text-slate-500">
                            <div className="flex justify-center gap-4 mb-2">
                                <a href="/integritetspolicy" className="hover:text-indigo-600">Integritetspolicy</a>
                                <span>·</span>
                                <a href="/anvandarvillkor" className="hover:text-indigo-600">Användarvillkor</a>
                            </div>
                            <p>© 2026 Platsbanken AI</p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
