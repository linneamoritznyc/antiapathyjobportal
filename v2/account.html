<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt konto - Platsbanken AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- VERSION: 2025-02-16-v3-with-uploads -->
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Toast notification system
        const Toast = ({ message, type, onClose }) => (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 animate-slide-in ${
                type === 'success' ? 'bg-green-600 text-white' :
                type === 'error' ? 'bg-red-600 text-white' :
                'bg-slate-800 text-white'
            }`}>
                <span>{message}</span>
                <button onClick={onClose} className="hover:opacity-70">✕</button>
            </div>
        );

        const AccountPage = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const [activeTab, setActiveTab] = useState('cv'); // 'cv', 'profile', or 'settings'

            // Form states
            const [profile, setProfile] = useState({ first_name: '', last_name: '', phone: '', age: '' });
            const [passwords, setPasswords] = useState({ current: '', new: '', confirm: '' });
            const [deleteConfirm, setDeleteConfirm] = useState('');
            const [showDeleteModal, setShowDeleteModal] = useState(false);

            // Loading states
            const [savingProfile, setSavingProfile] = useState(false);
            const [savingPassword, setSavingPassword] = useState(false);
            const [exporting, setExporting] = useState(false);
            const [deleting, setDeleting] = useState(false);

            // File upload states
            const [uploadingCV, setUploadingCV] = useState(false);
            const [uploadingPhoto, setUploadingPhoto] = useState(false);
            const [uploadingLetter, setUploadingLetter] = useState(false);
            const [cvFile, setCVFile] = useState(null);
            const [photoPreview, setPhotoPreview] = useState(null);
            const [letterFile, setLetterFile] = useState(null);

            useEffect(() => {
                checkAuth();
                // Check URL hash for tab
                if (window.location.hash === '#settings') {
                    setActiveTab('settings');
                }
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const checkAuth = async () => {
                const token = localStorage.getItem('auth_token');
                const storedUser = localStorage.getItem('user');

                if (!token || !storedUser) {
                    window.location.href = '/login';
                    return;
                }

                const userData = JSON.parse(storedUser);
                setUser(userData);

                // Split full_name into first and last name
                const nameParts = (userData.full_name || '').split(' ');
                const firstName = nameParts[0] || '';
                const lastName = nameParts.slice(1).join(' ') || '';

                setProfile({
                    first_name: firstName,
                    last_name: lastName,
                    phone: userData.phone || '',
                    age: userData.age || ''
                });
                setLoading(false);
            };

            const handleSaveProfile = async (e) => {
                e.preventDefault();
                setSavingProfile(true);
                const token = localStorage.getItem('auth_token');

                // Combine first and last name
                const fullName = `${profile.first_name} ${profile.last_name}`.trim();

                try {
                    const res = await fetch('/api/user/profile', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            full_name: fullName,
                            phone: profile.phone,
                            age: profile.age ? parseInt(profile.age) : null
                        })
                    });

                    if (res.ok) {
                        // Update local storage
                        const updatedUser = { ...user, full_name: fullName, phone: profile.phone, age: profile.age };
                        localStorage.setItem('user', JSON.stringify(updatedUser));
                        setUser(updatedUser);
                        showToast('Profil sparad!');
                    } else {
                        showToast('Kunde inte spara profilen.', 'error');
                    }
                } catch (err) {
                    showToast('Något gick fel.', 'error');
                } finally {
                    setSavingProfile(false);
                }
            };

            const handleChangePassword = async (e) => {
                e.preventDefault();

                if (passwords.new !== passwords.confirm) {
                    showToast('Lösenorden matchar inte.', 'error');
                    return;
                }

                if (passwords.new.length < 8) {
                    showToast('Lösenordet måste vara minst 8 tecken.', 'error');
                    return;
                }

                setSavingPassword(true);
                const token = localStorage.getItem('auth_token');

                try {
                    const res = await fetch('/api/auth/update-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ new_password: passwords.new })
                    });

                    if (res.ok) {
                        setPasswords({ current: '', new: '', confirm: '' });
                        showToast('Lösenordet har ändrats!');
                    } else {
                        showToast('Kunde inte ändra lösenordet.', 'error');
                    }
                } catch (err) {
                    showToast('Något gick fel.', 'error');
                } finally {
                    setSavingPassword(false);
                }
            };

            const handleExportData = async () => {
                setExporting(true);
                const token = localStorage.getItem('auth_token');

                try {
                    const res = await fetch('/api/auth/export-data', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();

                    if (data.success) {
                        const blob = new Blob([JSON.stringify(data.export, null, 2)], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `platsbanken-ai-data-${new Date().toISOString().split('T')[0]}.json`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        showToast('Data exporterad!');
                    } else {
                        showToast('Kunde inte exportera data.', 'error');
                    }
                } catch (err) {
                    showToast('Något gick fel.', 'error');
                } finally {
                    setExporting(false);
                }
            };

            const handleDeleteAccount = async () => {
                if (deleteConfirm !== 'RADERA') {
                    showToast('Skriv RADERA för att bekräfta.', 'error');
                    return;
                }

                setDeleting(true);
                const token = localStorage.getItem('auth_token');

                try {
                    const res = await fetch('/api/auth/delete-account', {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();

                    if (data.success) {
                        localStorage.clear();
                        window.location.href = '/login';
                    } else {
                        showToast('Kunde inte radera kontot.', 'error');
                    }
                } catch (err) {
                    showToast('Något gick fel.', 'error');
                } finally {
                    setDeleting(false);
                }
            };

            const handleCVUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setCVFile(file.name);
                setUploadingCV(true);

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const token = localStorage.getItem('auth_token');
                    const res = await fetch('/api/cv/upload-and-analyze', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });

                    if (!res.ok) {
                        const errorData = await res.json().catch(() => ({}));
                        const errorMsg = errorData.detail || 'Kunde inte ladda upp CV';
                        showToast(errorMsg, 'error');
                        setUploadingCV(false);
                        return;
                    }

                    const data = await res.json();

                    if (data.profile_data) {
                        // Auto-fill profile with extracted data
                        if (data.profile_data.full_name) {
                            const nameParts = data.profile_data.full_name.split(' ');
                            const firstName = nameParts[0] || '';
                            const lastName = nameParts.slice(1).join(' ') || '';
                            setProfile(prev => ({
                                ...prev,
                                first_name: firstName,
                                last_name: lastName
                            }));
                        }
                        if (data.profile_data.phone) {
                            setProfile(prev => ({ ...prev, phone: data.profile_data.phone }));
                        }
                        showToast('CV uppladdad! Profil uppdaterad automatiskt.');
                    } else {
                        showToast('CV uppladdad men kunde inte extrahera data.', 'error');
                    }
                } catch (err) {
                    console.error('CV upload error:', err);
                    showToast('Nätverksfel. Försök igen.', 'error');
                } finally {
                    setUploadingCV(false);
                }
            };

            const handlePhotoUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // Show preview
                const reader = new FileReader();
                reader.onload = (e) => setPhotoPreview(e.target.result);
                reader.readAsDataURL(file);

                setUploadingPhoto(true);

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const token = localStorage.getItem('auth_token');
                    const res = await fetch('/api/upload/profile-photo', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });

                    const data = await res.json();

                    if (res.ok) {
                        showToast('Profilbild uppladdad!');
                    } else {
                        showToast('Kunde inte ladda upp bild.', 'error');
                    }
                } catch (err) {
                    console.error('Photo upload error:', err);
                    showToast('Kunde inte ladda upp bild.', 'error');
                } finally {
                    setUploadingPhoto(false);
                }
            };

            const handleLetterUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setLetterFile(file.name);
                setUploadingLetter(true);

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const token = localStorage.getItem('auth_token');
                    const res = await fetch('/api/upload/training-letter', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });

                    const data = await res.json();

                    if (res.ok) {
                        showToast('Praktikbrev uppladdad! Din skrivstil har analyserats.');
                    } else {
                        showToast('Kunde inte ladda upp praktikbrev.', 'error');
                    }
                } catch (err) {
                    console.error('Letter upload error:', err);
                    showToast('Kunde inte ladda upp praktikbrev.', 'error');
                } finally {
                    setUploadingLetter(false);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('auth_token');
                localStorage.removeItem('refresh_token');
                localStorage.removeItem('user');
                localStorage.removeItem('onboarding_complete');
                window.location.href = '/login';
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50">
                    {toast && <Toast {...toast} onClose={() => setToast(null)} />}

                    {/* Header */}
                    <header className="bg-white border-b border-slate-200">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <a href="/" className="text-slate-400 hover:text-slate-600">
                                    ← Tillbaka
                                </a>
                                <h1 className="text-xl font-bold text-slate-800">Mitt konto</h1>
                            </div>
                            <button
                                onClick={handleLogout}
                                className="text-slate-600 hover:text-slate-800 text-sm"
                            >
                                Logga ut
                            </button>
                        </div>
                    </header>

                    {/* Main content */}
                    <main className="max-w-4xl mx-auto px-4 py-8">

                        {/* Tabs */}
                        <div className="flex gap-1 mb-6 bg-slate-100 p-1 rounded-lg w-fit">
                            <button
                                onClick={() => { setActiveTab('cv'); window.history.replaceState(null, '', '/account'); }}
                                className={`px-4 py-2 rounded-md text-sm font-medium transition ${
                                    activeTab === 'cv'
                                        ? 'bg-white text-slate-800 shadow-sm'
                                        : 'text-slate-600 hover:text-slate-800'
                                }`}
                            >
                                📄 Mina CV
                            </button>
                            <button
                                onClick={() => { setActiveTab('profile'); window.history.replaceState(null, '', '/account#profile'); }}
                                className={`px-4 py-2 rounded-md text-sm font-medium transition ${
                                    activeTab === 'profile'
                                        ? 'bg-white text-slate-800 shadow-sm'
                                        : 'text-slate-600 hover:text-slate-800'
                                }`}
                            >
                                Mitt konto
                            </button>
                            <button
                                onClick={() => { setActiveTab('settings'); window.history.replaceState(null, '', '/account#settings'); }}
                                className={`px-4 py-2 rounded-md text-sm font-medium transition ${
                                    activeTab === 'settings'
                                        ? 'bg-white text-slate-800 shadow-sm'
                                        : 'text-slate-600 hover:text-slate-800'
                                }`}
                            >
                                Inställningar
                            </button>
                        </div>

                        <div className="space-y-8">

                        {/* Profile Section - only show on profile tab */}
                        {activeTab === 'profile' && (
                        <section className="bg-white rounded-xl border border-slate-200 p-6">
                            <h2 className="text-lg font-semibold text-slate-800 mb-4">Profil</h2>
                            <form onSubmit={handleSaveProfile} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">
                                        E-postadress
                                    </label>
                                    <input
                                        type="email"
                                        value={user?.email || ''}
                                        disabled
                                        className="w-full px-4 py-2 border border-slate-200 rounded-lg bg-slate-50 text-slate-500"
                                    />
                                    <p className="text-xs text-slate-500 mt-1">E-postadressen kan inte ändras.</p>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">
                                            Förnamn
                                        </label>
                                        <input
                                            type="text"
                                            value={profile.first_name}
                                            onChange={(e) => setProfile({ ...profile, first_name: e.target.value })}
                                            placeholder="Anna"
                                            className="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">
                                            Efternamn
                                        </label>
                                        <input
                                            type="text"
                                            value={profile.last_name}
                                            onChange={(e) => setProfile({ ...profile, last_name: e.target.value })}
                                            placeholder="Andersson"
                                            className="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">
                                            Telefon
                                        </label>
                                        <input
                                            type="tel"
                                            value={profile.phone}
                                            onChange={(e) => setProfile({ ...profile, phone: e.target.value })}
                                            placeholder="070-123 45 67"
                                            className="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">
                                            Ålder
                                        </label>
                                        <input
                                            type="number"
                                            value={profile.age}
                                            onChange={(e) => setProfile({ ...profile, age: e.target.value })}
                                            placeholder="28"
                                            min="16"
                                            max="100"
                                            className="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                    </div>
                                </div>
                                <button
                                    type="submit"
                                    disabled={savingProfile}
                                    className="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50"
                                >
                                    {savingProfile ? 'Sparar...' : 'Spara ändringar'}
                                </button>
                            </form>
                        </section>
                        )}

                        {/* File Uploads Section - only show on CV tab */}
                        {activeTab === 'cv' && (
                        <>
                        {/* CV Upload */}
                        <section className="bg-white rounded-xl border border-slate-200 p-6">
                            <h2 className="text-lg font-semibold text-slate-800 mb-4">📄 CV</h2>
                            <p className="text-sm text-slate-600 mb-4">
                                Ladda upp ditt CV så fyller vi i din profil automatiskt med AI.
                            </p>
                            <div className="space-y-4">
                                <div className="flex items-center gap-4">
                                    <input
                                        type="file"
                                        id="cv-upload"
                                        accept=".pdf,.doc,.docx,.txt,.rtf,.odt"
                                        onChange={handleCVUpload}
                                        className="hidden"
                                    />
                                    <label
                                        htmlFor="cv-upload"
                                        className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 cursor-pointer"
                                    >
                                        Välj CV-fil
                                    </label>
                                    {uploadingCV && <span className="text-sm text-slate-600">Laddar upp...</span>}
                                </div>
                                {cvFile && (
                                    <div className="flex items-center gap-2 text-sm text-slate-700 bg-slate-50 p-3 rounded-lg">
                                        <span>📎 {cvFile}</span>
                                        <button onClick={() => setCVFile(null)} className="text-red-600 hover:text-red-800 ml-auto">✕</button>
                                    </div>
                                )}
                            </div>
                        </section>

                        {/* Profile Photo Upload */}
                        <section className="bg-white rounded-xl border border-slate-200 p-6">
                            <h2 className="text-lg font-semibold text-slate-800 mb-4">📸 Profilbild</h2>
                            <p className="text-sm text-slate-600 mb-4">
                                Ladda upp en profilbild (valfritt).
                            </p>
                            <div className="space-y-4">
                                <div className="flex items-center gap-4">
                                    <input
                                        type="file"
                                        id="photo-upload"
                                        accept="image/jpeg,image/png,image/jpg,image/webp"
                                        onChange={handlePhotoUpload}
                                        className="hidden"
                                    />
                                    <label
                                        htmlFor="photo-upload"
                                        className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 cursor-pointer"
                                    >
                                        Välj bild
                                    </label>
                                    {uploadingPhoto && <span className="text-sm text-slate-600">Laddar upp...</span>}
                                </div>
                                {photoPreview && (
                                    <div className="mt-4">
                                        <img src={photoPreview} alt="Profilbild" className="w-32 h-32 rounded-full object-cover border-2 border-slate-200" />
                                    </div>
                                )}
                            </div>
                        </section>

                        {/* Training Letter Upload */}
                        <section className="bg-white rounded-xl border border-slate-200 p-6">
                            <h2 className="text-lg font-semibold text-slate-800 mb-4">✍️ Praktikbrev</h2>
                            <p className="text-sm text-slate-600 mb-4">
                                Ladda upp ett tidigare personligt brev så kan AI matcha din skrivstil.
                            </p>
                            <div className="space-y-4">
                                <div className="flex items-center gap-4">
                                    <input
                                        type="file"
                                        id="letter-upload"
                                        accept=".pdf,.doc,.docx,.txt"
                                        onChange={handleLetterUpload}
                                        className="hidden"
                                    />
                                    <label
                                        htmlFor="letter-upload"
                                        className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 cursor-pointer"
                                    >
                                        Välj praktikbrev
                                    </label>
                                    {uploadingLetter && <span className="text-sm text-slate-600">Laddar upp...</span>}
                                </div>
                                {letterFile && (
                                    <div className="flex items-center gap-2 text-sm text-slate-700 bg-slate-50 p-3 rounded-lg">
                                        <span>📎 {letterFile}</span>
                                        <button onClick={() => setLetterFile(null)} className="text-red-600 hover:text-red-800 ml-auto">✕</button>
                                    </div>
                                )}
                            </div>
                        </section>
                        </>
                        )}

                        {/* Settings Tab Content */}
                        {activeTab === 'settings' && (
                        <>
                        {/* Security Section */}
                        <section className="bg-white rounded-xl border border-slate-200 p-6">
                            <h2 className="text-lg font-semibold text-slate-800 mb-4">Säkerhet</h2>
                            <form onSubmit={handleChangePassword} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">
                                        Nuvarande lösenord
                                    </label>
                                    <input
                                        type="password"
                                        value={passwords.current}
                                        onChange={(e) => setPasswords({ ...passwords, current: e.target.value })}
                                        className="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">
                                        Nytt lösenord
                                    </label>
                                    <input
                                        type="password"
                                        value={passwords.new}
                                        onChange={(e) => setPasswords({ ...passwords, new: e.target.value })}
                                        placeholder="Minst 8 tecken"
                                        className="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">
                                        Bekräfta nytt lösenord
                                    </label>
                                    <input
                                        type="password"
                                        value={passwords.confirm}
                                        onChange={(e) => setPasswords({ ...passwords, confirm: e.target.value })}
                                        className="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                    />
                                </div>
                                <button
                                    type="submit"
                                    disabled={savingPassword || !passwords.new}
                                    className="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50"
                                >
                                    {savingPassword ? 'Ändrar...' : 'Ändra lösenord'}
                                </button>
                            </form>
                        </section>

                        {/* GDPR Section */}
                        <section className="bg-white rounded-xl border border-slate-200 p-6">
                            <h2 className="text-lg font-semibold text-slate-800 mb-4">Dina uppgifter</h2>
                            <p className="text-slate-600 text-sm mb-4">
                                Enligt GDPR har du rätt att få ut alla dina uppgifter. Klicka nedan för att ladda ner en fil med all din data.
                            </p>
                            <button
                                onClick={handleExportData}
                                disabled={exporting}
                                className="px-6 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 disabled:opacity-50"
                            >
                                {exporting ? 'Exporterar...' : 'Exportera mina uppgifter'}
                            </button>
                            <p className="text-xs text-slate-500 mt-3">
                                <a href="/integritetspolicy" className="text-indigo-600 hover:underline">
                                    Läs vår integritetspolicy
                                </a>
                            </p>
                        </section>

                        {/* Radera konto-sektion */}
                        <section className="bg-white rounded-xl border-2 border-red-200 p-6">
                            <h2 className="text-lg font-semibold text-red-600 mb-2">Radera konto</h2>
                            <p className="text-slate-600 text-sm mb-4">
                                När du raderar ditt konto tas all din data bort permanent. Detta inkluderar alla CV:n, ansökningar och inställningar. <strong>Detta går inte att ångra.</strong>
                            </p>
                            <button
                                onClick={() => setShowDeleteModal(true)}
                                className="px-6 py-2 border-2 border-red-300 text-red-600 rounded-lg hover:bg-red-50"
                            >
                                Radera mitt konto
                            </button>
                        </section>
                        </>
                        )}

                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-slate-200 mt-16">
                        <div className="max-w-4xl mx-auto px-4 py-6 text-center text-sm text-slate-500">
                            <div className="flex justify-center gap-4 mb-2">
                                <a href="/integritetspolicy" className="hover:text-indigo-600">Integritetspolicy</a>
                                <span>·</span>
                                <a href="/anvandarvillkor" className="hover:text-indigo-600">Användarvillkor</a>
                            </div>
                            <p>© 2026 Platsbanken AI</p>
                        </div>
                    </footer>

                    {/* Delete Confirmation Modal */}
                    {showDeleteModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6">
                                <h3 className="text-xl font-bold text-red-600 mb-2">Är du säker?</h3>
                                <p className="text-slate-600 mb-4">
                                    All din data kommer att raderas permanent. Skriv <strong>RADERA</strong> för att bekräfta.
                                </p>
                                <input
                                    type="text"
                                    value={deleteConfirm}
                                    onChange={(e) => setDeleteConfirm(e.target.value)}
                                    placeholder="Skriv RADERA"
                                    className="w-full px-4 py-2 border border-slate-200 rounded-lg mb-4 focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                />
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => { setShowDeleteModal(false); setDeleteConfirm(''); }}
                                        className="flex-1 px-4 py-2 border border-slate-200 rounded-lg hover:bg-slate-50"
                                    >
                                        Avbryt
                                    </button>
                                    <button
                                        onClick={handleDeleteAccount}
                                        disabled={deleting || deleteConfirm !== 'RADERA'}
                                        className="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50"
                                    >
                                        {deleting ? 'Raderar...' : 'Radera permanent'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<AccountPage />);
    </script>
    <style>
        @keyframes slide-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slide-in 0.3s ease-out;
        }
    </style>
    <div style="position:fixed;bottom:10px;right:10px;font-size:10px;color:#999;background:#fff;padding:4px 8px;border-radius:4px;border:1px solid #ddd;">
        v3-uploads-2025-02-16
    </div>
</body>
</html>
