            }, []);

            const fetchUploadedLetters = async () => {
                const token = localStorage.getItem('auth_token');
                if (!token) return;
                try {
                    const res = await fetch('/api/user/training-letters', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setUploadedLetters(data.letters || []);
                    }
                } catch(e) {}
            };

            const deleteLetter = async (id) => {
                const token = localStorage.getItem('auth_token');
                if (!token) return;
                setDeletingId(id);
                try {
                    const res = await fetch(`/api/user/training-letters/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        setUploadedLetters(prev => prev.filter(l => l.id !== id));
                    }
                } catch(e) {}
                setDeletingId(null);
            };

            const fetchLetterStyle = async () => {
                const token = localStorage.getItem('auth_token');
                if (!token) { setLoadingStyle(false); return; }
                try {
                    const res = await fetch('/api/user/letter-style', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setLetterStyle(data.style_summary || null);
                    }
                } catch(e) {}
                setLoadingStyle(false);
            };

            const uploadFile = async (file) => {
                const token = localStorage.getItem('auth_token');
                if (!token || !file) return;
                setUploading(true);
                setSaveStatus('Analyserar brev...');
                const formData = new FormData();
                formData.append('file', file);
                formData.append('type', 'cover_letter');
                try {
                    const res = await fetch('/api/user/upload-training-letter', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    const data = await res.json();
                    if (data.success) {
                        setSaveStatus('✓ AI har analyserat ditt brev!');
                        await fetchLetterStyle();
                        await fetchUploadedLetters();
                    } else {
                        setSaveStatus(data.detail || 'Något gick fel. Försök igen.');
                    }
                } catch(e) {
                    setSaveStatus('Något gick fel. Försök igen.');
                }
                setUploading(false);
            };

            const handleUpload = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.pdf,.docx,.doc,.txt,.rtf,.odt';
                input.onchange = (e) => uploadFile(e.target.files[0]);
                input.click();
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                const file = e.dataTransfer.files[0];
                if (file) uploadFile(file);
            };

            const handlePasteSubmit = async () => {
                if (!pastedText.trim()) return;
                const token = localStorage.getItem('auth_token');
                if (!token) return;
                setLoading(true);
                setSaveStatus('Analyserar text...');
                try {
                    const res = await fetch('/api/user/analyze-letter-text', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ text: pastedText })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setSaveStatus('✓ AI har analyserat din text!');
                        await fetchLetterStyle();
                    } else {
                        setSaveStatus('Något gick fel. Försök igen.');
                    }
                } catch(e) {
                    setSaveStatus('Något gick fel. Försök igen.');
                }
                setLoading(false);
            };

            return (
                <div className="max-w-3xl mx-auto space-y-6">
                    <div className="flex items-center gap-3 mb-2">
                        <h2 className="text-2xl font-bold">✍️ Personligt brev — preferenser</h2>
                    </div>

                    {/* Explanation */}
                    <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-5">
                        <h3 className="font-semibold text-indigo-900 mb-2">💡 Hur detta fungerar</h3>
                        <p className="text-sm text-indigo-800 leading-relaxed">
                            AI läser igenom ett eller flera personliga brev du skrivit och lär sig din stil — din ton, hur du presenterar dig, vilka fraser du brukar använda.
                            <br/><br/>
                            Du kan se exakt vad AI har lärt sig nedan, och ge specifik feedback. Det är mycket enklare att säga <em>"jag vill inte att du skriver 'passionerad'"</em> än att säga <em>"låt det låta mer som mig"</em>.
                        </p>
                    </div>

                    {/* Upload or paste */}
                    <div className="bg-white rounded-xl p-6 border border-slate-200">
                        <h3 className="text-lg font-semibold mb-1">📤 Träna din AI</h3>
                        <p className="text-sm text-slate-500 mb-4">
                            Vi säljer aldrig din data. Brevet används enbart för att göra dina ansökningar bättre.{' '}
                            <a href="https://gdpr.eu/what-is-gdpr/" target="_blank" rel="noopener noreferrer" className="text-indigo-500 underline hover:text-indigo-700">Läs mer om GDPR</a>.
                        </p>

                        {/* Mode toggle */}
                        <div className="flex gap-2 mb-5 p-1 bg-slate-100 rounded-lg w-fit">
                            <button
                                onClick={() => setMode('upload')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${mode === 'upload' ? 'bg-white shadow text-slate-800' : 'text-slate-500'}`}
                            >
                                📂 Ladda upp fil
                            </button>
                            <button
                                onClick={() => setMode('paste')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${mode === 'paste' ? 'bg-white shadow text-slate-800' : 'text-slate-500'}`}
                            >
                                📋 Klistra in text
                            </button>
                        </div>

                        {mode === 'upload' && (
                            <div
                                onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
                                onDragLeave={() => setDragOver(false)}
                                onDrop={handleDrop}
                                onClick={!uploading ? handleUpload : undefined}
                                className={`w-full border-2 border-dashed rounded-xl py-12 text-center transition cursor-pointer select-none ${
                                    uploading ? 'opacity-50 cursor-default' :
                                    dragOver ? 'border-indigo-500 bg-indigo-50 text-indigo-600 scale-[1.01]' :
                                    'border-slate-300 hover:border-indigo-400 text-slate-500 hover:text-indigo-600'
                                }`}
                            >
                                <div className="text-4xl mb-2">{dragOver ? '📥' : uploading ? '⏳' : '📂'}</div>
                                <div className="font-medium text-base">
                                    {uploading ? 'Analyserar...' : dragOver ? 'Släpp filen här' : 'Dra hit en fil, eller klicka för att välja'}
                                </div>
                                <div className="text-xs mt-1 text-slate-400">PDF, DOCX, DOC, TXT, RTF, ODT</div>
                            </div>
                        )}

                        {mode === 'paste' && (
                            <div>
                                <textarea
                                    value={pastedText}
                                    onChange={e => setPastedText(e.target.value)}
                                    placeholder="Klistra in ditt personliga brev här..."
                                    rows={10}
                                    className="w-full border border-slate-300 rounded-xl p-4 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"
                                />
                                <button
                                    onClick={handlePasteSubmit}
                                    disabled={loading || !pastedText.trim()}
                                    className="mt-3 w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 disabled:opacity-50"
                                >
                                    {loading ? 'Analyserar...' : '🔍 Analysera brevets stil'}
                                </button>
                            </div>
                        )}

                        {saveStatus && (
                            <div className={`mt-4 p-3 rounded-lg text-sm ${saveStatus.startsWith('✓') ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'}`}>
                                {saveStatus}
                            </div>
                        )}
                    </div>

                    {/* Uploaded letters list */}
                    {uploadedLetters.length > 0 && (
                        <div className="bg-white rounded-xl p-6 border border-slate-200">
                            <h3 className="text-lg font-semibold mb-1">📚 Dina uppladdade brev</h3>
                            <p className="text-sm text-slate-500 mb-4">
                                {uploadedLetters.length} av 20 brev uppladdade
                            </p>
                            <div className="space-y-2">
                                {uploadedLetters.map(letter => (
                                    <div key={letter.id} className="flex items-center justify-between bg-slate-50 rounded-lg px-4 py-3 border border-slate-100">
                                        <div className="flex items-center gap-3 min-w-0">
                                            <span className="text-lg flex-shrink-0">📄</span>
                                            <div className="min-w-0">
                                                <div className="text-sm font-medium text-slate-700 truncate">{letter.filename}</div>
                                                <div className="text-xs text-slate-400">
                                                    {new Date(letter.uploaded_at).toLocaleDateString('sv-SE')}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 flex-shrink-0">
                                            {letter.file_url && (
                                                <a
                                                    href={letter.file_url}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="text-indigo-600 hover:text-indigo-800 text-sm font-medium"
                                                >
                                                    Visa
                                                </a>
                                            )}
                                            <button
                                                onClick={() => deleteLetter(letter.id)}
                                                disabled={deletingId === letter.id}
                                                className="text-red-400 hover:text-red-600 text-sm disabled:opacity-50"
                                            >
                                                {deletingId === letter.id ? '...' : '✕'}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* AI style summary */}
                    <div className="bg-white rounded-xl p-6 border border-slate-200">
                        <h3 className="text-lg font-semibold mb-1">🤖 Vad AI vet om din stil</h3>
                        <p className="text-sm text-slate-500 mb-4">
                            Detta är exakt hur AI förstår din skrivstil. Om något stämmer dåligt — uppdatera det!
                        </p>

                        {loadingStyle ? (
                            <div className="text-slate-400 text-sm">Laddar...</div>
                        ) : letterStyle ? (
                            <div className="space-y-4">
                                {letterStyle.tone && (
                                    <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">🎭 Ton</div>
                                        <div className="text-sm text-slate-700">{letterStyle.tone}</div>
                                    </div>
                                )}
                                {letterStyle.structure && (
                                    <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">📐 Struktur</div>
                                        <div className="text-sm text-slate-700">{letterStyle.structure}</div>
                                    </div>
                                )}
                                {letterStyle.phrases && letterStyle.phrases.length > 0 && (
                                    <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">💬 Typiska fraser du använder</div>
                                        <div className="flex flex-wrap gap-2">
                                            {letterStyle.phrases.map((p, i) => (
                                                <span key={i} className="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs rounded-full">"{p}"</span>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {letterStyle.avoid && letterStyle.avoid.length > 0 && (
                                    <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">🚫 Undviker</div>
                                        <div className="flex flex-wrap gap-2">
                                            {letterStyle.avoid.map((p, i) => (
                                                <span key={i} className="px-2 py-1 bg-red-100 text-red-700 text-xs rounded-full">"{p}"</span>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {letterStyle.length_preference && (
                                    <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">📏 Längd & tempo</div>
                                        <div className="text-sm text-slate-700">{letterStyle.length_preference}</div>
                                    </div>
                                )}
                                {letterStyle.opening_style && (
                                    <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">🚀 Hur du brukar börja</div>
                                        <div className="text-sm text-slate-700">{letterStyle.opening_style}</div>
                                    </div>
                                )}

                                <div className="bg-amber-50 border border-amber-200 rounded-lg p-4">
                                    <p className="text-xs text-amber-800">
                                        <strong>💡 Tips:</strong> Om AI:s beskrivning av din stil inte stämmer, ladda upp ett brev du är nöjd med för att "träna om" den.
                                    </p>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center py-10 text-slate-400">
                                <div className="text-4xl mb-3">📭</div>
                                <div className="font-medium mb-1">Inget brev analyserat ännu</div>
                                <div className="text-sm">Ladda upp eller klistra in ett brev ovan för att träna din AI</div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Jobs page
        const JobsPage = ({ jobs, onScrape, onApply, scraping, applyingJob, savedJobs, onSaveJob, onOpenQuiz }) => {
            const [keywords, setKeywords] = useState('');
            const [filterText, setFilterText] = useState('');
            const [filterPriority, setFilterPriority] = useState('all');
            const [sortBy, setSortBy] = useState('deadline');
            const [currentPage, setCurrentPage] = useState(1);
            const jobsPerPage = 12;
            const [prefsKey, setPrefsKey] = useState(0);
            const [hiddenJobIds, setHiddenJobIds] = useState(new Set()); // locally rejected jobs
            const [showHidden, setShowHidden] = useState(false);

            // Log interaction signal to backend (Meta-style event collection)
            const logInteraction = async (jobId, action, context = {}) => {
                const token = localStorage.getItem('auth_token');
                if (!token) return;
                try {
                    await fetch(`/api/jobs/${jobId}/interaction`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ action, context })
                    });
                } catch (e) {
                    console.error('Interaction log error:', e);
                }
            };

            const handleSkip = (job) => {
                logInteraction(job.id, 'skipped');
                setCurrentPage(p => Math.min(filteredJobs.length, p + 1));
            };

            const handleReject = (job) => {
                logInteraction(job.id, 'rejected');
                setHiddenJobIds(prev => new Set([...prev, job.id]));
                // Stay on same page index — next job slides in automatically
            };

            // Re-read preferences when saved from Preferenser tab
            useEffect(() => {
                const handler = () => setPrefsKey(k => k + 1);
                window.addEventListener('prefsUpdated', handler);
                return () => window.removeEventListener('prefsUpdated', handler);
            }, []);

            // Reset to page 1 when filters change
            useEffect(() => {
                setCurrentPage(1);
            }, [filterText, filterPriority, sortBy, jobs.length]);

            // Load quiz preferences for filtering
            const quizPrefs = useMemo(() => {
                try { return JSON.parse(localStorage.getItem('job_preferences') || '{}'); }
                catch(e) { return {}; }
            }, [jobs, prefsKey]);

            // Filter and sort jobs
            const filteredJobs = jobs
                .filter(job => {
                    // Hide locally rejected jobs unless "Visa dolda" is on
                    if (!showHidden && hiddenJobIds.has(job.id)) return false;

                    // Text filter
                    if (filterText) {
                        const search = filterText.toLowerCase();
                        const matchesText =
                            job.title?.toLowerCase().includes(search) ||
                            job.company?.toLowerCase().includes(search) ||
                            job.location?.toLowerCase().includes(search);
                        if (!matchesText) return false;
                    }
                    // Priority filter
                    if (filterPriority !== 'all' && job.priority !== filterPriority) {
                        return false;
                    }

                    // Quiz preference filters
                    const wh = quizPrefs.working_hours;
                    if (wh && wh !== 'both') {
                        const jobWH = (job.working_hours || '').toLowerCase();
                        if (wh === 'heltid' && jobWH && !jobWH.includes('heltid')) return false;
                        if (wh === 'deltid' && jobWH && !jobWH.includes('deltid')) return false;
                        if (wh === 'extra' && jobWH && !jobWH.includes('deltid') && !jobWH.includes('timm')) return false;
                    }

                    const ef = quizPrefs.employment_form;
                    if (ef && ef.length > 0 && !ef.includes('anything')) {
                        const jobET = (job.employment_type || '').toLowerCase();
                        if (jobET) {
                            const matchMap = {
                                'tillsvidare': 'tillsvidare', 'tidsbegransad': 'tidsbegräns',
                                'behov': 'behov', 'sommar': 'sommar'
                            };
                            const matches = ef.some(f => jobET.includes(matchMap[f] || f));
                            if (!matches) return false;
                        }
                    }

                    const dur = quizPrefs.duration;
                    if (dur && dur !== 'anything') {
                        const jobDur = (job.duration || '').toLowerCase();
                        if (jobDur) {
                            if (dur === 'tillsvidare' && !jobDur.includes('tillsvidare')) return false;
                            if (dur === 'over6' && !jobDur.includes('6 mån') && !jobDur.includes('längre')) return false;
                            if (dur === '3to6' && !jobDur.includes('3') && !jobDur.includes('6')) return false;
                            if (dur === 'under3' && !jobDur.includes('3 mån') && !jobDur.includes('kort')) return false;
                        }
                    }

                    const sal = quizPrefs.salary;
                    if (sal && sal !== 'anything') {
                        const jobSal = (job.salary_type || job.salary_description || '').toLowerCase();
                        if (jobSal) {
                            if (sal === 'fast' && !jobSal.includes('fast')) return false;
                            if (sal === 'provision' && !jobSal.includes('provision') && !jobSal.includes('ackord')) return false;
                        }
                    }

                    // Dealbreakers: exclude jobs matching these keywords in description
                    const db = quizPrefs.dealbreakers;
                    if (db && db.length > 0 && !db.includes('ingen')) {
                        const desc = (job.description || '').toLowerCase();
                        const title = (job.title || '').toLowerCase();
                        const dbMap = {
                            'natt': 'natt', 'helg': 'helg', 'telefon': 'telefon',
                            'tunga_lyft': 'tunga lyft', 'utomhus': 'utomhus'
                        };
                        const hasBreaker = db.some(d => {
                            const keyword = dbMap[d] || d;
                            return desc.includes(keyword) || title.includes(keyword);
                        });
                        if (hasBreaker) return false;
                    }

                    // Negative keywords filter (from Preferenser tab)
                    const negKw = quizPrefs.negative_keywords || [];
                    if (negKw.length > 0) {
                        const titleLow = (job.title || '').toLowerCase();
                        const descLow = (job.description || '').toLowerCase();
                        const hasNegative = negKw.some(kw =>
                            titleLow.includes(kw.toLowerCase()) || descLow.includes(kw.toLowerCase())
                        );
                        if (hasNegative) return false;
                    }

                    return true;
                })
                .sort((a, b) => {
                    if (sortBy === 'deadline') {
                        // Pure deadline sort — soonest deadline first
                        return new Date(a.deadline || '2099-12-31') - new Date(b.deadline || '2099-12-31');
                    }
                    if (sortBy === 'company') {
                        return (a.company || '').localeCompare(b.company || '');
                    }
                    if (sortBy === 'title') {
                        return (a.title || '').localeCompare(b.title || '');
                    }
                    return 0;
                });

            return (
                <div>
                    <div className="bg-white rounded-xl p-5 shadow-sm mb-6">
                        <h2 className="text-lg font-semibold mb-3">🔍 Sök jobb på Platsbanken</h2>
                        <div className="flex gap-3">
                            <input
                                type="text"
                                value={keywords}
                                onChange={(e) => setKeywords(e.target.value)}
                                placeholder="t.ex. servitör, kundtjänst, butik"
                                className="flex-1 border border-slate-200 rounded-lg px-4 py-2"
                                onKeyDown={(e) => e.key === 'Enter' && onScrape(keywords)}
                            />
                            <button
                                onClick={() => onScrape(keywords)}
                                disabled={scraping}
                                className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-indigo-700 disabled:opacity-50"
                            >
                                {scraping ? 'Söker...' : 'Sök'}
                            </button>
                        </div>
                    </div>


                    {/* Rejected jobs toggle */}
                    {hiddenJobIds.size > 0 && (
                        <div className="flex items-center justify-end mb-3">
                            <button
                                onClick={() => setShowHidden(h => !h)}
                                className="text-sm text-slate-400 hover:text-slate-700 transition"
                            >
                                {showHidden ? '🙈 Dölj bortvalde jobb' : `👁 Visa ${hiddenJobIds.size} bortvalt jobb`}
                            </button>
                        </div>
                    )}

                    {/* ONE JOB AT A TIME */}
                    {(() => {
                        const jobIndex = currentPage - 1;
                        const currentJob = filteredJobs[jobIndex];

                        return (
                            <>
                                {jobs.length === 0 ? (
                                    <div className="bg-white rounded-xl p-10 text-center shadow-sm">
                                        <p className="text-slate-500 mb-4">Inga jobb ännu.</p>
                                        {!localStorage.getItem('job_preferences') ? (
                                            <button
                                                onClick={onOpenQuiz}
                                                className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-medium hover:bg-indigo-700 transition"
                                            >
                                                Fyll i quiz för att hitta rätt jobb
                                            </button>
                                        ) : (
                                            <button
                                                onClick={() => onScrape('')}
                                                disabled={scraping}
                                                className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-medium hover:bg-indigo-700 disabled:opacity-50 transition"
                                            >
                                                {scraping ? 'Söker...' : 'Sök jobb baserat på dina preferenser'}
                                            </button>
                                        )}
                                    </div>
                                ) : filteredJobs.length === 0 ? (
                                    <div className="bg-white rounded-xl p-10 text-center shadow-sm">
                                        <p className="text-slate-500">Inga jobb matchar ditt filter.</p>
                                        <button
                                            onClick={() => { setFilterText(''); setFilterPriority('all'); }}
                                            className="mt-2 text-indigo-600 hover:underline text-sm"
                                        >
                                            Rensa filter
                                        </button>
                                    </div>
                                ) : currentJob ? (
                                    <div className="max-w-3xl mx-auto">
                                        {/* Progress indicator */}
                                        <div className="flex items-center justify-between mb-3 px-1">
                                            <span className="text-sm text-slate-500">Jobb {jobIndex + 1} av {filteredJobs.length}</span>
                                            <div className="flex-1 mx-4 bg-slate-200 rounded-full h-1.5">
                                                <div
                                                    className="bg-pink-500 h-1.5 rounded-full transition-all"
                                                    style={{ width: `${((jobIndex + 1) / filteredJobs.length) * 100}%` }}
                                                />
                                            </div>
                                            <button
                                                onClick={() => onSaveJob(currentJob.id, !(savedJobs || []).includes(currentJob.id))}
                                                className={`text-sm font-medium transition ${(savedJobs || []).includes(currentJob.id) ? 'text-pink-600' : 'text-slate-400 hover:text-pink-500'}`}
                                            >
                                                {(savedJobs || []).includes(currentJob.id) ? '★ Sparad' : '☆ Spara'}
                                            </button>
                                        </div>

                                        {/* Job card */}
                                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-7">
                                            {/* Header row: priority + deadline */}
                                            <div className="flex justify-between items-center mb-4">
                                                <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${
                                                    currentJob.priority === 'urgent' ? 'bg-red-100 text-red-700' :
                                                    currentJob.priority === 'soon' ? 'bg-amber-100 text-amber-700' :
                                                    'bg-green-100 text-green-700'
                                                }`}>
                                                    {currentJob.priority === 'urgent' ? '🔴 Akut' : currentJob.priority === 'soon' ? '🟡 Snart' : '🟢 Ny'}
                                                </span>
                                                <div className="flex items-center gap-3 text-sm text-slate-400">
                                                    {currentJob.number_of_positions > 1 && (
                                                        <span className="text-indigo-600 font-medium">{currentJob.number_of_positions} platser</span>
                                                    )}
                                                    {currentJob.deadline && (
                                                        <span>Ansök senast {new Date(currentJob.deadline).toLocaleDateString('sv-SE')}</span>
                                                    )}
                                                </div>
                                            </div>

                                            {/* Title + company + location */}
                                            <h3 className="text-2xl font-bold text-slate-800 mb-1 leading-tight">{currentJob.title}</h3>
                                            <p className="text-pink-600 font-semibold text-lg mb-1">{currentJob.company}</p>
                                            <p className="text-slate-500 text-sm mb-4">
                                                📍 {currentJob.location || currentJob.municipality || currentJob.county || 'Okänd ort'}
                                                {currentJob.occupation && <span className="ml-3 text-slate-400">· {currentJob.occupation}</span>}
                                            </p>

                                            {/* Tags row */}
                                            <div className="flex flex-wrap gap-2 mb-5">
                                                {currentJob.working_hours && (
                                                    <span className="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full font-medium">
                                                        🕐 {currentJob.working_hours}
                                                    </span>
                                                )}
                                                {currentJob.employment_type && (
                                                    <span className="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full">
                                                        {currentJob.employment_type}
                                                    </span>
                                                )}
                                                {currentJob.duration && (
                                                    <span className="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full">
                                                        {currentJob.duration}
                                                    </span>
                                                )}
                                                {currentJob.salary_description && (
                                                    <span className="text-xs bg-green-50 text-green-700 px-3 py-1.5 rounded-full font-medium">
                                                        💰 {currentJob.salary_description}
                                                    </span>
                                                )}
                                                {currentJob.application_method && currentJob.application_method !== 'email' && (
                                                    <span className="text-xs bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full">
                                                        Ansökan: {currentJob.application_method}
                                                    </span>
                                                )}
                                            </div>

                                            {/* Description - taller, more text */}
                                            {currentJob.description && (
                                                <div className="bg-slate-50 rounded-xl p-5 mb-5 max-h-96 overflow-y-auto">
                                                    <p className="text-sm text-slate-700 leading-relaxed whitespace-pre-line">
                                                        {currentJob.description.substring(0, 3000).replace(/([^\n])\s*•/g, '$1\n\n•')}
                                                        {currentJob.description.length > 3000 ? (
                                                            <span className="text-slate-400"> …<a href={currentJob.url} target="_blank" className="text-indigo-500 hover:underline ml-1">Läs mer på Platsbanken</a></span>
                                                        ) : ''}
                                                    </p>
                                                </div>
                                            )}

                                            {/* Contact info */}
                                            {(currentJob.contact_email || currentJob.contact_name || currentJob.contact_phone || currentJob.apply_url) && (
                                                <div className="bg-pink-50 border border-pink-100 rounded-xl p-4 mb-5">
                                                    <p className="text-xs font-semibold text-pink-700 uppercase tracking-wide mb-2">Kontakt & ansökan</p>
                                                    <div className="space-y-1.5">
                                                        {currentJob.contact_name && (
                                                            <p className="text-sm text-slate-700 font-medium">👤 {currentJob.contact_name}</p>
                                                        )}
                                                        {currentJob.contact_email && (
                                                            <p className="text-sm text-slate-600">
                                                                ✉️ <a href={`mailto:${currentJob.contact_email}`} className="text-pink-600 font-medium hover:underline">{currentJob.contact_email}</a>
                                                            </p>
                                                        )}
                                                        {currentJob.contact_phone && (
                                                            <p className="text-sm text-slate-600">📞 <span className="font-medium">{currentJob.contact_phone}</span></p>
                                                        )}
                                                        {currentJob.apply_url && (
                                                            <p className="text-sm">
                                                                <a href={currentJob.apply_url} target="_blank" className="text-indigo-600 hover:underline font-medium">🔗 Ansök via webbformulär</a>
                                                            </p>
                                                        )}
                                                    </div>
                                                </div>
                                            )}

                                            {/* Primary action buttons */}
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={() => handleReject(currentJob)}
                                                    className="py-3.5 px-3 border-2 border-red-200 text-red-400 rounded-xl font-medium hover:bg-red-50 hover:border-red-300 transition"
                                                    title="Inte intressant — dölj detta jobb"
                                                >
                                                    🚫
                                                </button>
                                                <button
                                                    onClick={() => handleSkip(currentJob)}
                                                    className="flex-1 py-3.5 px-4 border-2 border-slate-200 rounded-xl text-slate-500 font-medium hover:bg-slate-50 hover:border-slate-300 transition"
                                                >
                                                    Hoppa över →
                                                </button>
                                                <button
                                                    onClick={() => onApply(currentJob)}
                                                    disabled={applyingJob === currentJob.id}
                                                    className="flex-1 py-3.5 px-4 bg-pink-600 text-white rounded-xl font-semibold hover:bg-pink-700 disabled:opacity-50 transition shadow-sm"
                                                >
                                                    {applyingJob === currentJob.id ? '⏳ Skapar brev...' : '✍️ Skapa ansökan'}
                                                </button>
                                            </div>

                                            {/* Secondary link */}
                                            <div className="text-center mt-3">
                                                <a href={currentJob.url} target="_blank" className="text-sm text-slate-400 hover:text-indigo-600 transition">
                                                    Se originalannons på Platsbanken ↗
                                                </a>
                                            </div>
                                        </div>

                                        {/* Prev / Next navigation */}
                                        <div className="flex justify-between mt-4 px-1">
                                            <button
                                                onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                                                disabled={jobIndex === 0}
                                                className="text-sm text-slate-400 hover:text-slate-700 disabled:opacity-30 transition font-medium"
                                            >
                                                ← Föregående
                                            </button>
                                            <button
                                                onClick={() => setCurrentPage(p => Math.min(filteredJobs.length, p + 1))}
                                                disabled={jobIndex >= filteredJobs.length - 1}
                                                className="text-sm text-slate-400 hover:text-slate-700 disabled:opacity-30 transition font-medium"
                                            >
                                                Nästa →
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-white rounded-xl p-10 text-center shadow-sm max-w-3xl mx-auto">
                                        <p className="text-lg font-semibold text-slate-700 mb-2">Klart! 🎉</p>
                                        <p className="text-slate-500">Du har gått igenom alla {filteredJobs.length} jobb.</p>
                                        <button
                                            onClick={() => setCurrentPage(1)}
                                            className="mt-4 px-5 py-2.5 bg-pink-600 text-white rounded-xl font-medium hover:bg-pink-700 transition"
                                        >
                                            Börja om
                                        </button>
                                    </div>
                                )}
                            </>
                        );
                    })()}
                </div>
            );
        };

        // Master CV Editor Modal
        const MasterCVEditor = ({ isOpen, onClose, masterCV, onSave, saving }) => {
            const [editedCV, setEditedCV] = useState(null);
            const [activeSection, setActiveSection] = useState('experiences');

            useEffect(() => {
                if (isOpen) {
                    // Initialize with masterCV data or empty defaults
                    const defaultCV = {
                        profile: { full_name: '', email: '', phone: '', location: '' },
                        experiences: [],
                        education: [],
                        skills: [],
                        volunteer: [],
                        awards: []
                    };
                    if (masterCV) {
                        setEditedCV({
                            ...defaultCV,
                            ...JSON.parse(JSON.stringify(masterCV)),
                            experiences: masterCV.experiences || [],
                            education: masterCV.education || [],
                            skills: masterCV.skills || []
                        });
                    } else {
                        setEditedCV(defaultCV);
                    }
                }
            }, [masterCV, isOpen]);

            if (!isOpen) return null;
            if (!editedCV) return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
                    <div className="bg-white rounded-xl p-8">
                        <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mx-auto"></div>
                        <p className="mt-4 text-slate-600">Laddar Master CV...</p>
                    </div>
                </div>
            );

            const updateExperience = (index, field, value) => {
                const newExp = [...editedCV.experiences];
                newExp[index] = { ...newExp[index], [field]: value };
                setEditedCV({ ...editedCV, experiences: newExp });
            };

            const addExperience = () => {
                setEditedCV({
                    ...editedCV,
                    experiences: [...editedCV.experiences, {
                        company: '', title: '', location: '', start_date: '', end_date: '', description: '', categories: []
                    }]
                });
            };

            const deleteExperience = (index) => {
                setEditedCV({
                    ...editedCV,
                    experiences: editedCV.experiences.filter((_, i) => i !== index)
                });
            };

            const updateEducation = (index, field, value) => {
                const newEdu = [...editedCV.education];
                newEdu[index] = { ...newEdu[index], [field]: value };
                setEditedCV({ ...editedCV, education: newEdu });
            };

            const addEducation = () => {
                setEditedCV({
                    ...editedCV,
                    education: [...editedCV.education, {
                        school: '', degree: '', field_of_study: '', location: '', start_date: '', end_date: ''
                    }]
                });
            };

            const [importStatus, setImportStatus] = useState(null);

            // Parse LinkedIn CSV data
            const parseLinkedInCSV = (csvText, type) => {
                const lines = csvText.split('\n');
                if (lines.length < 2) return [];

                // Parse header
                const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g, ''));
                const results = [];

                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;

                    // Handle CSV with quoted fields
                    const values = [];
                    let current = '';
                    let inQuotes = false;
                    for (const char of lines[i]) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            values.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    values.push(current.trim());

                    const row = {};
                    headers.forEach((h, idx) => {
                        row[h] = values[idx] || '';
                    });
                    results.push(row);
                }
                return results;
            };

            // Handle LinkedIn file upload
            const handleLinkedInUpload = async (e, type) => {
                const file = e.target.files[0];
                if (!file) return;

                setImportStatus('importing');

                try {
                    const text = await file.text();

                    if (type === 'positions') {
                        const positions = parseLinkedInCSV(text, 'positions');
                        const newExperiences = positions.map(p => ({
                            company: p['company name'] || p['company'] || '',
                            title: p['title'] || '',
                            location: p['location'] || '',
                            start_date: p['started on'] || '',
                            end_date: p['finished on'] || '',
                            description: p['description'] || '',
                            categories: []
                        })).filter(exp => exp.company || exp.title);

                        setEditedCV(prev => ({
                            ...prev,
                            experiences: [...prev.experiences, ...newExperiences]
                        }));
                        setImportStatus(`Importerade ${newExperiences.length} erfarenheter!`);
                    } else if (type === 'education') {
                        const education = parseLinkedInCSV(text, 'education');
                        const newEducation = education.map(e => ({
                            school: e['school name'] || e['school'] || '',
                            degree: e['degree name'] || e['degree'] || '',
                            field_of_study: e['field of study'] || e['notes'] || '',
                            location: '',
                            start_date: e['start date'] || '',
                            end_date: e['end date'] || ''
                        })).filter(edu => edu.school);

                        setEditedCV(prev => ({
                            ...prev,
                            education: [...prev.education, ...newEducation]
                        }));
                        setImportStatus(`Importerade ${newEducation.length} utbildningar!`);
                    } else if (type === 'skills') {
                        const skills = parseLinkedInCSV(text, 'skills');
                        const newSkills = skills.map(s => ({
                            category: 'all',
                            skill_type: 'technical',
                            skill_text: s['name'] || s['skill'] || ''
                        })).filter(s => s.skill_text);

                        setEditedCV(prev => ({
                            ...prev,
                            skills: [...prev.skills, ...newSkills]
                        }));
                        setImportStatus(`Importerade ${newSkills.length} kompetenser!`);
                    } else if (type === 'profile') {
                        const profiles = parseLinkedInCSV(text, 'profile');
                        if (profiles.length > 0) {
                            const p = profiles[0];
                            setEditedCV(prev => ({
                                ...prev,
                                profile: {
                                    ...prev.profile,
                                    full_name: `${p['first name'] || ''} ${p['last name'] || ''}`.trim() || prev.profile.full_name,
                                    email: p['email address'] || p['email'] || prev.profile.email,
                                    location: p['geo location'] || p['location'] || prev.profile.location
                                }
                            }));
                            setImportStatus('Profildata importerad!');
                        }
                    }

                    setTimeout(() => setImportStatus(null), 3000);
                } catch (err) {
                    console.error('Import error:', err);
                    setImportStatus('Fel vid import. Kontrollera filformatet.');
                    setTimeout(() => setImportStatus(null), 3000);
                }

                e.target.value = '';
            };

            const sections = [
                { id: 'experiences', label: 'Erfarenheter', icon: '💼', count: editedCV.experiences?.length || 0 },
                { id: 'education', label: 'Utbildning', icon: '🎓', count: editedCV.education?.length || 0 },
                { id: 'skills', label: 'Kompetenser', icon: '⭐', count: editedCV.skills?.length || 0 },
                { id: 'profile', label: 'Profil', icon: '👤', count: null },
                { id: 'import', label: 'LinkedIn Import', icon: '📥', count: null }
            ];

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex">
                    {/* Sidebar */}
                    <div className="w-64 bg-slate-800 text-white p-4 flex flex-col">
                        <h2 className="text-lg font-bold mb-6">📋 Master CV</h2>
                        <nav className="space-y-1 flex-1">
                            {sections.map(s => (
                                <button
                                    key={s.id}
                                    onClick={() => setActiveSection(s.id)}
                                    className={`w-full text-left px-3 py-2 rounded-lg flex items-center justify-between ${
                                        activeSection === s.id ? 'bg-white/20' : 'hover:bg-white/10'
                                    }`}
                                >
                                    <span>{s.icon} {s.label}</span>
                                    {s.count !== null && <span className="bg-white/20 px-2 py-0.5 rounded text-xs">{s.count}</span>}
                                </button>
                            ))}
                        </nav>
                        <div className="pt-4 border-t border-white/20 space-y-2">
                            <button
                                onClick={() => onSave(editedCV)}
                                disabled={saving}
                                className="w-full bg-green-600 hover:bg-green-700 py-2 rounded-lg font-medium disabled:opacity-50"
                            >
                                {saving ? 'Sparar...' : '💾 Spara ändringar'}
                            </button>
                            <button
                                onClick={onClose}
                                className="w-full bg-white/10 hover:bg-white/20 py-2 rounded-lg"
                            >
                                Stäng
                            </button>
                        </div>
                    </div>

                    {/* Content */}
                    <div className="flex-1 bg-white overflow-auto p-6">
                        {/* Experiences Section */}
                        {activeSection === 'experiences' && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold">💼 Arbetslivserfarenhet</h3>
                                    <button
                                        onClick={addExperience}
                                        className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700"
                                    >
                                        + Lägg till
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    {editedCV.experiences?.map((exp, i) => (
                                        <div key={i} className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                            <div className="flex justify-between items-start mb-3">
                                                <span className="text-xs font-medium text-slate-500">#{i + 1}</span>
                                                <button
                                                    onClick={() => deleteExperience(i)}
                                                    className="text-red-500 hover:text-red-700 text-sm"
                                                >
                                                    🗑️ Ta bort
                                                </button>
                                            </div>
                                            <div className="grid md:grid-cols-2 gap-3">
                                                <input
                                                    placeholder="Företag"
                                                    value={exp.company || ''}
                                                    onChange={(e) => updateExperience(i, 'company', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Titel"
                                                    value={exp.title || ''}
                                                    onChange={(e) => updateExperience(i, 'title', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Plats"
                                                    value={exp.location || ''}
                                                    onChange={(e) => updateExperience(i, 'location', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <div className="flex gap-2">
                                                    <input
                                                        placeholder="Start (YYYY-MM)"
                                                        value={exp.start_date || ''}
                                                        onChange={(e) => updateExperience(i, 'start_date', e.target.value)}
                                                        className="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                    />
                                                    <input
                                                        placeholder="Slut"
                                                        value={exp.end_date || ''}
                                                        onChange={(e) => updateExperience(i, 'end_date', e.target.value)}
                                                        className="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                    />
                                                </div>
                                            </div>
                                            <textarea
                                                placeholder="Beskrivning - vad du gjorde, ansvar, resultat..."
                                                value={exp.description || ''}
                                                onChange={(e) => updateExperience(i, 'description', e.target.value)}
                                                rows={3}
                                                className="w-full mt-3 px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                            />
                                            <div className="mt-2">
                                                <label className="text-xs text-slate-500 block mb-1">Kategorier (komma-separerade)</label>
                                                <input
                                                    placeholder="restaurant, retail, tech..."
                                                    value={(exp.categories || []).join(', ')}
                                                    onChange={(e) => updateExperience(i, 'categories', e.target.value.split(',').map(c => c.trim()).filter(Boolean))}
                                                    className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Education Section */}
                        {activeSection === 'education' && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold">🎓 Utbildning</h3>
                                    <button
                                        onClick={addEducation}
                                        className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700"
                                    >
                                        + Lägg till
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    {editedCV.education?.map((edu, i) => (
                                        <div key={i} className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                            <div className="grid md:grid-cols-2 gap-3">
                                                <input
                                                    placeholder="Skola/Universitet"
                                                    value={edu.school || ''}
                                                    onChange={(e) => updateEducation(i, 'school', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Examen"
                                                    value={edu.degree || ''}
                                                    onChange={(e) => updateEducation(i, 'degree', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Ämne/Inriktning"
                                                    value={edu.field_of_study || ''}
                                                    onChange={(e) => updateEducation(i, 'field_of_study', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Plats"
                                                    value={edu.location || ''}
                                                    onChange={(e) => updateEducation(i, 'location', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Startår"
                                                    value={edu.start_date || ''}
                                                    onChange={(e) => updateEducation(i, 'start_date', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                                <input
                                                    placeholder="Slutår"
                                                    value={edu.end_date || ''}
                                                    onChange={(e) => updateEducation(i, 'end_date', e.target.value)}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Skills Section */}
                        {activeSection === 'skills' && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold">⭐ Kompetenser</h3>
                                    <button
                                        onClick={() => setEditedCV({
                                            ...editedCV,
                                            skills: [...(editedCV.skills || []), { category: 'all', skill_type: 'technical', skill_text: '' }]
                                        })}
                                        className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700"
                                    >
                                        + Lägg till
                                    </button>
                                </div>
                                <p className="text-sm text-slate-500 mb-4">
                                    Dina kompetenser grupperade per kategori. Dessa används för att matcha mot jobb.
                                </p>
                                <div className="space-y-3">
                                    {editedCV.skills?.map((skill, i) => (
                                        <div key={i} className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                            <div className="flex justify-between items-start mb-3">
                                                <span className="text-xs font-medium text-slate-500">#{i + 1}</span>
                                                <button
                                                    onClick={() => setEditedCV({
                                                        ...editedCV,
                                                        skills: editedCV.skills.filter((_, idx) => idx !== i)
                                                    })}
                                                    className="text-red-500 hover:text-red-700 text-sm"
                                                >
                                                    🗑️ Ta bort
                                                </button>
                                            </div>
                                            <div className="grid md:grid-cols-3 gap-3">
                                                <select
                                                    value={skill.category || 'all'}
                                                    onChange={(e) => {
                                                        const newSkills = [...editedCV.skills];
                                                        newSkills[i] = { ...newSkills[i], category: e.target.value };
                                                        setEditedCV({ ...editedCV, skills: newSkills });
                                                    }}
                                                    className="px-3 py-2 border border-slate-200 rounded-lg text-sm"
                                                >
                                                    <option value="all">Alla branscher</option>
                                                    <option value="tech">Tech</option>
                                                    <option value="restaurant">Restaurang</option>
                                                    <option value="retail">Butik</option>

        // CVs page
        const CVsPage = ({ vibes, userCVs, onSelectVibe, onGenerateVibes, generating, onOpenMasterCV, onUploadCV }) => (
