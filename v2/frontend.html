        // Applications page with status management
        const ApplicationsPage = ({ applications, onUpdateApplication, onDeleteApplication, onRefresh }) => {
            const [filter, setFilter] = useState('all');
            const [editingNotes, setEditingNotes] = useState(null);
            const [noteText, setNoteText] = useState('');
            const [expandedApp, setExpandedApp] = useState(null);
            const [updating, setUpdating] = useState(null);

            const statusOptions = [
                { value: 'saved', label: '📌 Sparad', color: 'bg-blue-100 text-blue-700' },
                { value: 'draft', label: '📝 Utkast', color: 'bg-slate-100 text-slate-600' },
                { value: 'sent', label: '✓ Skickad', color: 'bg-green-100 text-green-700' },
                { value: 'interview', label: '🎉 Intervju', color: 'bg-purple-100 text-purple-700' },
                { value: 'offer', label: '🎊 Erbjudande', color: 'bg-amber-100 text-amber-700' },
                { value: 'rejected', label: '✗ Avslag', color: 'bg-red-100 text-red-700' },
                { value: 'skipped', label: '⏭️ Hoppade över', color: 'bg-gray-100 text-gray-500' }
            ];

            const getStatusInfo = (status) => statusOptions.find(s => s.value === status) || statusOptions[1];

            const handleStatusChange = async (appId, newStatus) => {
                setUpdating(appId);
                try {
                    const token = localStorage.getItem('auth_token');
                    const response = await fetch(`/api/applications/${appId}`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ status: newStatus })
                    });
                    if (response.ok && onRefresh) {
                        await onRefresh();
                    }
                } catch (err) {
                    console.error('Error updating status:', err);
                }
                setUpdating(null);
            };

            const handleSaveNotes = async (appId) => {
                setUpdating(appId);
                try {
                    const token = localStorage.getItem('auth_token');
                    await fetch(`/api/applications/${appId}`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ notes: noteText })
                    });
                    setEditingNotes(null);
                    if (onRefresh) await onRefresh();
                } catch (err) {
                    console.error('Error saving notes:', err);
                }
                setUpdating(null);
            };

            const handleDelete = async (appId) => {
                if (!confirm('Ta bort denna ansökan?')) return;
                try {
                    const token = localStorage.getItem('auth_token');
                    await fetch(`/api/applications/${appId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (onRefresh) await onRefresh();
                } catch (err) {
                    console.error('Error deleting:', err);
                }
            };

            const downloadCoverLetter = (app) => {
                if (!app.cover_letter) return;
                const blob = new Blob([app.cover_letter], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `personligt-brev-${app.job_title || 'jobb'}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const filteredApps = applications.filter(app => {
                if (filter === 'all') return true;
                if (filter === 'active') return ['saved', 'draft', 'sent'].includes(app.status);
                return app.status === filter;
            });

            const counts = {
                all: applications.length,
                saved: applications.filter(a => a.status === 'saved').length,
                sent: applications.filter(a => a.status === 'sent').length,
                interview: applications.filter(a => a.status === 'interview').length
            };

            return (
                <div>
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-lg font-semibold">📬 Mina ansökningar</h2>
                        <div className="flex gap-2">
                            {[
                                { id: 'all', label: `Alla (${counts.all})` },
                                { id: 'saved', label: `📌 Sparade (${counts.saved})` },
                                { id: 'sent', label: `✓ Skickade (${counts.sent})` },
                                { id: 'interview', label: `🎉 Intervjuer (${counts.interview})` }
                            ].map(f => (
                                <button
                                    key={f.id}
                                    onClick={() => setFilter(f.id)}
                                    className={`px-3 py-1 rounded-lg text-sm ${filter === f.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                >
                                    {f.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {applications.length === 0 ? (
                        <div className="bg-white rounded-xl p-10 text-center shadow-sm">
                            <p className="text-slate-500 mb-2">Inga ansökningar ännu.</p>
                            <p className="text-sm text-slate-400">Sök jobb och klicka "Ansök" för att komma igång!</p>
                        </div>
                    ) : filteredApps.length === 0 ? (
                        <div className="bg-white rounded-xl p-10 text-center shadow-sm">
                            <p className="text-slate-500">Inga ansökningar med denna status.</p>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {filteredApps.map(app => {
                                const statusInfo = getStatusInfo(app.status);
                                const isExpanded = expandedApp === app.id;

                                return (
                                    <div key={app.id} className="bg-white rounded-xl shadow-sm overflow-hidden">
                                        <div
                                            className="p-4 cursor-pointer hover:bg-slate-50"
                                            onClick={() => setExpandedApp(isExpanded ? null : app.id)}
                                        >
                                            <div className="flex justify-between items-start">
                                                <div className="flex-1">
                                                    <p className="font-medium text-slate-800">{app.job_title || 'Jobb'}</p>
                                                    <p className="text-sm text-indigo-600">{app.company || ''}</p>
                                                    <p className="text-xs text-slate-400 mt-1">
                                                        {new Date(app.created_at).toLocaleDateString('sv-SE')}
                                                        {app.sent_at && ` • Skickad ${new Date(app.sent_at).toLocaleDateString('sv-SE')}`}
                                                    </p>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <select
                                                        value={app.status}
                                                        onChange={(e) => {
                                                            e.stopPropagation();
                                                            handleStatusChange(app.id, e.target.value);
                                                        }}
                                                        onClick={(e) => e.stopPropagation()}
                                                        disabled={updating === app.id}
                                                        className={`px-3 py-1 rounded-full text-xs font-medium border-0 cursor-pointer ${statusInfo.color}`}
                                                    >
                                                        {statusOptions.map(opt => (
                                                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                                                        ))}
                                                    </select>
                                                    <svg className={`w-5 h-5 text-slate-400 transition ${isExpanded ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                                                    </svg>
                                                </div>
                                            </div>
                                            {app.notes && !isExpanded && (
                                                <p className="text-sm text-slate-500 mt-2 line-clamp-1">📝 {app.notes}</p>
                                            )}
                                        </div>

                                        {isExpanded && (
                                            <div className="border-t border-slate-100 p-4 bg-slate-50">
                                                {/* Notes section */}
                                                <div className="mb-4">
                                                    <label className="text-sm font-medium text-slate-700 block mb-2">Anteckningar</label>
                                                    {editingNotes === app.id ? (
                                                        <div>
                                                            <textarea
                                                                value={noteText}
                                                                onChange={(e) => setNoteText(e.target.value)}
                                                                className="w-full p-2 border border-slate-200 rounded-lg text-sm"
                                                                rows={3}
                                                                placeholder="T.ex. 'Ringde och pratade med Anna, ska höra av sig nästa vecka'"
                                                            />
                                                            <div className="flex gap-2 mt-2">
                                                                <button
                                                                    onClick={() => handleSaveNotes(app.id)}
                                                                    disabled={updating === app.id}
                                                                    className="px-3 py-1 bg-indigo-600 text-white rounded text-sm hover:bg-indigo-700 disabled:opacity-50"
                                                                >
                                                                    Spara
                                                                </button>
                                                                <button
                                                                    onClick={() => setEditingNotes(null)}
                                                                    className="px-3 py-1 border border-slate-200 rounded text-sm hover:bg-slate-100"
                                                                >
                                                                    Avbryt
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div
                                                            onClick={() => { setEditingNotes(app.id); setNoteText(app.notes || ''); }}
                                                            className="p-2 bg-white border border-slate-200 rounded-lg text-sm text-slate-600 cursor-pointer hover:border-indigo-300 min-h-[60px]"
                                                        >
                                                            {app.notes || <span className="text-slate-400">Klicka för att lägga till anteckningar...</span>}
                                                        </div>
                                                    )}
                                                </div>

                                                {/* Cover letter preview */}
                                                {app.cover_letter && (
                                                    <div className="mb-4">
                                                        <label className="text-sm font-medium text-slate-700 block mb-2">Personligt brev</label>
                                                        <div className="p-3 bg-white border border-slate-200 rounded-lg text-sm text-slate-600 max-h-32 overflow-y-auto">
                                                            {app.cover_letter.slice(0, 300)}...
                                                        </div>
                                                    </div>
                                                )}

                                                {/* Actions */}
                                                <div className="flex gap-2 flex-wrap">
                                                    {app.contact_email && (
                                                        <a
                                                            href={`mailto:${app.contact_email}?subject=Angående min ansökan: ${app.job_title || 'Jobb'}`}
                                                            className="px-3 py-1.5 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700"
                                                        >
                                                            📧 Maila
                                                        </a>
                                                    )}
                                                    {app.cover_letter && (
                                                        <button
                                                            onClick={() => downloadCoverLetter(app)}
                                                            className="px-3 py-1.5 border border-slate-200 rounded-lg text-sm hover:bg-slate-100"
                                                        >
                                                            ⬇️ Ladda ner brev
                                                        </button>
                                                    )}
                                                    {app.cover_letter && (
                                                        <button
                                                            onClick={() => {
                                                                navigator.clipboard.writeText(app.cover_letter);
                                                                alert('Kopierat!');
                                                            }}
                                                            className="px-3 py-1.5 border border-slate-200 rounded-lg text-sm hover:bg-slate-100"
                                                        >
                                                            📋 Kopiera brev
                                                        </button>
                                                    )}
                                                    <button
                                                        onClick={() => handleDelete(app.id)}
                                                        className="px-3 py-1.5 border border-red-200 text-red-600 rounded-lg text-sm hover:bg-red-50"
                                                    >
                                                        🗑️ Ta bort
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        // ============== GMAIL CONNECT STEP ==============

        const GmailConnectStep = ({ onNext, onBack }) => {
            const [status, setStatus] = React.useState(null); // null | 'loading' | 'connected' | 'error'
            const [gmailAddress, setGmailAddress] = React.useState('');

            React.useEffect(() => {
                const check = async () => {
                    try {
                        const token = localStorage.getItem('auth_token');
                        const resp = await fetch('/api/gmail/status?user_id=default_user', {
                            headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                        });
                        const data = await resp.json();
                        if (data.connected) {
                            setStatus('connected');
                            setGmailAddress(data.gmail_address || '');
                        } else {
                            setStatus('idle');
                        }
                    } catch (e) {
                        setStatus('idle');
                    }
                };
                check();
            }, []);

            const connectGmail = async () => {
                setStatus('loading');
                try {
                    const token = localStorage.getItem('auth_token');
                    const resp = await fetch('/api/gmail/auth-url?user_id=default_user', {
                        headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                    });
                    const data = await resp.json();
                    if (data.auth_url) {
                        const popup = window.open(data.auth_url, 'gmail_auth', 'width=500,height=600');
                        // Poll until popup closes
                        const timer = setInterval(async () => {
                            if (popup.closed) {
                                clearInterval(timer);
                                // Re-check status
                                const r2 = await fetch('/api/gmail/status?user_id=default_user', {
                                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                                });
                                const d2 = await r2.json();
                                if (d2.connected) {
                                    setStatus('connected');
                                    setGmailAddress(d2.gmail_address || '');
                                } else {
                                    setStatus('idle');
                                }
                            }
                        }, 1000);
                    } else if (!data.app_configured) {
                        setStatus('not_configured');
                    } else {
                        setStatus('error');
                    }
                } catch (e) {
                    setStatus('error');
                }
            };

            return (
                <div>
                    <h2 className="text-2xl font-bold text-slate-800 mb-2">Koppla Gmail</h2>
                    <p className="text-slate-600 mb-6">
                        Så sparas personliga brev automatiskt som utkast i din inkorg.
                    </p>

                    {status === 'connected' ? (
                        <div className="bg-green-50 border border-green-200 rounded-xl p-5 mb-6 flex items-center gap-3">
                            <span className="text-2xl">✅</span>
                            <div>
                                <p className="font-semibold text-green-800">Gmail kopplad!</p>
                                <p className="text-sm text-green-700">{gmailAddress}</p>
                            </div>
                        </div>
                    ) : status === 'not_configured' ? (
                        <div className="bg-amber-50 border border-amber-200 rounded-xl p-5 mb-6">
                            <p className="text-sm text-amber-800">
                                Gmail-integrationen är inte aktiverad än. Kontakta administratören.
                            </p>
                        </div>
                    ) : (
                        <div className="space-y-4 mb-6">
                            <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-900 space-y-2">
                                <p className="font-semibold">Vad händer när du kopplar Gmail?</p>
                                <ul className="space-y-1 text-blue-800">
                                    <li>✓ Appen sparar personliga brev som <strong>utkast</strong> i din Gmail — inget skickas automatiskt</li>
                                    <li>✓ Du granskar och skickar alltid själv</li>
                                    <li>✓ Google frågar om ditt tillstånd — du ser exakt vad appen får göra</li>
                                    <li>✓ Du kan koppla bort när som helst via dina Google-kontoinställningar</li>
                                </ul>
                            </div>
                            <div className="bg-white border border-slate-200 rounded-xl p-5">
                                <button
                                    onClick={connectGmail}
                                    disabled={status === 'loading'}

        // ============== MAIN APP ==============

        const App = () => {
            const [activeTab, setActiveTab] = useState('jobs');
            const [jobs, setJobs] = useState([]);
            const [vibes, setVibes] = useState([]);
            const [userCVs, setUserCVs] = useState([]);
            const [applications, setApplications] = useState([]);
            const [stats, setStats] = useState({});
            const [showOnboarding, setShowOnboarding] = useState(false);
            const [landingTab, setLandingTab] = useState('hem');

            const [scraping, setScraping] = useState(false);
            const [generating, setGenerating] = useState(false);
            const [applyingJob, setApplyingJob] = useState(null);

            const [showApplyModal, setShowApplyModal] = useState(false);
            const [showCVModal, setShowCVModal] = useState(false);
            const [showMasterCVModal, setShowMasterCVModal] = useState(false);
            const [selectedJob, setSelectedJob] = useState(null);
            const [applyResult, setApplyResult] = useState(null);
            const [selectedVibe, setSelectedVibe] = useState(null);
            const [selectedCVText, setSelectedCVText] = useState('');
            const [masterCV, setMasterCV] = useState(null);
            const [savingMasterCV, setSavingMasterCV] = useState(false);

            // Fetch initial data
            useEffect(() => {
                fetchJobs();
                fetchVibes();
                fetchUserCVs();
                fetchApplications();
                fetchStats();
                checkOnboarding();
            }, []);

            const checkOnboarding = async () => {
                // Check if quiz was completed locally
                const onboardingComplete = localStorage.getItem('onboarding_complete');
                if (onboardingComplete) return;

                // No quiz done yet - show it
                setShowOnboarding(true);
            };

            const fetchJobs = async () => {
                const token = localStorage.getItem('auth_token');
                const res = await fetch('/api/jobs', {
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                const data = await res.json();
                if (data.success) setJobs(data.jobs || []);
            };

            const fetchVibes = async () => {
                console.log('[DEBUG] Fetching CV vibes...');
                const res = await fetch('/api/cv/vibes');
                const data = await res.json();
                console.log('[DEBUG] CV vibes response:', data);
                if (data.success) {
                    setVibes(data.vibes || []);
                    console.log('[DEBUG] Vibes set:', data.vibes?.length || 0, 'vibes');
                }
            };

            const fetchUserCVs = async () => {
                const token = localStorage.getItem('auth_token');
                console.log('[DEBUG] Fetching user CVs... Auth token exists:', !!token);
                const res = await fetch('/api/cv/all', {
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                const data = await res.json();
                console.log('[DEBUG] User CVs response:', data);
                if (data.success) {
                    setUserCVs(data.cvs || []);
                    console.log('[DEBUG] User CVs set:', data.cvs?.length || 0, 'CVs');
                }
            };

            const fetchApplications = async () => {
                const res = await fetch('/api/applications');
                const data = await res.json();
                if (data.success) {
                    setApplications(data.applications || []);
                    // Extract saved job IDs
                    const saved = (data.applications || [])
                        .filter(a => a.status === 'saved')
                        .map(a => a.job_id);
                    setSavedJobs(saved);
                }
            };

            const [savedJobs, setSavedJobs] = useState([]);

            const handleSaveJob = (jobId, isSaved) => {
                if (isSaved) {
                    setSavedJobs(prev => [...prev, jobId]);
                } else {
                    setSavedJobs(prev => prev.filter(id => id !== jobId));
                }
                // Refresh applications list
                fetchApplications();
            };

            const fetchStats = async () => {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if (data.success) {
                    setStats({...data.stats, cv_vibes: userCVs.length});
                }
            };

            const fetchMasterCV = async () => {
                try {
                    const token = localStorage.getItem('auth_token');
                    if (!token) {
                        console.error('No auth token');
                        return false;
                    }
                    const res = await fetch('/api/cv/master', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!res.ok) {
                        console.error('Fetch master CV failed:', res.status);
                        return false;
                    }
                    const data = await res.json();
                    if (data.success && data.master_cv) {
                        setMasterCV(data.master_cv);
                    }
                    return true;
                } catch (err) {
                    console.error('Error fetching master CV:', err);
                    return false;
                }
            };

            const handleOpenMasterCV = async () => {
                await fetchMasterCV();
                setShowMasterCVModal(true);
            };

            const handleSaveMasterCV = async (editedCV) => {
                setSavingMasterCV(true);
                const token = localStorage.getItem('auth_token');

                try {
                    // Save experiences
                    for (const exp of editedCV.experiences) {
                        if (exp.id) {
                            // Update existing
                            await fetch(`/api/user/experience/${exp.id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify(exp)
                            });
                        } else {
                            // Create new
                            await fetch('/api/user/experience', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify(exp)
                            });
                        }
                    }

                    // Save education
                    for (const edu of editedCV.education) {
                        if (edu.id) {
                            await fetch(`/api/user/education/${edu.id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify(edu)
                            });
                        } else {

                                body: JSON.stringify(edu)

                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },

                        } else if (skill.skill_text) {

                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify(skill)
                            });

                    await fetchMasterCV();
                    alert('Master CV sparad!');

                    alert('Kunde inte spara. Försök igen.');

                    setSavingMasterCV(false);

                setScraping(true);

                // Use quiz preferences as defaults if no manual keywords
                let kw = keywords.trim() ? keywords.split(',').map(k => k.trim()) : null;
                let location = 'Stockholm';

                if (!kw) {
                    const prefs = JSON.parse(localStorage.getItem('job_preferences') || '{}');
                    const roleMap = {
                        'servitor': 'servitör', 'kundtjanst': 'kundtjänst', 'butik': 'butik',
                        'lager': 'lager', 'kontor': 'kontor', 'tech': 'IT', 'vard': 'vård',
                        'hotell': 'hotell', 'barn': 'barnvakt', 'skola': 'lärare',
                        'tradgard': 'trädgård', 'stad': 'städ'
                    };
                    // Use custom freetext search first, then preset chips
                    if (prefs.custom_search && prefs.custom_search.trim()) {
                        kw = prefs.custom_search.split(',').map(k => k.trim()).filter(Boolean);
                    } else if (prefs.search_terms && prefs.search_terms.length > 0) {
                        kw = prefs.search_terms.map(r => roleMap[r] || r);
                    }
                    if (prefs.location && prefs.location.length > 0) {
                        const loc = prefs.location.find(l => l !== 'anywhere' && l !== 'remote');
                        if (loc) location = loc.charAt(0).toUpperCase() + loc.slice(1);
                    }
                }

                const res = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keywords: kw, location: location })

                const data = await res.json();

                                                <div key={i} className="bg-white/5 rounded-2xl p-6 border border-dashed border-white/20">
                                                    <span className="text-2xl mb-3 block">{f.icon}</span>
                                                    <h4 className="text-white font-semibold mb-2">{f.title}</h4>
                                                    <p className="text-white/50 text-sm leading-relaxed">{f.desc}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* CTA */}
                                    <div className="text-center py-12 border-t border-white/10">
                                        <h3 className="text-2xl font-bold text-white mb-4">Redo att sluta hata jobbsökande?</h3>
                                        <p className="text-white/60 mb-8">Testa gratis. Ingen bindningstid.</p>
                                        <div className="flex gap-4 justify-center">
                                            <a href="/login" className="bg-white text-indigo-700 px-8 py-3 font-semibold rounded-lg hover:bg-white/90 transition text-sm">
                                                Skapa konto
                                            </a>
                                            <button onClick={() => setLandingTab('priser')} className="border border-white/30 text-white px-8 py-3 rounded-lg hover:bg-white/10 transition text-sm">
                                                Se priser
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ============ PRISER TAB ============ */}
                            {landingTab === 'priser' && (
                                <div className="py-20">
                                    <div className="text-center max-w-2xl mx-auto mb-16">
                                        <p className="text-indigo-200 text-sm font-medium uppercase tracking-widest mb-4">Enkel prissättning</p>
                                        <h2 className="text-3xl md:text-4xl font-bold text-white mb-6">
                                            En plan. Allt ingår.
                                        </h2>
                                        <p className="text-white/70 text-lg">
                                            Inget krångel med olika nivåer. Du får tillgång till alla funktioner.
                                        </p>
                                    </div>

                                    <div className="max-w-md mx-auto">
                                        <div className="bg-white/10 backdrop-blur-sm rounded-3xl p-8 border border-white/20 text-center">
                                            <p className="text-white/60 text-sm mb-2">Per månad</p>
                                            <div className="flex items-baseline justify-center gap-1 mb-2">
                                                <span className="text-5xl font-bold text-white">499</span>
                                                <span className="text-white/60 text-lg">kr</span>
                                            </div>
                                            <p className="text-white/40 text-sm mb-8">Ingen bindningstid. Avsluta när du vill.</p>

                                            <a href="/login" className="block w-full bg-white text-indigo-700 py-3 rounded-xl font-semibold hover:bg-white/90 transition mb-8">
                                                Kom igång nu
                                            </a>

                                            <div className="text-left space-y-3">
                                                {[
                                                    'Master CV + 8 branschversioner',
                                                    'Obegränsat antal personliga brev',
                                                    'Platsbanken-sökning med smarta filter',
                                                    'AI som lär sig din skrivstil',
                                                    'Dealbreaker-filter (18 kategorier)',
                                                    'Gmail-integration med rätt CV bifogat',
                                                    'Ladda upp 20 CV:n + 20 brev',
                                                    'Ansökningsstatistik',
                                                    'Quiz: hitta din bransch',
                                                    'GDPR — din data säljs aldrig',
                                                    'Kommande: LinkedIn, Indeed, Jobbsafari',
                                                ].map((f, i) => (
                                                    <div key={i} className="flex items-center gap-3">
                                                        <span className="text-green-400 flex-shrink-0">✓</span>
                                                        <span className="text-white/80 text-sm">{f}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="mt-8 bg-white/5 rounded-2xl p-6 border border-white/10 text-center">
                                            <p className="text-white/80 text-sm font-medium mb-2">Billigare än en kopp kaffe om dagen</p>
                                            <p className="text-white/50 text-xs leading-relaxed">
                                                499 kr/mån = ca 16 kr/dag. Du lägger mer på en latte. Men det här kan leda till jobbet
                                                som förändrar allt. Tänk på vad det kostar att INTE söka jobb.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            </div>
                        </main>

                        <footer className="px-6 py-8 border-t border-white/10 mt-12">
                            <div className="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 text-white/40 text-xs">
                                <div className="flex gap-6">
                                    <a href="/integritetspolicy" className="hover:text-white/70">Integritetspolicy</a>
                                    <a href="/anvandarvillkor" className="hover:text-white/70">Användarvillkor</a>
                                </div>
                                <span>2026</span>
                            </div>
                        </footer>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    <header className="gradient text-white py-6 px-4">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <h1 className="text-2xl font-bold">Anti-Apathy Job Portal</h1>
                                    <p className="opacity-80 text-sm">Sök jobb utan apati. En ansökan i taget.</p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button
                                        onClick={() => setShowOnboarding(true)}
                                        className="text-white/60 hover:text-white text-sm transition px-3 py-1 rounded-lg hover:bg-white/10"
                                    >
                                        Preferenser
                                    </button>
                                    <UserMenu user={user} onLogout={handleLogout} />
                                </div>
                            </div>
                            <NavTabs activeTab={activeTab} setActiveTab={setActiveTab} />
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-6">

                        {activeTab === 'jobs' && (
                            <JobsPage
                                jobs={jobs}
                                onScrape={handleScrape}
                                onApply={handleApply}
                                scraping={scraping}
                                applyingJob={applyingJob}
                                savedJobs={savedJobs}
                                onSaveJob={handleSaveJob}
                                onOpenQuiz={() => setShowOnboarding(true)}
                            />
                        )}

                        {activeTab === 'cvs' && (
                            <MinaCVPage />
                        )}

                        {activeTab === 'applications' && (
                            <ApplicationsPage
                                applications={applications}
                                onRefresh={fetchApplications}
                            />
                        )}

                        {activeTab === 'metrics' && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                <h2 className="text-lg font-semibold">Din statistik</h2>

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-white rounded-xl p-5 border border-slate-100">
                                        <div className="text-3xl font-bold text-pink-600">{stats.total_jobs || 0}</div>
                                        <div className="text-slate-500 text-sm mt-1">Jobb hittade</div>
                                    </div>
                                    <div className="bg-white rounded-xl p-5 border border-slate-100">
                                        <div className="text-3xl font-bold text-green-600">{stats.sent || 0}</div>
                                        <div className="text-slate-500 text-sm mt-1">Ansökningar skickade</div>
                                    </div>
                                    <div className="bg-white rounded-xl p-5 border border-slate-100">
                                        <div className="text-3xl font-bold text-amber-600">{stats.interviews || 0}</div>
                                        <div className="text-slate-500 text-sm mt-1">Intervjuer</div>
                                    </div>
                                    <div className="bg-white rounded-xl p-5 border border-slate-100">
                                        <div className="text-3xl font-bold text-purple-600">{userCVs.length || 0}</div>
                                        <div className="text-slate-500 text-sm mt-1">CV-versioner</div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl p-5 border border-slate-100">
                                    <h3 className="font-semibold text-slate-700 mb-3">Sparade jobb</h3>
                                    <div className="text-3xl font-bold text-blue-600">{(savedJobs || []).length}</div>
                                </div>

                                <div className="bg-white rounded-xl p-5 border border-slate-100">
                                    <h3 className="font-semibold text-slate-700 mb-3">Deadline idag</h3>
                                    <div className="text-3xl font-bold text-red-600">{stats.deadline_today || 0}</div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'quiz' && (
                            <div className="max-w-3xl mx-auto">
                                <QuizPage
                                    onComplete={(answers) => {
                                        localStorage.setItem('job_preferences', JSON.stringify(answers));
                                        setActiveTab('jobs');
                                    }}
                                    saving={false}
                                />
                            </div>
                        )}

                        {activeTab === 'preferences' && (
                            <PreferencesPage />
                        )}

                        {activeTab === 'letter' && (
                            <LetterPreferencesPage />
                        )}

                        {activeTab === 'profil' && (
                            <ProfilPage />
                        )}
                    </main>

                    <ApplyModal
                        isOpen={showApplyModal}
                        job={selectedJob}
                        result={applyResult}
                        onClose={() => { setShowApplyModal(false); fetchApplications(); fetchStats(); }}
                        onSaveApplication={() => { fetchApplications(); fetchStats(); }}
                    />

                    <CVModal
                        isOpen={showCVModal}
                        vibe={selectedVibe}
                        cvText={selectedCVText}
                        onClose={() => setShowCVModal(false)}
                        onSave={handleSaveCV}
                    />

                    <MasterCVEditor
                        isOpen={showMasterCVModal}
                        masterCV={masterCV}
                        onClose={() => setShowMasterCVModal(false)}
                        onSave={handleSaveMasterCV}
                        saving={savingMasterCV}
                    />

                    <footer className="border-t border-slate-200 mt-8">
                        <div className="max-w-6xl mx-auto px-4 py-6 text-center text-sm text-slate-500">
                            <div className="flex justify-center gap-4 mb-2">
                                <a href="/integritetspolicy" className="hover:text-indigo-600">Integritetspolicy</a>
                                <span>·</span>
                                <a href="/anvandarvillkor" className="hover:text-indigo-600">Användarvillkor</a>
                            </div>
                            <p>© 2026 Platsbanken AI</p>
                        </div>
                    </footer>

                    {/* Version badge */}
                    <div style={{position:'fixed',bottom:'10px',right:'10px',fontSize:'10px',color:'#999',background:'#fff',padding:'4px 8px',borderRadius:'4px',border:'1px solid #ddd',zIndex:9999}}>
                        v11-2026-02-17
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
