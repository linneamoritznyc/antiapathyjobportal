            const toggleKommun = (id) => {
                setSelectedKommuner(prev => {
                    if (id === 'anywhere') return prev.includes('anywhere') ? prev.filter(k => k !== 'anywhere') : ['anywhere'];
                    const without = prev.filter(k => k !== 'anywhere');
                    return without.includes(id) ? without.filter(k => k !== id) : [...without, id];
                });
            };

            const toggleLan = (lanId) => setExpandedLan(prev => prev === lanId ? null : lanId);

            const selectAllInLan = (lan) => {
                const allIds = lan.kommuner.map(k => k.id);
                const allSelected = allIds.every(id => selectedKommuner.includes(id));
                setSelectedKommuner(prev => {
                    const without = prev.filter(k => k !== 'anywhere' && !allIds.includes(k));
                    return allSelected ? without : [...without, ...allIds];
                });
            };

            const saveLocation = () => {
                const updated = { ...prefs, location: selectedKommuner };
                localStorage.setItem('job_preferences', JSON.stringify(updated));
                setPrefs(updated);
                setSaved(true);
                window.dispatchEvent(new Event('prefsUpdated'));
                setTimeout(() => setSaved(false), 2000);
                authFetch('/api/user/preferences', {
                    method: 'POST', body: JSON.stringify(updated)
                }).catch(err => console.warn('Failed to sync location to server:', err));
            };

            const kommunCount = selectedKommuner.filter(k => k !== 'remote' && k !== 'anywhere').length;

            return (
                <div className="max-w-3xl mx-auto space-y-6">
                    <div className="flex items-center gap-3 mb-2">
                        <h2 className="text-2xl font-bold">📍 Platser</h2>
                        <span className="text-sm text-slate-400">Var vill du jobba?</span>
                    </div>

                    {/* Quick options */}
                    <div className="bg-white rounded-xl p-6 border border-slate-200">
                        <div className="flex flex-wrap gap-3 mb-2">
                            <button
                                onClick={() => toggleKommun('anywhere')}
                                className={`px-4 py-2 rounded-xl text-sm border-2 transition font-medium ${
                                    selectedKommuner.includes('anywhere')
                                        ? 'bg-indigo-600 border-indigo-600 text-white'
                                        : 'bg-white border-slate-200 text-slate-700 hover:border-indigo-300'
                                }`}
                            >
                                {selectedKommuner.includes('anywhere') ? '✓ ' : ''}Hela Sverige
                            </button>
                            <button
                                onClick={() => toggleKommun('remote')}
                                className={`px-4 py-2 rounded-xl text-sm border-2 transition font-medium ${
                                    selectedKommuner.includes('remote')
                                        ? 'bg-green-600 border-green-600 text-white'
                                        : 'bg-white border-slate-200 text-slate-700 hover:border-green-300'
                                }`}
                            >
                                {selectedKommuner.includes('remote') ? '✓ ' : ''}Distans / Remote
                            </button>
                        </div>
                        {selectedKommuner.includes('anywhere') && (
                            <p className="text-xs text-indigo-500 mt-1">Alla platser inkluderade - ingen geografisk filtrering</p>
                        )}
                    </div>

                    {/* County + municipality picker */}
                    {!selectedKommuner.includes('anywhere') && (
                        <div className="bg-white rounded-xl p-6 border border-slate-200">
                            <h3 className="text-sm font-semibold text-slate-600 uppercase tracking-wide mb-3">Välj län och kommuner</h3>

                                    <div className="flex flex-wrap gap-2 mb-4">
                                        {LAN_DATA.map(lan => {
                                            const count = lan.kommuner.filter(k => selectedKommuner.includes(k.id)).length;
                                            const isExpanded = expandedLan === lan.id;
                                            return (
                                                <button
                                                    key={lan.id}
                                                    onClick={() => toggleLan(lan.id)}
                                                    className={`px-3 py-1.5 rounded-full text-sm border transition flex items-center gap-1 ${
                                                        isExpanded
                                                            ? 'bg-indigo-600 border-indigo-600 text-white font-medium'
                                                            : count > 0
                                                                ? 'bg-indigo-100 border-indigo-400 text-indigo-800 font-medium'
                                                                : 'bg-slate-50 border-slate-200 text-slate-600 hover:border-indigo-300'
                                                    }`}
                                                >
                                                    {isExpanded ? '▾ ' : count > 0 ? '✓ ' : ''}{lan.label}
                                                    {count > 0 && !isExpanded && (
                                                        <span className="bg-indigo-500 text-white text-xs rounded-full px-1.5 py-0.5 leading-none ml-1">{count}</span>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {/* Expanded municipality picker */}
                                    {expandedLan && (() => {
                                        const lan = LAN_DATA.find(l => l.id === expandedLan);
                                        if (!lan) return null;
                                        const allSelected = lan.kommuner.every(k => selectedKommuner.includes(k.id));
                                        return (
                                            <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 mb-4 animate-fadeIn">
                                                <div className="flex items-center justify-between mb-3">
                                                    <p className="text-sm font-semibold text-indigo-700">{lan.label}</p>
                                                    <button
                                                        onClick={() => selectAllInLan(lan)}
                                                        className="text-xs text-indigo-500 hover:text-indigo-700 underline"
                                                    >
                                                        {allSelected ? 'Avmarkera alla' : 'Välj alla'}
                                                    </button>
                                                </div>
                                                <div className="flex flex-wrap gap-2">
                                                    {lan.kommuner.map(k => (
                                                        <button
                                                            key={k.id}
                                                            onClick={() => toggleKommun(k.id)}
                                                            className={`px-3 py-1.5 rounded-full text-sm border transition ${
                                                                selectedKommuner.includes(k.id)
                                                                    ? 'bg-indigo-500 border-indigo-500 text-white font-medium'
                                                                    : 'bg-white border-indigo-200 text-slate-700 hover:border-indigo-400'
                                                            }`}
                                                        >
                                                            {selectedKommuner.includes(k.id) ? '✓ ' : ''}{k.label}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })()}
                        </div>
                    )}

                    {/* Summary of selected locations */}
                    {kommunCount > 0 && (
                        <div className="bg-white rounded-xl p-6 border border-slate-200">
                            <h3 className="text-sm font-semibold text-slate-600 uppercase tracking-wide mb-3">
                                Valda platser ({kommunCount} kommun{kommunCount !== 1 ? 'er' : ''})
                            </h3>
                            <div className="flex flex-wrap gap-2">
                                {selectedKommuner.filter(k => k !== 'remote' && k !== 'anywhere').map(kId => {
                                    const found = LAN_DATA.flatMap(l => l.kommuner).find(k => k.id === kId);
                                    return found ? (
                                        <span key={kId} className="flex items-center gap-1 px-3 py-1.5 bg-indigo-100 text-indigo-800 rounded-full text-sm font-medium">
                                            {found.label}
                                            <button onClick={() => toggleKommun(kId)} className="text-indigo-400 hover:text-red-500 ml-0.5 font-bold">×</button>
                                        </span>
                                    ) : null;
                                })}
                                {selectedKommuner.includes('remote') && (
                                    <span className="flex items-center gap-1 px-3 py-1.5 bg-green-100 text-green-800 rounded-full text-sm font-medium">
                                        Distans / Remote
                                        <button onClick={() => toggleKommun('remote')} className="text-green-400 hover:text-red-500 ml-0.5 font-bold">×</button>
                                    </span>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Save button */}
                    <div className="flex justify-end pb-8">
                        <button
                            onClick={saveLocation}
                            className={`px-8 py-3 rounded-xl font-medium transition ${
                                saved ? 'bg-green-600 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'
                            }`}
                        >
                            {saved ? '✓ Sparat!' : '💾 Spara platser'}
                        </button>
                    </div>
                </div>
            );
        };

        // ============== PERSONLIGT BREV-PREFERENSER PAGE ==============

        const LetterPreferencesPage = () => {
            const [loading, setLoading] = useState(false);
            const [uploading, setUploading] = useState(false);
            const [pastedText, setPastedText] = useState('');
            const [mode, setMode] = useState('upload'); // 'upload' or 'paste'
            const [letterStyle, setLetterStyle] = useState(null);
            const [loadingStyle, setLoadingStyle] = useState(true);
            const [saveStatus, setSaveStatus] = useState('');
            const [dragOver, setDragOver] = useState(false);
            const [uploadedLetters, setUploadedLetters] = useState([]);
            const [deletingId, setDeletingId] = useState(null);
            const [newAvoidPhrase, setNewAvoidPhrase] = useState('');
            const [newLikePhrase, setNewLikePhrase] = useState('');
            const [anecdotes, setAnecdotes] = useState([]);
            const [showAnecdoteForm, setShowAnecdoteForm] = useState(false);
            const [newAnecdote, setNewAnecdote] = useState({ title: '', type: 'anecdote', content: '', keywords: '' });

            useEffect(() => {
                fetchLetterStyle();
                fetchUploadedLetters();
                fetchAnecdotes();
            }, []);

            const fetchUploadedLetters = async () => {
                if (!localStorage.getItem('auth_token')) return;
                try {
                    const res = await authFetch('/api/user/training-letters');
                    if (res.ok) {
                        const data = await res.json();
                        setUploadedLetters(data.letters || []);
                    }
                } catch(e) {}
            };

            const deleteLetter = async (id) => {
                if (!localStorage.getItem('auth_token')) return;
                setDeletingId(id);
                try {
                    const res = await authFetch(`/api/user/training-letters/${id}`, {
                        method: 'DELETE'
                    });
                    if (res.ok) {
                        setUploadedLetters(prev => prev.filter(l => l.id !== id));
                    }
                } catch(e) {}
                setDeletingId(null);
            };

            const fetchLetterStyle = async () => {
                if (!localStorage.getItem('auth_token')) { setLoadingStyle(false); return; }
                try {
                    const res = await authFetch('/api/user/letter-style');
                    if (res.ok) {
                        const data = await res.json();
                        setLetterStyle(data.style_summary || null);
                    }
                } catch(e) {}
                setLoadingStyle(false);
            };

            // ---- Phrase editing ----
            const updatePhrase = async (list, action, phrase) => {
                if (!phrase.trim()) return;
                try {
                    const res = await authFetch('/api/user/letter-style/phrases', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ list, action, phrase: phrase.trim() })
                    });
                    if (res.ok) {
                        await fetchLetterStyle();
                    }
                } catch(e) {}
            };

            // ---- Anecdotes ----
            const fetchAnecdotes = async () => {
                if (!localStorage.getItem('auth_token')) return;
                try {
                    const res = await authFetch('/api/user/anecdotes');
                    if (res.ok) {
                        const data = await res.json();
                        setAnecdotes(data.anecdotes || []);
                    }
                } catch(e) {}
            };

            const saveAnecdote = async () => {
                if (!newAnecdote.title.trim() || !newAnecdote.content.trim()) return;
                try {
                    const keywords = newAnecdote.keywords
                        ? newAnecdote.keywords.split(',').map(k => k.trim()).filter(Boolean)
                        : [];
                    const res = await authFetch('/api/user/anecdotes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...newAnecdote, keywords })
                    });
                    if (res.ok) {
                        setNewAnecdote({ title: '', type: 'anecdote', content: '', keywords: '' });
                        setShowAnecdoteForm(false);
                        await fetchAnecdotes();
                    }
                } catch(e) {}
            };

            const deleteAnecdote = async (id) => {
                try {
                    const res = await authFetch(`/api/user/anecdotes/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        setAnecdotes(prev => prev.filter(a => a.id !== id));
                    }
                } catch(e) {}
            };

            const uploadFile = async (file) => {
                const token = localStorage.getItem('auth_token');
                if (!token || !file) return;
                setUploading(true);
                setSaveStatus('Analyserar brev...');
                const formData = new FormData();
                formData.append('file', file);
                formData.append('type', 'cover_letter');
                try {
                    const res = await fetch('/api/user/upload-training-letter', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    const data = await res.json();
                    if (data.success) {
                        setSaveStatus('✓ AI har analyserat ditt brev!');
                        await fetchLetterStyle();
                        await fetchUploadedLetters();
                    } else {
                        setSaveStatus(data.detail || 'Något gick fel. Försök igen.');
                    }
                } catch(e) {
                    setSaveStatus('Något gick fel. Försök igen.');
                }
                setUploading(false);
            };

            const handleUpload = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.pdf,.docx,.doc,.txt,.rtf,.odt';
                input.onchange = (e) => uploadFile(e.target.files[0]);
                input.click();
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                const file = e.dataTransfer.files[0];
                if (file) uploadFile(file);
            };

            const handlePasteSubmit = async () => {
                if (!pastedText.trim()) return;
                if (!localStorage.getItem('auth_token')) return;
                setLoading(true);
                setSaveStatus('Analyserar text...');
                try {
                    const res = await authFetch('/api/user/analyze-letter-text', {
                        method: 'POST',
                        body: JSON.stringify({ text: pastedText })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setSaveStatus('✓ AI har analyserat din text!');
                        await fetchLetterStyle();
                    } else {
                        setSaveStatus('Något gick fel. Försök igen.');
                    }
                } catch(e) {
                    setSaveStatus('Något gick fel. Försök igen.');
                }
                setLoading(false);
            };

            return (
                <div className="max-w-3xl mx-auto space-y-6">
                    <div className="flex items-center gap-3 mb-2">
                        <h2 className="text-2xl font-bold">✍️ Personligt brev — preferenser</h2>
                    </div>

                    {/* Explanation */}
                    <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-5">
                        <h3 className="font-semibold text-indigo-900 mb-2">💡 Hur detta fungerar</h3>
                        <p className="text-sm text-indigo-800 leading-relaxed">
                            AI läser igenom ett eller flera personliga brev du skrivit och lär sig din stil — din ton, hur du presenterar dig, vilka fraser du brukar använda.
                            <br/><br/>
                            Du kan se exakt vad AI har lärt sig nedan, och ge specifik feedback. Det är mycket enklare att säga <em>"jag vill inte att du skriver 'passionerad'"</em> än att säga <em>"låt det låta mer som mig"</em>.
                        </p>
                    </div>

                    {/* Upload or paste */}
                    <div className="bg-white rounded-xl p-6 border border-slate-200">
                        <h3 className="text-lg font-semibold mb-1">📤 Träna din AI</h3>
                        <p className="text-sm text-slate-500 mb-4">
                            Vi säljer aldrig din data. Brevet används enbart för att göra dina ansökningar bättre.{' '}
                            <a href="https://gdpr.eu/what-is-gdpr/" target="_blank" rel="noopener noreferrer" className="text-indigo-500 underline hover:text-indigo-700">Läs mer om GDPR</a>.
                        </p>

                        {/* Mode toggle */}
                        <div className="flex gap-2 mb-5 p-1 bg-slate-100 rounded-lg w-fit">
                            <button
                                onClick={() => setMode('upload')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${mode === 'upload' ? 'bg-white shadow text-slate-800' : 'text-slate-500'}`}
                            >
                                📂 Ladda upp fil
                            </button>
                            <button
                                onClick={() => setMode('paste')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${mode === 'paste' ? 'bg-white shadow text-slate-800' : 'text-slate-500'}`}
                            >
                                📋 Klistra in text
                            </button>
                        </div>

                        {mode === 'upload' && (
                            <div
                                onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
                                onDragLeave={() => setDragOver(false)}
                                onDrop={handleDrop}
                                onClick={!uploading ? handleUpload : undefined}
                                className={`w-full border-2 border-dashed rounded-xl py-12 text-center transition cursor-pointer select-none ${
                                    uploading ? 'opacity-50 cursor-default' :
                                    dragOver ? 'border-indigo-500 bg-indigo-50 text-indigo-600 scale-[1.01]' :
                                    'border-slate-300 hover:border-indigo-400 text-slate-500 hover:text-indigo-600'
                                }`}
                            >
                                <div className="text-4xl mb-2">{dragOver ? '📥' : uploading ? '⏳' : '📂'}</div>
                                <div className="font-medium text-base">
                                    {uploading ? 'Analyserar...' : dragOver ? 'Släpp filen här' : 'Dra hit en fil, eller klicka för att välja'}
                                </div>
                                <div className="text-xs mt-1 text-slate-400">PDF, DOCX, DOC, TXT, RTF, ODT</div>
                            </div>
                        )}

                        {mode === 'paste' && (
                            <div>
                                <textarea
                                    value={pastedText}
                                    onChange={e => setPastedText(e.target.value)}
                                    placeholder="Klistra in ditt personliga brev här..."
                                    rows={10}
                                    className="w-full border border-slate-300 rounded-xl p-4 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"
                                />
                                <button
                                    onClick={handlePasteSubmit}
                                    disabled={loading || !pastedText.trim()}
                                    className="mt-3 w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 disabled:opacity-50"
                                >
                                    {loading ? 'Analyserar...' : '🔍 Analysera brevets stil'}
                                </button>
                            </div>
                        )}

                        {saveStatus && (
                            <div className={`mt-4 p-3 rounded-lg text-sm ${saveStatus.startsWith('✓') ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'}`}>
                                {saveStatus}
                            </div>
                        )}
                    </div>

                    {/* Uploaded letters list */}
                    {uploadedLetters.length > 0 && (
                        <div className="bg-white rounded-xl p-6 border border-slate-200">
                            <h3 className="text-lg font-semibold mb-1">📚 Dina uppladdade brev</h3>
                            <p className="text-sm text-slate-500 mb-4">
                                {uploadedLetters.length} av 20 brev uppladdade
                            </p>
                            <div className="space-y-2">
                                {uploadedLetters.map(letter => (
                                    <div key={letter.id} className="flex items-center justify-between bg-slate-50 rounded-lg px-4 py-3 border border-slate-100">
                                        <div className="flex items-center gap-3 min-w-0">
                                            <span className="text-lg flex-shrink-0">📄</span>
                                            <div className="min-w-0">
                                                <div className="text-sm font-medium text-slate-700 truncate">{letter.filename}</div>
                                                <div className="text-xs text-slate-400">
                                                    {new Date(letter.uploaded_at).toLocaleDateString('sv-SE')}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 flex-shrink-0">
                                            {letter.file_url && (
                                                <a
                                                    href={letter.file_url}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="text-indigo-600 hover:text-indigo-800 text-sm font-medium"
                                                >
                                                    Visa
                                                </a>
                                            )}
                                            <button
                                                onClick={() => deleteLetter(letter.id)}
                                                disabled={deletingId === letter.id}
                                                className="text-red-400 hover:text-red-600 text-sm disabled:opacity-50"
                                            >
                                                {deletingId === letter.id ? '...' : '✕'}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* AI style summary */}
                    <div className="bg-white rounded-xl p-6 border border-slate-200">
                        <h3 className="text-lg font-semibold mb-1">🤖 Vad AI vet om din stil</h3>
                        <p className="text-sm text-slate-500 mb-4">
                            Detta är exakt hur AI förstår din skrivstil. Om något stämmer dåligt — uppdatera det!
                        </p>

                        {loadingStyle ? (
                            <div className="text-slate-400 text-sm">Laddar...</div>
                        ) : letterStyle ? (
                            <div className="space-y-4">
                                {letterStyle.tone && (
                                    <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">🎭 Ton</div>
                                        <div className="text-sm text-slate-700">{letterStyle.tone}</div>
                                    </div>
                                )}
                                {letterStyle.structure && (
                                    <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">📐 Struktur</div>
                                        <div className="text-sm text-slate-700">{letterStyle.structure}</div>
                                    </div>
                                )}
                                <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                    <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">💬 Fraser jag gillar</div>
                                    <div className="flex flex-wrap gap-2 mb-3">
                                        {(letterStyle.phrases || []).map((p, i) => (
                                            <span key={i} className="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs rounded-full flex items-center gap-1">
                                                "{p}"
                                                <button onClick={() => updatePhrase('phrases', 'remove', p)} className="text-indigo-400 hover:text-indigo-700 ml-1">&times;</button>
                                            </span>
                                        ))}
                                        {(!letterStyle.phrases || letterStyle.phrases.length === 0) && (
                                            <span className="text-xs text-slate-400">Inga fraser tillagda</span>
                                        )}
                                    </div>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={newLikePhrase}
                                            onChange={e => setNewLikePhrase(e.target.value)}
                                            onKeyDown={e => { if (e.key === 'Enter') { updatePhrase('phrases', 'add', newLikePhrase); setNewLikePhrase(''); }}}
                                            placeholder="Lägg till fras..."
                                            className="flex-1 text-xs px-3 py-1.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                        />
                                        <button
                                            onClick={() => { updatePhrase('phrases', 'add', newLikePhrase); setNewLikePhrase(''); }}
                                            className="px-3 py-1.5 bg-indigo-600 text-white text-xs rounded-lg hover:bg-indigo-700"
                                        >+</button>
                                    </div>
                                </div>
                                <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                    <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">🚫 Fraser jag INTE vill ha</div>
                                    <div className="flex flex-wrap gap-2 mb-3">
                                        {(letterStyle.avoid || []).map((p, i) => (
                                            <span key={i} className="px-2 py-1 bg-red-100 text-red-700 text-xs rounded-full flex items-center gap-1">
                                                "{p}"
                                                <button onClick={() => updatePhrase('avoid', 'remove', p)} className="text-red-400 hover:text-red-700 ml-1">&times;</button>
                                            </span>
                                        ))}
                                        {(!letterStyle.avoid || letterStyle.avoid.length === 0) && (
                                            <span className="text-xs text-slate-400">Inga fraser tillagda</span>
                                        )}
                                    </div>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={newAvoidPhrase}
                                            onChange={e => setNewAvoidPhrase(e.target.value)}
                                            onKeyDown={e => { if (e.key === 'Enter') { updatePhrase('avoid', 'add', newAvoidPhrase); setNewAvoidPhrase(''); }}}
                                            placeholder='T.ex. "Jag är övertygad om"'
                                            className="flex-1 text-xs px-3 py-1.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500"
                                        />
                                        <button
                                            onClick={() => { updatePhrase('avoid', 'add', newAvoidPhrase); setNewAvoidPhrase(''); }}
                                            className="px-3 py-1.5 bg-red-600 text-white text-xs rounded-lg hover:bg-red-700"
                                        >+</button>
                                    </div>
                                </div>
                                {letterStyle.length_preference && (
                                    <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">📏 Längd & tempo</div>
                                        <div className="text-sm text-slate-700">{letterStyle.length_preference}</div>
                                    </div>
                                )}
                                {letterStyle.opening_style && (
                                    <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">🚀 Hur du brukar börja</div>
                                        <div className="text-sm text-slate-700">{letterStyle.opening_style}</div>
                                    </div>
                                )}

                                <div className="bg-amber-50 border border-amber-200 rounded-lg p-4">
                                    <p className="text-xs text-amber-800">
                                        <strong>💡 Tips:</strong> Om AI:s beskrivning av din stil inte stämmer, ladda upp ett brev du är nöjd med för att "träna om" den.
                                    </p>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center py-10 text-slate-400">
                                <div className="text-4xl mb-3">📭</div>
                                <div className="font-medium mb-1">Inget brev analyserat ännu</div>
                                <div className="text-sm">Ladda upp eller klistra in ett brev ovan för att träna din AI</div>
                            </div>
                        )}
                    </div>

                    {/* Anecdotes & Hobbies */}
                    <div className="bg-white rounded-xl p-6 border border-slate-200">
                        <div className="flex items-center justify-between mb-1">
                            <h3 className="text-lg font-semibold">✨ Mina anekdoter & hobbys</h3>
                            <button
                                onClick={() => setShowAnecdoteForm(!showAnecdoteForm)}
                                className="px-3 py-1.5 bg-indigo-600 text-white text-xs rounded-lg hover:bg-indigo-700"
                            >
                                {showAnecdoteForm ? 'Avbryt' : '+ Lägg till'}
                            </button>
                        </div>
                        <p className="text-sm text-slate-500 mb-4">
                            Personliga historier och hobbys som AI kan väva in i dina personliga brev när de är relevanta.
                        </p>

                        {showAnecdoteForm && (
                            <div className="bg-slate-50 rounded-lg p-4 border border-slate-200 mb-4 space-y-3">
                                <div className="flex gap-3">
                                    <div className="flex-1">
                                        <label className="text-xs font-medium text-slate-600 block mb-1">Titel</label>
                                        <input
                                            type="text"
                                            value={newAnecdote.title}
                                            onChange={e => setNewAnecdote(prev => ({...prev, title: e.target.value}))}
                                            placeholder='T.ex. "Svenska Kyrkan" eller "Gymma"'
                                            className="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-medium text-slate-600 block mb-1">Typ</label>
                                        <select
                                            value={newAnecdote.type}
                                            onChange={e => setNewAnecdote(prev => ({...prev, type: e.target.value}))}
                                            className="text-sm px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        >
                                            <option value="anecdote">Anekdot</option>
                                            <option value="hobby">Hobby</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-medium text-slate-600 block mb-1">
                                        {newAnecdote.type === 'hobby' ? 'Beskriv din hobby' : 'Berätta din historia'}
                                    </label>
                                    <textarea
                                        value={newAnecdote.content}
                                        onChange={e => setNewAnecdote(prev => ({...prev, content: e.target.value}))}
                                        placeholder={newAnecdote.type === 'hobby'
                                            ? 'T.ex. "Jag gymmar regelbundet och värdesätter disciplin och uthållighet"'
                                            : 'T.ex. "Jag var konfirmationsledare i Värmdö Församling 2012-2014, både under terminerna och på sommarläger..."'}
                                        rows={3}
                                        className="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs font-medium text-slate-600 block mb-1">
                                        Nyckelord (kommaseparerade) — AI matchar dessa mot jobbannonser
                                    </label>
                                    <input
                                        type="text"
                                        value={newAnecdote.keywords}
                                        onChange={e => setNewAnecdote(prev => ({...prev, keywords: e.target.value}))}
                                        placeholder='T.ex. "kyrka, församling, ideellt, ungdom"'
                                        className="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                    />
                                </div>
                                <button
                                    onClick={saveAnecdote}
                                    disabled={!newAnecdote.title.trim() || !newAnecdote.content.trim()}
                                    className="px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed"
                                >
                                    Spara
                                </button>
                            </div>
                        )}

                        {anecdotes.length > 0 ? (
                            <div className="space-y-3">
                                {anecdotes.map(a => (
                                    <div key={a.id} className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                        <div className="flex items-start justify-between">
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="text-sm">{a.type === 'hobby' ? '🏋️' : '📖'}</span>
                                                    <span className="text-sm font-semibold text-slate-700">{a.title}</span>
                                                    <span className="px-1.5 py-0.5 text-[10px] rounded-full bg-slate-200 text-slate-500 uppercase">
                                                        {a.type === 'hobby' ? 'Hobby' : 'Anekdot'}
                                                    </span>
                                                </div>
                                                <p className="text-sm text-slate-600 mb-2">{a.content}</p>
                                                {a.keywords && a.keywords.length > 0 && (
                                                    <div className="flex flex-wrap gap-1">
                                                        {a.keywords.map((kw, ki) => (
                                                            <span key={ki} className="px-1.5 py-0.5 bg-indigo-50 text-indigo-600 text-[10px] rounded-full">{kw}</span>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                            <button
                                                onClick={() => deleteAnecdote(a.id)}
                                                className="text-red-400 hover:text-red-600 text-sm ml-3 flex-shrink-0"
                                            >✕</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : !showAnecdoteForm && (
                            <div className="text-center py-8 text-slate-400">
                                <div className="text-3xl mb-2">📝</div>
                                <div className="text-sm">Inga anekdoter eller hobbys tillagda ännu</div>
                                <div className="text-xs mt-1">Lägg till personliga historier som gör dina brev unika!</div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // External jobs page — jobs without contact email (apply via external website)
        const ExternalJobsPage = ({ jobs, onScrape, scraping, savedJobs, onSaveJob, onOpenQuiz, setActiveTab }) => {
            const [keywords, setKeywords] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const [hiddenJobIds, setHiddenJobIds] = useState(new Set());
            const [showHidden, setShowHidden] = useState(false);
            const [prefsKey, setPrefsKey] = useState(0);
            const [generatingLetter, setGeneratingLetter] = useState(null);
            const [generatedLetter, setGeneratedLetter] = useState({});  // { jobId: letterText }
            const [editedLetter, setEditedLetter] = useState({});  // { jobId: editedText }
            const [editMode, setEditMode] = useState(false);
            const [copied, setCopied] = useState(false);
            const [downloadingPdf, setDownloadingPdf] = useState(false);
            const [leftPanel, setLeftPanel] = useState('description');  // 'description' | 'letter' | 'qa'

            // Q&A state
            const [qaQuestion, setQaQuestion] = useState('');
            const [qaAnswers, setQaAnswers] = useState({});  // { jobId: [{q, a}] }
            const [answeringQ, setAnsweringQ] = useState(false);
            const [copiedQA, setCopiedQA] = useState(null);

            // CV recommendation
            const [cvRec, setCvRec] = useState({});  // { jobId: { vibe, filename } }
            const VIBE_DISPLAY = {
                restaurant: { name: 'Restaurang & Café', emoji: '🍽️' },
                retail: { name: 'Butik & Kassa', emoji: '🛍️' },
                customerservice: { name: 'Kundtjänst', emoji: '📞' },
                tech: { name: 'Tech & Kontor', emoji: '💻' },
                healthcare: { name: 'Vård & Omsorg', emoji: '🏥' },
                industri: { name: 'Industri & Trädgård', emoji: '🔧' },
                contentmoderation: { name: 'Content Moderation', emoji: '🛡️' },
                art: { name: 'Konst & Kultur', emoji: '🎨' },
            };

            // Re-read preferences when saved from Preferenser tab
            useEffect(() => {
                const handler = () => { setPrefsKey(k => k + 1); setCurrentPage(1); };
                window.addEventListener('prefsUpdated', handler);
                return () => window.removeEventListener('prefsUpdated', handler);
            }, []);

            // Load quiz preferences for filtering (same as JobsPage)
            const quizPrefs = useMemo(() => {
                try { return JSON.parse(localStorage.getItem('job_preferences') || '{}'); }
                catch(e) { return {}; }
            }, [jobs, prefsKey]);

            const logInteraction = async (jobId, action, context = {}) => {
                if (!localStorage.getItem('auth_token')) return;
                try {
                    await authFetch(`/api/jobs/${jobId}/interaction`, {
                        method: 'POST',
                        body: JSON.stringify({ action, context })
                    });
                } catch (e) {}
            };

            const handleSkip = (job) => {
                logInteraction(job.id, 'skipped');
                setLeftPanel('description');
                setEditMode(false);
                setCurrentPage(p => Math.min(filteredJobs.length, p + 1));
            };

            const handleReject = (job) => {
                logInteraction(job.id, 'rejected');
                setHiddenJobIds(prev => new Set([...prev, job.id]));
                setLeftPanel('description');
                setEditMode(false);
            };

            const handleGenerateLetter = async (job) => {
                setGeneratingLetter(job.id);
                try {
                    const res = await authFetch(`/api/jobs/${job.id}/apply-with-cv`, {
                        method: 'POST',
                        body: JSON.stringify({ job })
                    });
                    const data = await res.json();
                    if (data.success && data.cover_letter) {
                        setGeneratedLetter(prev => ({ ...prev, [job.id]: data.cover_letter }));
                        setEditedLetter(prev => ({ ...prev, [job.id]: data.cover_letter }));
                        if (data.matched_vibe) {
                            setCvRec(prev => ({ ...prev, [job.id]: { vibe: data.matched_vibe, filename: data.cv_filename } }));
                        }
                        setLeftPanel('letter');
                    } else {
                        alert(data.detail || 'Kunde inte generera brev just nu.');
                    }
                } catch (err) {
                    console.error('Failed to generate letter:', err);
                    alert('Kunde inte ansluta till servern.');
                }
                setGeneratingLetter(null);
            };

            const handleCopy = (text) => {
                navigator.clipboard.writeText(text);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const handleDownloadPdf = async (job) => {
                setDownloadingPdf(true);
                try {
                    const letterText = editedLetter[job.id] || generatedLetter[job.id];
                    const res = await authFetch(`/api/jobs/${job.id}/cover-letter-pdf`, {
                        method: 'POST',
                        body: JSON.stringify({
                            cover_letter: letterText,
                            job_title: job.title,
                            company: job.company
                        })
                    });
                    if (res.ok) {
                        const blob = await res.blob();
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `Personligt_Brev_${(job.company || 'Ansökan').replace(/\s+/g, '_')}.pdf`;
                        a.click();
                        URL.revokeObjectURL(url);
                    } else {
                        alert('Kunde inte ladda ner PDF.');
                    }
                } catch (err) {
                    console.error('PDF download error:', err);
                    alert('Kunde inte ladda ner PDF.');
                }
                setDownloadingPdf(false);
            };

            const handleAskQuestion = async (job) => {
                if (!qaQuestion.trim()) return;
                setAnsweringQ(true);
                try {
                    const res = await authFetch(`/api/jobs/${job.id}/answer-question`, {
                        method: 'POST',
                        body: JSON.stringify({ question: qaQuestion, job })
                    });
                    const data = await res.json();
                    if (data.success && data.answer) {
                        setQaAnswers(prev => ({
                            ...prev,
                            [job.id]: [...(prev[job.id] || []), { q: qaQuestion, a: data.answer }]
                        }));
                        setQaQuestion('');
                    } else {
                        alert(data.detail || 'Kunde inte generera svar.');
                    }
                } catch (err) {
                    alert('Kunde inte ansluta till servern.');
                }
                setAnsweringQ(false);
            };

            const handleCopyQA = (text, idx) => {
                navigator.clipboard.writeText(text);
                setCopiedQA(idx);
                setTimeout(() => setCopiedQA(null), 2000);
            };

            const filteredJobs = jobs
                .filter(job => {
                    if (!showHidden && hiddenJobIds.has(job.id)) return false;

                    // Working hours filter
                    const wh = quizPrefs.working_hours;
                    if (wh && wh !== 'both') {
                        const jobWH = (job.working_hours || '').toLowerCase();
                        if (wh === 'heltid' && jobWH && !jobWH.includes('heltid')) return false;
                        if (wh === 'deltid' && jobWH && !jobWH.includes('deltid')) return false;
                        if (wh === 'extra' && jobWH && !jobWH.includes('deltid') && !jobWH.includes('timm')) return false;
                    }

                    // Employment form filter
                    const ef = quizPrefs.employment_form;
                    if (ef && ef.length > 0 && !ef.includes('anything')) {
                        const jobET = (job.employment_type || '').toLowerCase();
                        if (jobET) {
                            const matchMap = { 'tillsvidare': 'tillsvidare', 'tidsbegransad': 'tidsbegräns', 'behov': 'behov', 'sommar': 'sommar' };
                            const matches = ef.some(f => jobET.includes(matchMap[f] || f));
                            if (!matches) return false;
                        }
                    }

                    // Duration filter
                    const dur = quizPrefs.duration;
                    if (dur && dur !== 'anything') {
                        const jobDur = (job.duration || '').toLowerCase();
                        if (jobDur) {
                            if (dur === 'tillsvidare' && !jobDur.includes('tillsvidare')) return false;
                            if (dur === 'over6' && !jobDur.includes('6 mån') && !jobDur.includes('längre')) return false;
                            if (dur === '3to6' && !jobDur.includes('3') && !jobDur.includes('6')) return false;
                            if (dur === 'under3' && !jobDur.includes('3 mån') && !jobDur.includes('kort')) return false;
                        }
                    }

                    // Salary filter
                    const sal = quizPrefs.salary;
                    if (sal && sal !== 'anything') {
                        const jobSal = (job.salary_type || job.salary_description || '').toLowerCase();
                        if (jobSal) {
                            if (sal === 'fast' && !jobSal.includes('fast')) return false;
                            if (sal === 'provision' && !jobSal.includes('provision') && !jobSal.includes('ackord')) return false;
                        }
                    }

                    // Dealbreakers
                    const db = quizPrefs.dealbreakers;
                    if (db && db.length > 0 && !db.includes('ingen')) {
                        const desc = (job.description || '').toLowerCase();
                        const title = (job.title || '').toLowerCase();
                        const dbMap = { 'natt': 'natt', 'helg': 'helg', 'telefon': 'telefon', 'tunga_lyft': 'tunga lyft', 'utomhus': 'utomhus' };
                        const hasBreaker = db.some(d => { const kw = dbMap[d] || d; return desc.includes(kw) || title.includes(kw); });
                        if (hasBreaker) return false;
                    }

                    // Negative keywords
                    const negKw = quizPrefs.negative_keywords || [];
                    if (negKw.length > 0) {
                        const titleLow = (job.title || '').toLowerCase();
                        const descLow = (job.description || '').toLowerCase();
                        if (negKw.some(kw => titleLow.includes(kw.toLowerCase()) || descLow.includes(kw.toLowerCase()))) return false;
                    }

                    // Geography filter
                    const locPrefs = quizPrefs.location || [];
                    if (locPrefs.length > 0 && !locPrefs.includes('anywhere')) {
                        const kommunLabels = locPrefs
                            .filter(k => k !== 'remote' && k !== 'anywhere')
                            .map(id => { for (const lan of LAN_DATA) { const f = lan.kommuner.find(k => k.id === id); if (f) return f.label.toLowerCase(); } return id.toLowerCase(); });
                        if (kommunLabels.length > 0) {
                            const jobLoc = (job.location || '').toLowerCase();
                            const jobMuni = (job.municipality || '').toLowerCase();
                            if (jobLoc || jobMuni) {
                                const matchesLoc = kommunLabels.some(k => jobLoc.includes(k) || jobMuni.includes(k));
                                const isRemote = locPrefs.includes('remote') && (jobLoc.includes('remote') || jobLoc.includes('distans') || jobLoc.includes('hemma'));
                                if (!matchesLoc && !isRemote) return false;
                            }
                        }
                    }

                    return true;
                })
                .sort((a, b) => new Date(a.deadline || '2099-12-31') - new Date(b.deadline || '2099-12-31'));

            const jobIndex = currentPage - 1;
            const currentJob = filteredJobs[jobIndex];
            const currentLetter = currentJob ? generatedLetter[currentJob.id] : null;
            const currentEdited = currentJob ? editedLetter[currentJob.id] : null;
            const currentQAs = currentJob ? (qaAnswers[currentJob.id] || []) : [];

            // Reset panel when changing jobs
            useEffect(() => {
                if (currentJob && !generatedLetter[currentJob.id]) {
                    setLeftPanel('description');
                    setEditMode(false);
                }
            }, [currentPage]);

            // Render job description HTML (shared helper)
            const renderDescription = (desc) => {
                if (!desc) return '<p style="color:#94a3b8">Ingen beskrivning tillgänglig.</p>';
                let text = desc.substring(0, 6000);
                text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                let lines = text.split(/\n/);
                let html = '';
                let inList = false;
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) {
                        if (inList) { html += '</ul>'; inList = false; }
                        html += '<div style="height:0.5rem"></div>';
                        continue;
                    }
                    if (/^[•\-–—\*]\s/.test(trimmed)) {
                        if (!inList) { html += '<ul style="margin:0.5rem 0 0.5rem 1.2rem;padding:0">'; inList = true; }
                        html += '<li style="margin-bottom:0.25rem">' + trimmed.replace(/^[•\-–—\*]\s*/, '') + '</li>';
                    } else if (/^[A-ZÅÄÖ\s]{4,50}:?\s*$/.test(trimmed)) {
                        if (inList) { html += '</ul>'; inList = false; }
                        html += '<p style="font-weight:600;color:#374151;margin:1rem 0 0.25rem;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.05em">' + trimmed + '</p>';
                    } else {
                        if (inList) { html += '</ul>'; inList = false; }
                        html += '<p style="margin-bottom:0.4rem">' + trimmed + '</p>';
                    }
                }
                if (inList) html += '</ul>';
                return html;
            };

            return (
                <div>
                    {/* Search bar */}
                    <div className="flex items-center gap-3 mb-4">
                        <input
                            type="text"
                            value={keywords}
                            onChange={(e) => setKeywords(e.target.value)}
                            placeholder="Sök jobb på Platsbanken..."
                            className="flex-1 border border-slate-200 bg-white rounded-xl px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-300"
                            onKeyDown={(e) => e.key === 'Enter' && onScrape(keywords)}
                        />
                        <button
                            onClick={() => onScrape(keywords)}
                            disabled={scraping}
                            className="bg-amber-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-600 disabled:opacity-50 shadow-sm whitespace-nowrap"
                        >
                            {scraping ? '⏳ Söker...' : '🔍 Sök'}
                        </button>
                        {hiddenJobIds.size > 0 && (
                            <button
                                onClick={() => setShowHidden(h => !h)}
                                className="text-sm text-slate-400 hover:text-slate-600 transition whitespace-nowrap"
                            >
                                {showHidden ? '🙈 Dölj' : `👁 ${hiddenJobIds.size} dolda`}
                            </button>
                        )}
                    </div>

                    {/* Geography filter indicator */}
                    {(() => {
                        const locPrefs = quizPrefs.location || [];
                        const activeKommuner = locPrefs.filter(k => k !== 'remote' && k !== 'anywhere');
                        if (activeKommuner.length === 0 || locPrefs.includes('anywhere')) return null;
                        const labels = activeKommuner.map(id => {
                            for (const lan of LAN_DATA) { const f = lan.kommuner.find(k => k.id === id); if (f) return f.label; }
                            return id;
                        });
                        return (
                            <div className="flex items-center gap-2 mb-3 flex-wrap">
                                <span className="text-xs text-slate-400">📍 Visar jobb i:</span>
                                {labels.map(l => (
                                    <span key={l} className="bg-amber-100 text-amber-700 text-xs px-2 py-0.5 rounded-full font-medium">{l}</span>
                                ))}
                                {locPrefs.includes('remote') && (
                                    <span className="bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded-full font-medium">Remote</span>
                                )}
                                {setActiveTab && (
                                    <button onClick={() => setActiveTab('platser')} className="text-xs text-amber-500 hover:text-amber-700 underline">Ändra</button>
                                )}
                            </div>
                        );
                    })()}

                    {scraping ? (
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-8" style={{minHeight: '60vh'}}>
                            <div className="flex items-center justify-center h-full" style={{minHeight: '50vh'}}>
                                <div className="text-center">
                                    <div className="inline-block animate-spin rounded-full h-10 w-10 border-4 border-amber-200 border-t-amber-500 mb-4" />
                                    <p className="text-slate-500 font-medium">Söker jobb på Platsbanken...</p>
                                    <p className="text-slate-400 text-sm mt-1">Hämtar och filtrerar annonser</p>
                                </div>
                            </div>
                        </div>
                    ) : jobs.length === 0 ? (
                        <div className="bg-white rounded-xl p-10 text-center shadow-sm">
                            <p className="text-slate-500 mb-2">Inga externa jobb hittade.</p>
                            <p className="text-slate-400 text-sm mb-4">Dessa är jobb som kräver ansökan via arbetsgivarens webbplats.</p>
                            <button onClick={() => onScrape('')} disabled={scraping} className="bg-amber-500 text-white px-6 py-3 rounded-xl font-medium hover:bg-amber-600 disabled:opacity-50 transition">
                                Sök jobb
                            </button>
                        </div>

        // Jobs page (email-apply jobs only)
        const JobsPage = ({ jobs, onScrape, onApply, scraping, applyingJob, savedJobs, onSaveJob, onOpenQuiz }) => {
            const [keywords, setKeywords] = useState('');
            const [filterText, setFilterText] = useState('');
            const [filterPriority, setFilterPriority] = useState('all');
            const [sortBy, setSortBy] = useState('deadline');
            const [currentPage, setCurrentPage] = useState(1);
            const jobsPerPage = 12;
            const [prefsKey, setPrefsKey] = useState(0);
            const [hiddenJobIds, setHiddenJobIds] = useState(new Set()); // locally rejected jobs
            const [showHidden, setShowHidden] = useState(false);

            // Log interaction signal to backend (Meta-style event collection)
            const logInteraction = async (jobId, action, context = {}) => {
                if (!localStorage.getItem('auth_token')) return;
                try {
                    await authFetch(`/api/jobs/${jobId}/interaction`, {
                        method: 'POST',
                        body: JSON.stringify({ action, context })
                    });
                } catch (e) {
                    console.error('Interaction log error:', e);
                }
            };

            const handleSkip = (job) => {
                logInteraction(job.id, 'skipped');
                setCurrentPage(p => Math.min(filteredJobs.length, p + 1));
            };

            const handleReject = (job) => {
                logInteraction(job.id, 'rejected');
                setHiddenJobIds(prev => new Set([...prev, job.id]));
                // Stay on same page index — next job slides in automatically
            };

            // Re-read preferences when saved from Preferenser tab
            useEffect(() => {
                const handler = () => setPrefsKey(k => k + 1);
                window.addEventListener('prefsUpdated', handler);
                return () => window.removeEventListener('prefsUpdated', handler);
            }, []);

            // Reset to page 1 when filters change
            useEffect(() => {
                setCurrentPage(1);
            }, [filterText, filterPriority, sortBy, jobs.length]);

            // Load quiz preferences for filtering
            const quizPrefs = useMemo(() => {
                try { return JSON.parse(localStorage.getItem('job_preferences') || '{}'); }
                catch(e) { return {}; }
            }, [jobs, prefsKey]);

            // Filter and sort jobs
            const filteredJobs = jobs
                .filter(job => {
                    // Hide locally rejected jobs unless "Visa dolda" is on
                    if (!showHidden && hiddenJobIds.has(job.id)) return false;

                    // Text filter
                    if (filterText) {
                        const search = filterText.toLowerCase();
                        const matchesText =
                            job.title?.toLowerCase().includes(search) ||
                            job.company?.toLowerCase().includes(search) ||
                            job.location?.toLowerCase().includes(search);
                        if (!matchesText) return false;
                    }
                    // Priority filter
                    if (filterPriority !== 'all' && job.priority !== filterPriority) {
                        return false;
                    }

                    // Quiz preference filters
                    const wh = quizPrefs.working_hours;
                    if (wh && wh !== 'both') {
                        const jobWH = (job.working_hours || '').toLowerCase();
                        if (wh === 'heltid' && jobWH && !jobWH.includes('heltid')) return false;
                        if (wh === 'deltid' && jobWH && !jobWH.includes('deltid')) return false;
                        if (wh === 'extra' && jobWH && !jobWH.includes('deltid') && !jobWH.includes('timm')) return false;
                    }

                    const ef = quizPrefs.employment_form;
                    if (ef && ef.length > 0 && !ef.includes('anything')) {
                        const jobET = (job.employment_type || '').toLowerCase();
                        if (jobET) {
                            const matchMap = {
                                'tillsvidare': 'tillsvidare', 'tidsbegransad': 'tidsbegräns',
                                'behov': 'behov', 'sommar': 'sommar'
                            };
                            const matches = ef.some(f => jobET.includes(matchMap[f] || f));
                            if (!matches) return false;
                        }
                    }

                    const dur = quizPrefs.duration;
                    if (dur && dur !== 'anything') {
                        const jobDur = (job.duration || '').toLowerCase();
                        if (jobDur) {
                            if (dur === 'tillsvidare' && !jobDur.includes('tillsvidare')) return false;
                            if (dur === 'over6' && !jobDur.includes('6 mån') && !jobDur.includes('längre')) return false;
                            if (dur === '3to6' && !jobDur.includes('3') && !jobDur.includes('6')) return false;
                            if (dur === 'under3' && !jobDur.includes('3 mån') && !jobDur.includes('kort')) return false;
                        }
                    }

                    const sal = quizPrefs.salary;
                    if (sal && sal !== 'anything') {
                        const jobSal = (job.salary_type || job.salary_description || '').toLowerCase();
                        if (jobSal) {
                            if (sal === 'fast' && !jobSal.includes('fast')) return false;
                            if (sal === 'provision' && !jobSal.includes('provision') && !jobSal.includes('ackord')) return false;
                        }
                    }

                    // Dealbreakers: exclude jobs matching these keywords in description
                    const db = quizPrefs.dealbreakers;
                    if (db && db.length > 0 && !db.includes('ingen')) {
                        const desc = (job.description || '').toLowerCase();
                        const title = (job.title || '').toLowerCase();
                        const dbMap = {
                            'natt': 'natt', 'helg': 'helg', 'telefon': 'telefon',
                            'tunga_lyft': 'tunga lyft', 'utomhus': 'utomhus'
                        };
                        const hasBreaker = db.some(d => {
                            const keyword = dbMap[d] || d;
                            return desc.includes(keyword) || title.includes(keyword);
                        });
                        if (hasBreaker) return false;
                    }

                    // Negative keywords filter (from Preferenser tab)
                    const negKw = quizPrefs.negative_keywords || [];
                    if (negKw.length > 0) {
                        const titleLow = (job.title || '').toLowerCase();
                        const descLow = (job.description || '').toLowerCase();
                        const hasNegative = negKw.some(kw =>
                            titleLow.includes(kw.toLowerCase()) || descLow.includes(kw.toLowerCase())
                        );
                        if (hasNegative) return false;
                    }

                    // Geography filter: only show jobs in selected kommuner
                    const locPrefs = quizPrefs.location || [];
                    if (locPrefs.length > 0 && !locPrefs.includes('anywhere')) {
                        const kommunLabels = locPrefs
                            .filter(k => k !== 'remote' && k !== 'anywhere')
                            .map(id => {
                                for (const lan of LAN_DATA) {
                                    const found = lan.kommuner.find(k => k.id === id);
                                    if (found) return found.label.toLowerCase();
                                }
                                return id.toLowerCase();
                            });

                        if (kommunLabels.length > 0) {
                            const jobLoc = (job.location || '').toLowerCase();
                            const jobMuni = (job.municipality || '').toLowerCase();
                            const hasLocation = jobLoc || jobMuni;

                            if (hasLocation) {
                                const matchesLoc = kommunLabels.some(k =>
                                    jobLoc.includes(k) || jobMuni.includes(k)
                                );
                                // Also allow remote jobs if user selected remote
                                const isRemote = locPrefs.includes('remote') &&
                                    (jobLoc.includes('remote') || jobLoc.includes('distans') || jobLoc.includes('hemma'));
                                if (!matchesLoc && !isRemote) return false;
                            }
                            // Jobs with no location data pass through — we can't filter what we don't know
                        }
                    }

                    return true;
                })

                                                                            html += '<li style="margin-bottom:0.25rem">' + trimmed.replace(/^[•\-–—\*]\s*/, '') + '</li>';

                                                            {currentJob.description.length > 6000 && (
