<!DOCTYPE html>
<html lang="sv">
<head>
    <!-- FRONTEND_VERSION: 2026-02-20-platser -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platsbanken AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <style>
        * { font-family: system-ui, -apple-system, sans-serif; }
        .gradient { background: linear-gradient(135deg, #ec4899 0%, #f472b6 50%, #fb7185 100%); }
        .tab-active { border-bottom: 3px solid white; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ============== SHARED HELPERS ==============

        // Authenticated fetch — wraps fetch() with auth token from localStorage
        const authFetch = async (url, options = {}) => {
            const token = localStorage.getItem('auth_token');
            const headers = {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
                ...options.headers
            };
            return fetch(url, { ...options, headers });
        };

        // Common button style constants
        const BTN = {
            primary: "bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition",
            secondary: "border border-slate-200 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-50 transition",
            danger: "bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-red-700 transition",
            small: "px-3 py-1.5 rounded-lg text-xs font-medium transition",
        };

        // ============== COMPONENTS ==============

        // User menu dropdown
        const UserMenu = ({ user, onLogout }) => {
            const [isOpen, setIsOpen] = useState(false);
            const initials = user.full_name
                ? user.full_name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2)
                : user.email[0].toUpperCase();

            return (
                <div className="relative">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="flex items-center gap-2 bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg transition"
                    >
                        <div className="w-8 h-8 bg-white/30 rounded-full flex items-center justify-center text-sm font-medium">
                            {initials}
                        </div>
                        <span className="text-sm font-medium hidden sm:block">
                            {user.full_name || user.email.split('@')[0]}
                        </span>
                        <svg className={`w-4 h-4 transition ${isOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    {isOpen && (
                        <>
                            <div className="fixed inset-0 z-10" onClick={() => setIsOpen(false)} />
                            <div className="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-lg border border-slate-200 py-2 z-20">
                                <div className="px-4 py-3 border-b border-slate-100">
                                    <p className="font-medium text-slate-800">{user.full_name || 'Användare'}</p>
                                    <p className="text-sm text-slate-500 truncate">{user.email}</p>
                                </div>
                                <a
                                    href="/account"
                                    className="block px-4 py-2 text-slate-700 hover:bg-slate-50 transition"
                                >
                                    Mitt konto
                                </a>
                                <a
                                    href="/account#settings"
                                    className="block px-4 py-2 text-slate-700 hover:bg-slate-50 transition"
                                >
                                    Inställningar
                                </a>
                                <hr className="my-2 border-slate-100" />
                                <button
                                    onClick={() => { setIsOpen(false); onLogout(); }}
                                    className="w-full text-left px-4 py-2 text-slate-700 hover:bg-slate-50 transition"
                                >
                                    Logga ut
                                </button>
                            </div>
                        </>
                    )}
                </div>
            );
        };

        // Navigation tabs
        const NavTabs = ({ activeTab, setActiveTab, emailJobCount, externalJobCount }) => (
            <div className="flex gap-6">
                {[
                    { id: 'jobs', label: 'Jobb', icon: '📧', count: emailJobCount },
                    { id: 'external', label: 'Extern', icon: '🌐', count: externalJobCount },
                    { id: 'cvs', label: 'Mina CV', icon: '📄' },
                    { id: 'applications', label: 'Ansökningar', icon: '📬' },
                    { id: 'metrics', label: 'Statistik', icon: '📊' },
                    { id: 'preferences', label: 'Preferenser', icon: '⚙️' },
                    { id: 'platser', label: 'Platser', icon: '📍' },
                    { id: 'letter', label: 'Personligt brev', icon: '✍️' },
                    { id: 'quiz', label: 'Quiz', icon: '✨' },
                    { id: 'profil', label: 'Profil', icon: '👤' }
                ].map(tab => (
                    <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`pb-2 text-white/80 hover:text-white transition ${activeTab === tab.id ? 'tab-active text-white font-medium' : ''}`}
                    >
                        {tab.icon} {tab.label}{tab.count > 0 ? ` (${tab.count})` : ''}
                    </button>
                ))}
            </div>
        );

        // Stats dashboard
        const Stats = ({ stats }) => (
            <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
                {[
                    { label: "Jobb", value: stats.total_jobs, color: "text-indigo-600", bg: "bg-indigo-50" },
                    { label: "CV-vibes", value: stats.cv_vibes || 0, color: "text-purple-600", bg: "bg-purple-50" },
                    { label: "Skickade", value: stats.sent, color: "text-green-600", bg: "bg-green-50" },
                    { label: "Intervjuer", value: stats.interviews, color: "text-amber-600", bg: "bg-amber-50" },
                    { label: "Deadline idag", value: stats.deadline_today || 0, color: "text-red-600", bg: "bg-red-50" }
                ].map(({ label, value, color, bg }) => (
                    <div key={label} className={`${bg} rounded-xl p-4`}>
                        <div className={`text-3xl font-bold ${color}`}>{value || 0}</div>
                        <div className="text-slate-500 text-sm">{label}</div>
                    </div>
                ))}
            </div>
        );

        // Job card with save functionality
        const JobCard = ({ job, onApply, onSave, loading, savedJobs = [] }) => {
            const [saving, setSaving] = useState(false);
            const isSaved = savedJobs.includes(job.id);

            const priorityColors = {
                urgent: "bg-red-100 text-red-700",
                soon: "bg-amber-100 text-amber-700",
                normal: "bg-green-100 text-green-700"
            };

            const handleSave = async (e) => {
                e.stopPropagation();
                setSaving(true);
                try {
                    const method = isSaved ? 'DELETE' : 'POST';
                    await authFetch(`/api/jobs/${job.id}/save`, { method });
                    if (onSave) onSave(job.id, !isSaved);
                } catch (err) {
                    console.error('Error saving job:', err);
                }
                setSaving(false);
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
                    <div className="flex justify-between items-start mb-2">
                        <span className={`text-xs px-2 py-1 rounded-full ${priorityColors[job.priority] || priorityColors.normal}`}>
                            {job.priority === 'urgent' ? '⚡ Akut' : job.priority === 'soon' ? '⏰ Snart' : '✓'}
                        </span>
                        <div className="flex items-center gap-2">
                            <button
                                onClick={handleSave}
                                disabled={saving}
                                className={`text-lg hover:scale-110 transition ${isSaved ? 'text-blue-500' : 'text-slate-300 hover:text-blue-400'}`}
                                title={isSaved ? 'Ta bort från sparade' : 'Spara för senare'}
                            >
                                {saving ? '...' : isSaved ? '📌' : '📍'}
                            </button>
                            {job.deadline && (
                                <span className="text-xs text-slate-400">
                                    {new Date(job.deadline).toLocaleDateString('sv-SE')}
                                </span>
                            )}
                        </div>
                    </div>
                    <h3 className="text-lg font-semibold text-slate-800">{job.title}</h3>
                    <p className="text-indigo-600 font-medium text-sm">{job.company}</p>
                    <p className="text-slate-400 text-xs mb-3">{job.location}</p>

                    <div className={`rounded-lg p-2 mb-3 ${job.contact_email ? 'bg-green-50 border border-green-200' : 'bg-slate-50 border border-slate-200'}`}>
                        {job.contact_email ? (
                            <p className="text-xs text-green-700">
                                📧 <a href={`mailto:${job.contact_email}`} className="text-green-700 hover:underline">{job.contact_email}</a>
                            </p>
                        ) : (
                            <p className="text-xs text-slate-400">
                                🌐 Extern ansökan
                            </p>
                        )}
                    </div>

                    <div className="flex gap-2">
                        <button
                            onClick={() => onApply(job)}
                            disabled={loading}
                            className="flex-1 bg-indigo-600 text-white py-2 px-3 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50"
                        >
                            {loading ? '...' : '✨ Ansök'}
                        </button>
                        <a href={job.url} target="_blank" className="px-3 py-2 border border-slate-200 rounded-lg text-slate-500 text-sm hover:bg-slate-50">
                            ↗
                        </a>
                    </div>
                </div>
            );
        };

        // CV Vibe card
        const CVVibeCard = ({ vibe, userCV, onSelect, onUploadCV }) => {
            const hasCV = !!userCV;
            const hasPDF = userCV?.pdf_url;

            return (
                <div className={`rounded-xl p-5 border-2 transition ${hasCV ? 'bg-white border-green-200' : 'bg-slate-50 border-slate-200'}`}>
                    <div className="text-3xl mb-2">{vibe.emoji}</div>
                    <h3 className="font-semibold text-slate-800">{vibe.name}</h3>
                    <p className="text-xs text-slate-500 mt-1">{vibe.focus}</p>
                    {hasCV ? (
                        <span className="inline-block mt-3 text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full">✓ CV finns</span>
                    ) : (
                        <span className="inline-block mt-3 text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-full">Inte skapat</span>
                    )}

                    <div className="mt-3 flex flex-col gap-2">
                        <button
                            onClick={(e) => { e.stopPropagation(); onUploadCV(vibe); }}
                            className="w-full bg-indigo-600 text-white px-3 py-2 rounded-lg text-xs font-medium hover:bg-indigo-700"
                        >
                            📤 Ladda upp CV
                        </button>
                        {hasPDF && (
                            <a
                                href={userCV.pdf_url}
                                target="_blank"
                                onClick={(e) => e.stopPropagation()}
                                className="w-full bg-slate-100 text-slate-700 px-3 py-2 rounded-lg text-xs font-medium hover:bg-slate-200 text-center"
                            >
                                📄 Visa fil
                            </a>
                        )}
                        <button
                            onClick={() => onSelect(vibe, userCV)}
                            className="w-full bg-slate-600 text-white px-3 py-2 rounded-lg text-xs font-medium hover:bg-slate-700"
                        >
                            ✏️ Redigera
                        </button>
                    </div>
                </div>
            );
        };

        // Application modal
        const ApplyModal = ({ isOpen, job, result, onClose, onSaveApplication }) => {
            const [letter, setLetter] = useState('');
            const [feedback, setFeedback] = useState('');
            const [showFeedback, setShowFeedback] = useState(false);
            const [savingFeedback, setSavingFeedback] = useState(false);
            const [applicationSaved, setApplicationSaved] = useState(false);
            const [copied, setCopied] = useState(false);
            const [feedbackSaved, setFeedbackSaved] = useState(false);
            const [selectedHints, setSelectedHints] = useState([]);
            const [customHint, setCustomHint] = useState('');
            const [regenerating, setRegenerating] = useState(false);
            const [savingDraft, setSavingDraft] = useState(false);
            const [draftSaved, setDraftSaved] = useState(false);
            const [experienceHints, setExperienceHints] = useState([]);
            const [savingAsExample, setSavingAsExample] = useState(false);
            const [savedAsExample, setSavedAsExample] = useState(false);

            // Load user's actual experiences from Master CV when modal opens
            useEffect(() => {
                if (isOpen && localStorage.getItem('auth_token')) {
                    authFetch('/api/master-cv').then(res => res.json()).then(data => {
                        const hints = (data.experiences || []).map(exp => {
                            const dates = [exp.start_date, exp.end_date].filter(Boolean).join('-');
                            const desc = exp.description ? ': ' + exp.description.substring(0, 80) : '';
                            return {
                                id: exp.id || exp.company,
                                label: exp.company + (exp.title ? ` (${exp.title})` : ''),
                                hint: `- ${exp.company}${dates ? ` (${dates})` : ''}${exp.title ? ', ' + exp.title : ''}${desc}`
                            };
                        });
                        // Add B-körkort as a special non-experience hint
                        hints.push({ id: '_korkort', label: 'B-körkort & bil', hint: '- Har B-körkort och tillgång till bil' });
                        setExperienceHints(hints);
                    }).catch(() => {});
                }
            }, [isOpen]);

            useEffect(() => {
                if (result?.cover_letter) setLetter(result.cover_letter);
                setApplicationSaved(false);
            }, [result]);

            if (!isOpen || !job) return null;

            const saveApplication = async (status = 'draft') => {
                if (applicationSaved && status === 'draft') return;
                try {
                    await authFetch('/api/applications', {
                        method: 'POST',
                        body: JSON.stringify({
                            job_id: job.id,
                            cover_letter: letter,
                            status: status
                        })
                    });
                    setApplicationSaved(true);
                    if (onSaveApplication) onSaveApplication();
                } catch (err) {
                    console.error('Error saving application:', err);
                }
            };

            const openGmail = async () => {
                // Save as draft first
                await saveApplication('draft');
                const subject = encodeURIComponent(`Ansökan: ${job.title}`);
                const body = encodeURIComponent(letter);
                window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${job.contact_email}&su=${subject}&body=${body}`, '_blank');
            };

            const markAsSent = async () => {
                await saveApplication('sent');
                onClose();
            };

            const copyLetter = () => {
                navigator.clipboard.writeText(letter);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const saveFeedback = async () => {
                if (!feedback.trim()) return;
                setSavingFeedback(true);
                try {
                    await authFetch('/api/user/ai-feedback', {
                        method: 'POST',
                        body: JSON.stringify({
                            feedback_text: feedback,
                            feedback_type: 'cover_letter',
                            applies_to_vibes: result?.matched_vibe ? [result.matched_vibe] : null
                        })
                    });
                    setFeedback('');
                    setShowFeedback(false);
                    setFeedbackSaved(true);
                    setTimeout(() => setFeedbackSaved(false), 3000);
                } catch (err) {
                    console.error(err);
                }
                setSavingFeedback(false);
            };

            const regenerateLetter = async () => {
                setRegenerating(true);
                try {
                    let extraHintText = experienceHints
                        .filter(e => selectedHints.includes(e.id))
                        .map(e => e.hint)
                        .join('\n');
                    if (customHint.trim()) {
                        extraHintText += (extraHintText ? '\n' : '') + '- ' + customHint.trim();
                    }
                    const res = await authFetch(`/api/jobs/${job.id}/apply-with-cv`, {
                        method: 'POST',
                        body: JSON.stringify({ job, extra_hints: extraHintText })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setLetter(data.cover_letter);
                        setSelectedHints([]);
                        setDraftSaved(false);
                    }
                } catch (err) {
                    console.error('Regenerate error:', err);
                }
                setRegenerating(false);
            };

            const saveAsTrainingExample = async () => {
                setSavingAsExample(true);
                try {
                    const res = await authFetch('/api/user/save-letter-as-example', {
                        method: 'POST',
                        body: JSON.stringify({
                            letter_text: letter,
                            job_title: job?.title || 'Okänt jobb'
                        })
                    });
                    if (res.ok) {
                        setSavedAsExample(true);
                    }
                } catch(e) {
                    console.error('Save as example error:', e);
                }
                setSavingAsExample(false);
            };

            const saveGmailDraftWithAttachments = async () => {
                setSavingDraft(true);
                try {
                    const res = await authFetch(`/api/jobs/${job.id}/save-draft`, {
                        method: 'POST',
                        body: JSON.stringify({
                            job,
                            cover_letter: letter,
                            vibe: result?.matched_vibe || 'customerservice'
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setDraftSaved(true);
                    } else {
                        alert(data.detail || 'Kunde inte spara utkast. Är Gmail kopplat i Profil?');
                    }
                } catch (err) {
                    console.error('Save draft error:', err);
                    alert('Något gick fel. Försök igen.');
                }
                setSavingDraft(false);
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl max-w-5xl w-full max-h-[92vh] flex flex-col overflow-hidden">
                        <div className="gradient text-white p-5 flex-shrink-0">
                            <h3 className="text-xl font-bold">{job.title}</h3>
                            <p className="opacity-90">{job.company}</p>
                            {result?.matched_vibe && (
                                <span className="inline-block mt-2 text-xs bg-white/20 px-2 py-1 rounded-full">
                                    CV: {result.matched_vibe}
                                </span>
                            )}
                        </div>
                        <div className="p-5 overflow-y-auto flex-1">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-2">Personligt brev</label>
                                <textarea
                                    value={letter}
                                    onChange={(e) => setLetter(e.target.value)}
                                    className="w-full p-3 border border-slate-200 rounded-lg text-sm resize-y"
                                    style={{minHeight: '360px'}}
                                />
                            </div>

                            {showFeedback && (
                                <div className="mt-3">
                                    <label className="block text-sm font-medium text-slate-700 mb-2">Feedback till AI</label>
                                    <textarea
                                        value={feedback}
                                        onChange={(e) => setFeedback(e.target.value)}
                                        placeholder="Ex: Nämna alltid min kundtjänst-erfarenhet för dessa jobb..."
                                        className="w-full h-24 p-3 border border-amber-200 bg-amber-50 rounded-lg text-sm"
                                    />
                                    <button
                                        onClick={saveFeedback}
                                        disabled={savingFeedback || !feedback.trim()}
                                        className="w-full mt-2 bg-amber-500 text-white py-2 rounded-lg text-sm font-medium hover:bg-amber-600 disabled:opacity-50"
                                    >
                                        {savingFeedback ? 'Sparar...' : 'Spara feedback'}
                                    </button>
                                    <p className="text-xs text-slate-500 mt-2">
                                        AI använder din feedback för framtida brev.
                                    </p>
                                </div>
                            )}

                            {/* Gmail draft status */}
                            {(result?.draft_created || draftSaved) ? (
                                <div className="mt-3 p-3 bg-green-50 border border-green-200 rounded-lg">
                                    <div className="flex items-center gap-2 mb-2">
                                        <span className="text-green-600 text-lg">✓</span>
                                        <p className="text-sm font-medium text-green-800">Utkast sparat i Gmail med bilagor!</p>
                                    </div>
                                    <div className="flex gap-3 text-xs text-green-700">
                                        <span>📄 Personligt_Brev_Linnea_Moritz.pdf</span>
                                        <span>📄 {result?.cv_filename || 'CV.pdf'}</span>
                                    </div>
                                    {job?.contact_email && (
                                        <p className="text-xs text-green-600 mt-1">Till: {job.contact_email}</p>
                                    )}
                                </div>
                            ) : !job?.contact_email ? (
                                <div className="mt-3 p-3 bg-slate-50 border border-slate-200 rounded-lg">
                                    <p className="text-xs text-slate-600">Ingen e-postadress hittades. Kolla annonsen direkt eller kopiera brevet.</p>
                                </div>
                            ) : null}

                            {/* Attachments info */}
                            <div className="mt-3 flex gap-2 flex-wrap">
                                <span className="inline-flex items-center gap-1 text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded">
                                    📄 Personligt brev (PDF)
                                </span>
                                <span className="inline-flex items-center gap-1 text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded">
                                    📄 {result?.cv_filename || 'CV (PDF)'}
                                </span>
                            </div>

                            {/* Experience picker */}
                            <div className="mt-4 p-3 bg-slate-50 rounded-lg border border-slate-200">
                                <p className="text-xs font-medium text-slate-600 mb-2">Välj erfarenheter från ditt Master CV att lyfta i brevet:</p>
                                {experienceHints.length === 0 && (
                                    <p className="text-xs text-slate-400 mb-2">Inga erfarenheter hittades. Lägg till i Mina CV → Master CV.</p>
                                )}
                                <div className="flex flex-wrap gap-1.5">
                                    {experienceHints.map(exp => (
                                        <button
                                            key={exp.id}
                                            onClick={() => setSelectedHints(prev =>
                                                prev.includes(exp.id) ? prev.filter(h => h !== exp.id) : [...prev, exp.id]
                                            )}
                                            className={`text-xs px-2.5 py-1 rounded-full border transition-colors ${
                                                selectedHints.includes(exp.id)
                                                    ? 'bg-indigo-100 border-indigo-400 text-indigo-700 font-medium'
                                                    : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-100'
                                            }`}
                                        >
                                            {selectedHints.includes(exp.id) ? '✓ ' : ''}{exp.label}
                                        </button>
                                    ))}
                                </div>
                                <input
                                    type="text"
                                    value={customHint}
                                    onChange={(e) => setCustomHint(e.target.value)}
                                    placeholder="Skriv egen erfarenhet här, t.ex. 'Jobbade på Volvo som svetsare 2020-2022'"
                                    className="mt-2 w-full p-2 text-xs border border-slate-300 rounded-lg focus:border-indigo-400 focus:outline-none"
                                />
                                {(selectedHints.length > 0 || customHint.trim()) && !regenerating && (
                                    <button
                                        onClick={regenerateLetter}
                                        className="mt-3 w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700"
                                    >
                                        ✨ Generera om med {selectedHints.length > 0 ? `valda erfarenheter (${selectedHints.length} valda)` : 'egen erfarenhet'}
                                    </button>
                                )}
                                {regenerating && (
                                    <div className="mt-3 text-center text-sm text-slate-500 py-2">
                                        ✨ Genererar nytt brev...
                                    </div>
                                )}
                            </div>

                            {feedbackSaved && (
                                <div className="mt-2 text-sm text-green-600">✓ Feedback sparad! AI använder den nästa gång.</div>
                            )}

                            <div className="flex gap-3 mt-4 flex-wrap">
                                {job?.contact_email && (
                                    <button
                                        onClick={saveGmailDraftWithAttachments}
                                        disabled={savingDraft}

        // CV Detail Modal

        // ============== PAGES ==============

                        // Ensure working_hours is an array for multi-select

                            parsed.working_hours = [parsed.working_hours];
                        }
                        return {
                            full_name: parsed.full_name || '',
                            phone: parsed.phone || '',
                            age: parsed.age || '',
                            drivers_license: parsed.drivers_license || '',
                            linkedin: parsed.linkedin || '',
                            earliest_start: parsed.earliest_start || '',
                            education_level: parsed.education_level || '',
                            search_terms: parsed.search_terms || [],
                            custom_search: parsed.custom_search || '',
                            location: parsed.location || [],
                            working_hours: parsed.working_hours || [],
                            employment_form: parsed.employment_form || [],
                            duration: parsed.duration || '',
                            salary: parsed.salary || '',

                return {

                    phone: '',
                    age: '',
                    drivers_license: '',
                    linkedin: '',
                    earliest_start: '',
                    education_level: '',
                    search_terms: [],
                    custom_search: '',

                        phone: '',
                        age: '',
                        drivers_license: '',
                        linkedin: '',
                        earliest_start: '',
                        education_level: '',
                        search_terms: [],
                        custom_search: '',
                        location: [],
                        working_hours: [],
                        employment_form: [],
                        duration: '',

            };

            const questions = [

                        { value: '36-50', label: '36-50 år' },

                },
                {

                {

                {

                    options: [
                        { value: 'fast', label: 'Fast lön' },
                        { value: 'provision', label: 'Provision/Ackord' },
                        { value: 'anything', label: 'Spelar ingen roll' }
                    ]
                },
                {
                    id: 'dealbreakers',
                    question: 'Finns det något du INTE vill?',
                    subtitle: 'Vi filtrerar bort jobb som matchar detta',
                    type: 'multi',
                    allowEmpty: true,
                    options: [
                        { value: 'natt', label: 'Nattarbete' },
                        { value: 'helg', label: 'Helgarbete' },
                        { value: 'telefon', label: 'Telefonförsäljning' },
                        { value: 'tunga_lyft', label: 'Tunga lyft' },
                        { value: 'utomhus', label: 'Utomhusarbete' },
                        { value: 'ingen', label: 'Inget speciellt - jag är öppen' }
                    ]
                }
            ];

            const currentQ = questions[step];
            const isLastStep = step === questions.length - 1;
            const progress = ((step + 1) / questions.length) * 100;

            const handleSelect = (value) => {
                if (currentQ.type === 'single') {
                    setAnswers({ ...answers, [currentQ.id]: value });
                } else {
                    const current = answers[currentQ.id] || [];
                    if (current.includes(value)) {
                        setAnswers({ ...answers, [currentQ.id]: current.filter(v => v !== value) });
                    } else {
                        setAnswers({ ...answers, [currentQ.id]: [...current, value] });
                    }
                }
            };

            const isSelected = (value) => {
                if (currentQ.type === 'single') return answers[currentQ.id] === value;
                return (answers[currentQ.id] || []).includes(value);
            };

            const canProceed = currentQ.allowEmpty ? true :
                currentQ.type === 'text'
                    ? (answers[currentQ.id] || '').trim().length > 0
                    : currentQ.type === 'freetext_multi'
                        ? ((answers[currentQ.id] || []).length > 0 || customSearch.trim().length > 0)
                        : currentQ.type === 'single'
                            ? !!answers[currentQ.id]
                            : (answers[currentQ.id] || []).length > 0;

            return (
                <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-6">
                    <div className="w-full max-w-lg">

                        <div className="flex justify-between items-center mb-8">
                            <span className="text-white/40 font-mono text-xs tracking-wide">anti-apathy</span>
                            <div className="flex gap-4">
                                <button
                                    onClick={resetQuiz}
                                    className="text-white/30 hover:text-white/60 text-sm transition"
                                >
                                    Gör om quizzet
                                </button>
                                <button
                                    onClick={() => onComplete(answers)}
                                    className="text-white/30 hover:text-white/60 text-sm transition"
                                >
                                    Hoppa över
                                </button>

                        {/* Progress dots */}
                        <div className="flex gap-2 mb-10">
                            {questions.map((_, i) => (
                                <div
                                    key={i}

                                <button

        // Profil page - Profile photo + Training letter
        const GmailSettingsSection = () => {
            const [gmailStatus, setGmailStatus] = useState(null); // null | {connected, gmail_address}
            const [disconnecting, setDisconnecting] = useState(false);
            const [connecting, setConnecting] = useState(false);
            const [msg, setMsg] = useState(null);

            useEffect(() => {
                authFetch('/api/gmail/status?user_id=default_user')
                    .then(r => r.json())
                    .then(d => setGmailStatus(d))
                    .catch(() => setGmailStatus({ connected: false }));
            }, []);

            const connectGmail = async () => {
                setConnecting(true);
                setMsg(null);
                try {
                    const resp = await authFetch('/api/gmail/auth-url?user_id=default_user');
                    const data = await resp.json();
                    if (!data.auth_url) {
                        setMsg({ type: 'error', text: data.app_configured === false ? 'Gmail-integration är inte aktiverad av administratören.' : 'Kunde inte starta inloggning.' });
                        setConnecting(false);
                        return;
                    }
                    const popup = window.open(data.auth_url, 'gmail_auth', 'width=500,height=600');
                    const timer = setInterval(async () => {
                        if (popup.closed) {
                            clearInterval(timer);
                            const r2 = await authFetch('/api/gmail/status?user_id=default_user');
                            const d2 = await r2.json();
                            setGmailStatus(d2);
                            setConnecting(false);
                            if (d2.connected) setMsg({ type: 'success', text: 'Gmail kopplat!' });
                        }
                    }, 1000);
                } catch (e) {
                    setMsg({ type: 'error', text: 'Något gick fel. Försök igen.' });
                    setConnecting(false);
                }
            };

            const disconnectGmail = async () => {
                if (!window.confirm('Är du säker? Appen kommer inte längre kunna spara utkast i din Gmail.')) return;
                setDisconnecting(true);
                setMsg(null);
                try {
                    const resp = await authFetch('/api/gmail/disconnect?user_id=default_user', {
                        method: 'POST'
                    });
                    const data = await resp.json();
                    if (data.success) {
                        setGmailStatus({ connected: false });
                        setMsg({ type: 'success', text: 'Gmail frånkopplat. Appen har inte längre åtkomst till din Gmail.' });
                    } else {
                        setMsg({ type: 'error', text: 'Kunde inte koppla bort. Försök igen.' });
                    }
                } catch (e) {
                    setMsg({ type: 'error', text: 'Något gick fel.' });
                }
                setDisconnecting(false);
            };

            return (
                <div className="bg-white rounded-xl p-6 border border-slate-200">
                    <h3 className="text-lg font-semibold mb-1">📬 Gmail-koppling</h3>
                    <p className="text-sm text-slate-500 mb-4">
                        Appen kan spara personliga brev som utkast i din Gmail. Du bestämmer alltid själv om du vill skicka.
                    </p>

                    {gmailStatus === null ? (
                        <p className="text-sm text-slate-400">Kontrollerar status...</p>
                    ) : gmailStatus.connected ? (
                        <div>
                            <div className="flex items-center gap-3 p-4 bg-green-50 border border-green-200 rounded-lg mb-4">
                                <span className="text-xl">✅</span>
                                <div>
                                    <p className="font-medium text-green-800">Gmail kopplat</p>
                                    <p className="text-sm text-green-700">{gmailStatus.gmail_address}</p>
                                </div>
                            </div>
                            <button
                                onClick={disconnectGmail}
                                disabled={disconnecting}
                                className="text-sm text-red-600 hover:text-red-800 underline disabled:opacity-50"
                            >
                                {disconnecting ? 'Kopplar bort...' : 'Koppla bort Gmail (återkalla åtkomst)'}
                            </button>
                            <p className="text-xs text-slate-400 mt-1">
                                Du kan också återkalla åtkomst via <a href="https://myaccount.google.com/permissions" target="_blank" className="underline">Googles kontoinställningar</a>.
                            </p>
                        </div>
                    ) : (
                        <div>
                            <div className="bg-blue-50 border border-blue-100 rounded-lg p-3 mb-4 text-sm text-blue-900">
                                <p className="font-medium mb-1">Vad händer när du kopplar Gmail?</p>
                                <ul className="space-y-0.5 text-blue-800">
                                    <li>✓ Utkast sparas i din Gmail — inget skickas automatiskt</li>
                                    <li>✓ Du granskar och skickar alltid själv</li>
                                    <li>✓ Google frågar om tillstånd innan något händer</li>
                                    <li>✓ Du kan koppla bort här när som helst</li>
                                </ul>
                            </div>
                            <button

        // Main Mina CV Page Component
        const MinaCVPage = () => {
            const [stats, setStats] = useState({});
            const [experiences, setExperiences] = useState([]);
            const [education, setEducation] = useState([]);
            const [projects, setProjects] = useState([]);
            const [certifications, setCertifications] = useState([]);
            const [awards, setAwards] = useState([]);
            const [volunteer, setVolunteer] = useState([]);
            const [skills, setSkills] = useState([]);
            const [branschCVs, setBranschCVs] = useState([]);
            const [viewingCV, setViewingCV] = useState(null);

            useEffect(() => {
                fetchMasterCVData();
                fetchBranschCVs();
            }, []);

            const fetchMasterCVData = async () => {
                if (!localStorage.getItem('auth_token')) return;

                try {
                    const res = await authFetch('/api/master-cv');
                    const data = await res.json();

                    setStats({
                        experiences: data.experiences?.length || 0,
                        education: data.education?.length || 0,
                        awards: data.awards?.length || 0,
                        projects: data.projects?.length || 0,
                        languages: data.skills?.filter(s => s.skill_type === 'language').length || 0
                    });

                    setExperiences(data.experiences || []);
                    setEducation(data.education || []);
                    setProjects(data.projects || []);
                    setCertifications(data.certifications || []);
                    setAwards(data.awards || []);
                    setVolunteer(data.volunteer || []);
                    setSkills(data.skills || []);
                } catch (err) {
                    console.error('Error fetching master CV:', err);
                }
            };

            const fetchBranschCVs = async () => {
                if (!localStorage.getItem('auth_token')) return;

                try {
                    const res = await authFetch('/api/bransch-cvs');
                    const data = await res.json();
                    setBranschCVs(data.bransch_cvs || []);
                } catch (err) {
                    console.error('Error fetching bransch-CVs:', err);
                }
            };

            const handleDownloadMasterCV = async () => {
                if (!localStorage.getItem('auth_token')) return;

                try {
                    const res = await authFetch('/api/master-cv/download-pdf');
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Master_CV_Linnea_Moritz.pdf';
                    a.click();
                    window.URL.revokeObjectURL(url);
                } catch (err) {
                    console.error('Error downloading Master CV:', err);
                    alert('Kunde inte ladda ner Master CV');
                }
            };

            const handleDownloadBranschCV = async (cv) => {
                if (!localStorage.getItem('auth_token')) return;

                try {
                    const res = await authFetch(`/api/bransch-cvs/${cv.id}/download-pdf`);
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `CV_${cv.category.replace(/\s+/g, '_')}.pdf`;
                    a.click();
                    window.URL.revokeObjectURL(url);
                } catch (err) {
                    console.error('Error downloading Bransch-CV:', err);
                    alert('Kunde inte ladda ner Bransch-CV');
                }
            };

            return (
                <div className="max-w-6xl mx-auto space-y-6">
                    {/* Section 1: Master CV Summary */}
                    <MasterCVSummary
                        stats={stats}
                        onUploadCV={null}
                    />

                    {/* Download Master CV Button */}
                    <div className="flex justify-end">
                        <button
                            onClick={handleDownloadMasterCV}

                                <GenericCard
                                    item={item}

                                    title={item.certification_name}
                                    subtitle={item.issuing_organization || item.issuer}
                                />
                            )}
                        />

                        <CVBlockAccordion
                            title="Priser"
                            count={awards.length}
                            icon="🏆"
                            items={awards}
                            ItemCard={({ item }) => (
                                <GenericCard

                        />

                        <CVBlockAccordion

                            count={volunteer.length}

                                <GenericCard

                        <CVBlockAccordion

                    setPrefs(fresh);
                    if (fresh.negative_keywords) setNegKeywords(fresh.negative_keywords);
                    if (fresh.working_hours) setSelectedHours(Array.isArray(fresh.working_hours) ? fresh.working_hours : [fresh.working_hours]);
                    if (fresh.dealbreakers) setSelectedDealbreakers(fresh.dealbreakers);
                    if (fresh.custom_search) setPosKeywords(fresh.custom_search.split(',').map(k => k.trim()).filter(Boolean));

                setNegKeywords(prev =>

                );
            };

            const addCustomNegKw = () => {
                if (!customNegKw.trim()) return;
                const kw = customNegKw.trim().toLowerCase();
                if (!negKeywords.includes(kw)) {

                if (!newPosKw.trim()) return;
