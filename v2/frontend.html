        // Master CV Editor Modal
        const MasterCVEditor = ({ isOpen, onClose, masterCV, onSave, saving }) => {
            const [editedCV, setEditedCV] = useState(null);
            const [activeSection, setActiveSection] = useState('experiences');

            useEffect(() => {
                if (isOpen) {
                    // Initialize with masterCV data or empty defaults
                    const defaultCV = {
                        profile: { full_name: '', email: '', phone: '', location: '' },
                        experiences: [],
                        education: [],
                        skills: [],
                        volunteer: [],
                        awards: []
                    };
                    if (masterCV) {
                        setEditedCV({
                            ...defaultCV,
                            ...JSON.parse(JSON.stringify(masterCV)),
                            experiences: masterCV.experiences || [],
                            education: masterCV.education || [],
                            skills: masterCV.skills || []
                        });
                    } else {
                        setEditedCV(defaultCV);
                    }
                }
            }, [masterCV, isOpen]);

            if (!isOpen) return null;
            if (!editedCV) return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
                    <div className="bg-white rounded-xl p-8">
                        <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mx-auto"></div>
                        <p className="mt-4 text-slate-600">Laddar Master CV...</p>
                    </div>
                </div>
            );

            const updateExperience = (index, field, value) => {
                const newExp = [...editedCV.experiences];
                newExp[index] = { ...newExp[index], [field]: value };
                setEditedCV({ ...editedCV, experiences: newExp });
            };

            const addExperience = () => {
                setEditedCV({
                    ...editedCV,
                    experiences: [...editedCV.experiences, {
                        company: '', title: '', location: '', start_date: '', end_date: '', description: '', categories: []
                    }]
                });
            };

            const deleteExperience = (index) => {
                setEditedCV({
                    ...editedCV,
                    experiences: editedCV.experiences.filter((_, i) => i !== index)
                });
            };

            const updateEducation = (index, field, value) => {
                const newEdu = [...editedCV.education];
                newEdu[index] = { ...newEdu[index], [field]: value };
                setEditedCV({ ...editedCV, education: newEdu });
            };

            const addEducation = () => {
                setEditedCV({
                    ...editedCV,
                    education: [...editedCV.education, {
                        school: '', degree: '', field_of_study: '', location: '', start_date: '', end_date: ''
                    }]
                });
            };

            const [importStatus, setImportStatus] = useState(null);

            // Parse LinkedIn CSV data
            const parseLinkedInCSV = (csvText, type) => {
                const lines = csvText.split('\n');
                if (lines.length < 2) return [];

                // Parse header
                const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g, ''));
                const results = [];

                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;

                    // Handle CSV with quoted fields
                    const values = [];
                    let current = '';
                    let inQuotes = false;
                    for (const char of lines[i]) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            values.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    values.push(current.trim());

                    const row = {};
                    headers.forEach((h, idx) => {
                        row[h] = values[idx] || '';
                    });
                    results.push(row);
                }
                return results;
            };

            // Handle LinkedIn file upload
            const handleLinkedInUpload = async (e, type) => {
                const file = e.target.files[0];
                if (!file) return;

                setImportStatus('importing');

                try {
                    const text = await file.text();

                    if (type === 'positions') {
                        const positions = parseLinkedInCSV(text, 'positions');
                        const newExperiences = positions.map(p => ({
                            company: p['company name'] || p['company'] || '',
                            title: p['title'] || '',
                            location: p['location'] || '',
                            start_date: p['started on'] || '',
                            end_date: p['finished on'] || '',
                            description: p['description'] || '',
                            categories: []
                        })).filter(exp => exp.company || exp.title);

                        setEditedCV(prev => ({
                            ...prev,
                            experiences: [...prev.experiences, ...newExperiences]
                        }));
                        setImportStatus(`Importerade ${newExperiences.length} erfarenheter!`);
                    } else if (type === 'education') {
                        const education = parseLinkedInCSV(text, 'education');
                        const newEducation = education.map(e => ({
                            school: e['school name'] || e['school'] || '',
                            degree: e['degree name'] || e['degree'] || '',
                            field_of_study: e['field of study'] || e['notes'] || '',
                            location: '',
                            start_date: e['start date'] || '',
                            end_date: e['end date'] || ''
                        })).filter(edu => edu.school);

                        setEditedCV(prev => ({
                            ...prev,
                            education: [...prev.education, ...newEducation]
                        }));
                        setImportStatus(`Importerade ${newEducation.length} utbildningar!`);
                    } else if (type === 'skills') {
                        const skills = parseLinkedInCSV(text, 'skills');
                        const newSkills = skills.map(s => ({
                            category: 'all',
                            skill_type: 'technical',
                            skill_text: s['name'] || s['skill'] || ''
                        })).filter(s => s.skill_text);

                        setEditedCV(prev => ({
                            ...prev,
                            skills: [...prev.skills, ...newSkills]
                        }));
                        setImportStatus(`Importerade ${newSkills.length} kompetenser!`);
                    } else if (type === 'profile') {
                        const profiles = parseLinkedInCSV(text, 'profile');
                        if (profiles.length > 0) {
                            const p = profiles[0];
                            setEditedCV(prev => ({
                                ...prev,
                                profile: {
                                    ...prev.profile,
                                    full_name: `${p['first name'] || ''} ${p['last name'] || ''}`.trim() || prev.profile.full_name,
                                    email: p['email address'] || p['email'] || prev.profile.email,
                                    location: p['geo location'] || p['location'] || prev.profile.location
                                }
                            }));
                            setImportStatus('Profildata importerad!');
                        }
                    }

                    setTimeout(() => setImportStatus(null), 3000);
                } catch (err) {
                    console.error('Import error:', err);
                    setImportStatus('Fel vid import. Kontrollera filformatet.');
                    setTimeout(() => setImportStatus(null), 3000);
                }

                e.target.value = '';
            };

            const sections = [
                { id: 'experiences', label: 'Erfarenheter', icon: '💼', count: editedCV.experiences?.length || 0 },
                { id: 'education', label: 'Utbildning', icon: '🎓', count: editedCV.education?.length || 0 },
                { id: 'skills', label: 'Kompetenser', icon: '⭐', count: editedCV.skills?.length || 0 },
                { id: 'profile', label: 'Profil', icon: '👤', count: null },
                { id: 'import', label: 'LinkedIn Import', icon: '📥', count: null }
            ];

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex">
                    {/* Sidebar */}
                    <div className="w-64 bg-slate-800 text-white p-4 flex flex-col">
                        <h2 className="text-lg font-bold mb-6">📋 Master CV</h2>
                        <nav className="space-y-1 flex-1">
                            {sections.map(s => (
                                <button
                                    key={s.id}
                                    onClick={() => setActiveSection(s.id)}
                                    className={`w-full text-left px-3 py-2 rounded-lg flex items-center justify-between ${
                                        activeSection === s.id ? 'bg-white/20' : 'hover:bg-white/10'
                                    }`}
                                >
                                    <span>{s.icon} {s.label}</span>
                                    {s.count !== null && <span className="bg-white/20 px-2 py-0.5 rounded text-xs">{s.count}</span>}
                                </button>

                { value: 'interview', label: '🎉 Intervju', color: 'bg-purple-100 text-purple-700' },
                { value: 'offer', label: '🎊 Erbjudande', color: 'bg-amber-100 text-amber-700' },
                { value: 'rejected', label: '✗ Avslag', color: 'bg-red-100 text-red-700' },

                    });

                                                    <p className="text-sm text-indigo-600">{app.company || ''}</p>

                                                        {new Date(app.created_at).toLocaleDateString('sv-SE')}

        // ============== GMAIL CONNECT STEP ==============

        const GmailConnectStep = ({ onNext, onBack }) => {
            const [status, setStatus] = React.useState(null); // null | 'loading' | 'connected' | 'error'
            const [gmailAddress, setGmailAddress] = React.useState('');

            React.useEffect(() => {
                const check = async () => {
                    try {
                        const resp = await authFetch('/api/gmail/status?user_id=default_user');
                        const data = await resp.json();
                        if (data.connected) {
                            setStatus('connected');
                            setGmailAddress(data.gmail_address || '');
                        } else {
                            setStatus('idle');
                        }
                    } catch (e) {
                        setStatus('idle');
                    }
                };
                check();
            }, []);

            const connectGmail = async () => {
                setStatus('loading');
                try {
                    const resp = await authFetch('/api/gmail/auth-url?user_id=default_user');
                    const data = await resp.json();
                    if (data.auth_url) {
                        const popup = window.open(data.auth_url, 'gmail_auth', 'width=500,height=600');
                        // Poll until popup closes
                        const timer = setInterval(async () => {
                            if (popup.closed) {
                                clearInterval(timer);
                                // Re-check status
                                const r2 = await authFetch('/api/gmail/status?user_id=default_user');
                                const d2 = await r2.json();
                                if (d2.connected) {
                                    setStatus('connected');
                                    setGmailAddress(d2.gmail_address || '');
                                } else {
                                    setStatus('idle');
                                }
                            }
                        }, 1000);
                    } else if (!data.app_configured) {
                        setStatus('not_configured');
                    } else {
                        setStatus('error');
                    }
                } catch (e) {
                    setStatus('error');
                }

                    {status === 'connected' ? (

                            <span className="text-2xl">✅</span>

                                <p className="text-sm text-green-700">{gmailAddress}</p>

                            </p>
                        </div>

                            <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-900 space-y-2">
                                <p className="font-semibold">Vad händer när du kopplar Gmail?</p>
                                <ul className="space-y-1 text-blue-800">
                                    <li>✓ Appen sparar personliga brev som <strong>utkast</strong> i din Gmail — inget skickas automatiskt</li>
                                    <li>✓ Du granskar och skickar alltid själv</li>
                                    <li>✓ Google frågar om ditt tillstånd — du ser exakt vad appen får göra</li>
                                    <li>✓ Du kan koppla bort när som helst via dina Google-kontoinställningar</li>
                                </ul>
                            </div>
                            <div className="bg-white border border-slate-200 rounded-xl p-5">
                                <button
                                    onClick={connectGmail}
                                    disabled={status === 'loading'}
                                    className="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-300 text-slate-700 py-3 px-4 rounded-lg font-semibold hover:border-indigo-400 hover:bg-indigo-50 transition disabled:opacity-50"
                                >
                                    <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                    {status === 'loading' ? 'Öppnar inloggning...' : 'Koppla Gmail via Google'}
                                </button>
                                <p className="text-xs text-slate-400 mt-3 text-center">
                                    Google visar vilka rättigheter appen begär innan du godkänner.
                                </p>
                                {status === 'error' && (
                                    <p className="text-sm text-red-600 mt-2 text-center">Något gick fel. Försök igen.</p>
                                )}
                            </div>
                        </div>
                    )}

                    <div className="flex gap-3 mt-4">
                        <button onClick={onBack} className="flex-1 border border-slate-200 py-3 rounded-lg font-semibold hover:bg-slate-50">
                            Tillbaka
                        </button>
                        <button onClick={onNext} className="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700">
                            {status === 'connected' ? 'Fortsätt' : 'Hoppa över'}
                        </button>
                    </div>
                </div>
            );
        };

        // ============== ONBOARDING ==============

        const OnboardingWizard = ({ onComplete }) => {
            const [saving, setSaving] = useState(false);

            const handleQuizComplete = async (answers) => {
                setSaving(true);
                try {
                    // 1. Save personal info to user_profiles
                    const profileData = {
                        full_name: answers.full_name,
                        phone: answers.phone,
                        age: answers.age,
                        drivers_license: answers.drivers_license,
                        linkedin: answers.linkedin,
                        earliest_start: answers.earliest_start,
                        education_level: answers.education_level
                    };
                    await authFetch('/api/user/profile-from-quiz', {
                        method: 'POST',
                        body: JSON.stringify(profileData)
                    });

                    // 2. Save job preferences
                    const prefData = {
                        search_terms: answers.search_terms,
                        custom_search: answers.custom_search,
                        location: answers.location,
                        working_hours: answers.working_hours,
                        employment_form: answers.employment_form,
                        duration: answers.duration,
                        salary: answers.salary,
                        dealbreakers: answers.dealbreakers
                    };
                    await authFetch('/api/user/preferences', {
                        method: 'POST',
                        body: JSON.stringify(prefData)
                    });

                    localStorage.setItem('onboarding_complete', 'true');
                    localStorage.setItem('job_preferences', JSON.stringify(prefData));
                    localStorage.setItem('user_profile', JSON.stringify(profileData));
                    onComplete();
                } catch (err) {
                    // Save locally even if server fails
                    localStorage.setItem('onboarding_complete', 'true');
                    localStorage.setItem('job_preferences', JSON.stringify(answers));
                    localStorage.setItem('user_profile', JSON.stringify(answers));
                    onComplete();
                }
                setSaving(false);
            };

            return <QuizPage onComplete={handleQuizComplete} saving={saving} />;
        };

        // NOTE: Old onboarding wizard (_ONBOARDING_OLD_UNUSED) removed — 340 lines of dead code.
        // See git history if needed.

        // ============== MAIN APP ==============

        const App = () => {
            const [activeTab, setActiveTab] = useState('jobs');
            const [jobs, setJobs] = useState([]);
            const [vibes, setVibes] = useState([]);
            const [userCVs, setUserCVs] = useState([]);
            const [applications, setApplications] = useState([]);
            const [stats, setStats] = useState({});
            const [showOnboarding, setShowOnboarding] = useState(false);
            const [landingTab, setLandingTab] = useState('hem');

            const [scraping, setScraping] = useState(false);
            const [generating, setGenerating] = useState(false);
            const [applyingJob, setApplyingJob] = useState(null);

            const [showApplyModal, setShowApplyModal] = useState(false);
            const [showCVModal, setShowCVModal] = useState(false);
            const [showMasterCVModal, setShowMasterCVModal] = useState(false);
            const [selectedJob, setSelectedJob] = useState(null);
            const [applyResult, setApplyResult] = useState(null);
            const [selectedVibe, setSelectedVibe] = useState(null);
            const [selectedCVText, setSelectedCVText] = useState('');
            const [masterCV, setMasterCV] = useState(null);
            const [savingMasterCV, setSavingMasterCV] = useState(false);
            // LAN_DATA is hardcoded — always ready, no loading state needed

            // Fetch initial data
            useEffect(() => {
                fetchJobs();
                fetchVibes();
                fetchUserCVs();
                fetchApplications();
                fetchStats();
                checkOnboarding();
                // Load preferences from Supabase (source of truth — overrides localStorage)
                authFetch('/api/user/preferences')
                    .then(r => r.json())
                    .then(data => {
                        if (data.success && data.preferences && data.preferences.quiz_answers) {
                            const serverPrefs = data.preferences.quiz_answers;
                            const localPrefs = JSON.parse(localStorage.getItem('job_preferences') || '{}');
                            // Server wins — merge server on top of local
                            const merged = { ...localPrefs, ...serverPrefs };
                            localStorage.setItem('job_preferences', JSON.stringify(merged));
                            console.log('[Prefs] Synced from Supabase:', Object.keys(serverPrefs));
                            // Notify components to re-read preferences
                            window.dispatchEvent(new Event('prefsUpdated'));
                        }
                    })
                    .catch(err => console.warn('Could not load prefs from server:', err));
            }, []);

            const checkOnboarding = async () => {
                // Check if quiz was completed locally
                const onboardingComplete = localStorage.getItem('onboarding_complete');
                if (onboardingComplete) return;

                // No quiz done yet - show it
                setShowOnboarding(true);
            };

            const fetchJobs = async () => {
                const res = await authFetch('/api/jobs');
                const data = await res.json();
                if (data.success) setJobs(data.jobs || []);
            };

            const fetchVibes = async () => {
                console.log('[DEBUG] Fetching CV vibes...');
                const res = await fetch('/api/cv/vibes');
                const data = await res.json();
                console.log('[DEBUG] CV vibes response:', data);
                if (data.success) {
                    setVibes(data.vibes || []);
                    console.log('[DEBUG] Vibes set:', data.vibes?.length || 0, 'vibes');
                }
            };

            const fetchUserCVs = async () => {
                console.log('[DEBUG] Fetching user CVs... Auth token exists:', !!localStorage.getItem('auth_token'));
                const res = await authFetch('/api/cv/all');
                const data = await res.json();
                console.log('[DEBUG] User CVs response:', data);
                if (data.success) {
                    setUserCVs(data.cvs || []);
                    console.log('[DEBUG] User CVs set:', data.cvs?.length || 0, 'CVs');
                }
            };

            const fetchApplications = async () => {
                const res = await fetch('/api/applications');
                const data = await res.json();
                if (data.success) {
                    setApplications(data.applications || []);
                    // Extract saved job IDs
                    const saved = (data.applications || [])
                        .filter(a => a.status === 'saved')
                        .map(a => a.job_id);
                    setSavedJobs(saved);
                }
            };

            const [savedJobs, setSavedJobs] = useState([]);

            const handleSaveJob = (jobId, isSaved) => {
                if (isSaved) {
                    setSavedJobs(prev => [...prev, jobId]);
                } else {
                    setSavedJobs(prev => prev.filter(id => id !== jobId));
                }
                // Refresh applications list
                fetchApplications();
            };

            const fetchStats = async () => {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if (data.success) {
                    setStats({...data.stats, cv_vibes: userCVs.length});
                }
            };

            const fetchMasterCV = async () => {
                try {
                    if (!localStorage.getItem('auth_token')) {
                        console.error('No auth token');
                        return false;
                    }
                    const res = await authFetch('/api/cv/master');
                    if (!res.ok) {
                        console.error('Fetch master CV failed:', res.status);
                        return false;
                    }
                    const data = await res.json();
                    if (data.success && data.master_cv) {
                        setMasterCV(data.master_cv);
                    }
                    return true;
                } catch (err) {
                    console.error('Error fetching master CV:', err);
                    return false;
                }
            };

            const handleOpenMasterCV = async () => {
                await fetchMasterCV();
                setShowMasterCVModal(true);
            };

            const handleSaveMasterCV = async (editedCV) => {
                setSavingMasterCV(true);

                try {
                    // Save experiences
                    for (const exp of editedCV.experiences) {
                        if (exp.id) {
                            // Update existing
                            await authFetch(`/api/user/experience/${exp.id}`, {
                                method: 'PUT',
                                body: JSON.stringify(exp)
                            });
                        } else {
                            // Create new
                            await authFetch('/api/user/experience', {
                                method: 'POST',
                                body: JSON.stringify(exp)
                            });
                        }
                    }

                    // Save education
                    for (const edu of editedCV.education) {
                        if (edu.id) {
                            await authFetch(`/api/user/education/${edu.id}`, {
                                method: 'PUT',
                                body: JSON.stringify(edu)
                            });
                        } else {
                            await authFetch('/api/user/education', {
                                method: 'POST',
                                body: JSON.stringify(edu)
                            });
                        }
                    }

                    // Save skills
                    for (const skill of (editedCV.skills || [])) {
                        if (skill.id) {
                            await authFetch(`/api/user/skill/${skill.id}`, {
                                method: 'PUT',
                                body: JSON.stringify(skill)
                            });
                        } else if (skill.skill_text) {
                            await authFetch('/api/user/skill', {
                                method: 'POST',
                                body: JSON.stringify(skill)
                            });
                        }
                    }

                    // Refresh master CV
                    await fetchMasterCV();
                    alert('Master CV sparad!');
                } catch (err) {
                    console.error('Error saving master CV:', err);
                    alert('Kunde inte spara. Försök igen.');
                } finally {
                    setSavingMasterCV(false);
                }
            };

            // Helper: convert kommun ID to display label using LAN_DATA
            const kommunIdToLabel = (id) => {
                for (const lan of LAN_DATA) {
                    const found = lan.kommuner.find(k => k.id === id);
                    if (found) return found.label;
                }
                return null;
            };

            const handleScrape = async (keywords) => {
                setScraping(true);

                const prefs = JSON.parse(localStorage.getItem('job_preferences') || '{}');

                // Use quiz preferences as defaults if no manual keywords
                let kw = keywords.trim() ? keywords.split(',').map(k => k.trim()) : null;

                if (!kw) {
                    const roleMap = {
                        'servitor': 'servitör', 'kundtjanst': 'kundtjänst', 'butik': 'butik',
                        'lager': 'lager', 'kontor': 'kontor', 'tech': 'IT', 'vard': 'vård',
                        'hotell': 'hotell', 'barn': 'barnvakt', 'skola': 'lärare',
                        'tradgard': 'trädgård', 'stad': 'städ'
                    };
                    if (prefs.custom_search && prefs.custom_search.trim()) {
                        kw = prefs.custom_search.split(',').map(k => k.trim()).filter(Boolean);
                    } else if (prefs.search_terms && prefs.search_terms.length > 0) {
                        kw = prefs.search_terms.map(r => roleMap[r] || r);
                    }
                }

                // Build municipality concept IDs from preferences for server-side geography filtering
                let municipalityIds = null;
                const selKommuner = prefs.location || [];
                if (selKommuner.length > 0 && !selKommuner.includes('anywhere')) {
                    const ids = selKommuner.filter(k => k !== 'remote' && k !== 'anywhere');
                    if (ids.length > 0) {
                        municipalityIds = ids;
                    }
                }

                const res = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keywords: kw, municipality_ids: municipalityIds })
                });
                const data = await res.json();
                if (data.success) {
                    setJobs(data.jobs || []);
                    fetchStats();
                }
                setScraping(false);
            };

            const handleApply = async (job) => {
                setApplyingJob(job.id);
                setSelectedJob(job);

                try {
                    const res = await authFetch(`/api/jobs/${job.id}/apply-with-cv`, {
                        method: 'POST',
                        body: JSON.stringify({ job })
                    });
                    const data = await res.json();

                    if (data.success) {
                        setApplyResult(data);
                        setShowApplyModal(true);
                        // Log 'applied' interaction so this job is hidden from the feed
                        if (localStorage.getItem('auth_token')) {
                            authFetch(`/api/jobs/${job.id}/interaction`, {
                                method: 'POST',
                                body: JSON.stringify({ action: 'applied' })
                            }).catch(() => {});
                        }
                    } else {
                        // Show a helpful error with more context
                        const msg = data.detail || 'Kunde inte generera brev just nu.';
                        alert(`${msg}\n\nTips: Försök igen om en stund, eller kolla att du är inloggad.`);
                    }
                } catch (err) {
                    console.error('Apply error:', err);
                    alert('Kunde inte ansluta till servern. Kontrollera din internetanslutning och försök igen.');

                setApplyingJob(null);
            };

            const handleSelectVibe = (vibe, userCV) => {
                setSelectedVibe(vibe);

                // Save or update CV
                const existingCV = userCVs.find(cv => cv.vibe_id === vibeId);

                if (existingCV) {
                    // Update
                    await fetch(`/api/cv/${vibeId}?cv_text=${encodeURIComponent(text)}`, { method: 'PATCH' });
                } else {
                    // Create (simplified - in real app, would need full data)
                    const vibe = vibes.find(v => v.id === vibeId);
                    await fetch('/api/cv/all', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            vibe_id: vibeId,
                            vibe_name: vibe?.name,
                            vibe_emoji: vibe?.emoji,
                            cv_text: text
                        })

                setShowCVModal(false);

                        method: 'POST',
                        body: JSON.stringify({})
                    });

                        await fetchUserCVs();

                    console.error(err);
                    alert('Något gick fel vid genereringen.');

                setGenerating(false);

            const handleMigrateData = async () => {
                if (!confirm('Vill du ladda in fardiga CV:n och erfarenheter?')) return;
                setMigrating(true);
                try {
                    const refreshToken = localStorage.getItem('refresh_token');
                    const res = await authFetch('/api/migrate-my-data', {
                        method: 'POST',
                        body: JSON.stringify({ refresh_token: refreshToken })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert(`Data inladdat! ${data.message}`);
                        window.location.reload();
                    } else {
                        alert(data.detail || data.message || 'Kunde inte ladda data.');
                        if (data.errors) console.error('Migration errors:', data.errors);
                    }
                } catch (err) {
                    console.error(err);
                    alert('Fel vid inladdning. Testa att logga ut och in igen.');
                }
                setMigrating(false);
            };

            // Upload CV PDF
            const [uploadingCV, setUploadingCV] = useState(false);
            const [uploadVibeId, setUploadVibeId] = useState(null);

            const handleUploadCV = async (vibe) => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.pdf,.docx,.doc,.txt,.rtf,.odt';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    // Validate file type
                    const validExtensions = ['pdf', 'docx', 'doc', 'txt', 'rtf', 'odt'];
                    const fileExt = file.name.split('.').pop().toLowerCase();
                    if (!validExtensions.includes(fileExt)) {
                        alert('Ogiltigt filformat! Använd PDF, DOCX, DOC, TXT, RTF eller ODT');
                        return;
                    }

                    setUploadingCV(true);
                    setUploadVibeId(vibe.id);

                    try {
                        const token = localStorage.getItem('auth_token');
                        const formData = new FormData();
                        formData.append('file', file);

                        const res = await fetch(`/api/upload/cv/${vibe.id}`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`
                            },
                            body: formData
                        });

                        const data = await res.json();
                        if (data.success) {
                            alert(`✓ CV för ${vibe.name} uppladdad!`);
                            await fetchUserCVs();
                        } else {
                            alert(data.detail || 'Kunde inte ladda upp CV. Försök igen.');
                        }
                    } catch (err) {
                        console.error(err);
                        alert('Något gick fel vid uppladdning.');
                    }

                    setUploadingCV(false);
                    setUploadVibeId(null);
                };
                input.click();
            };

                if (storedUser) {

                }

                // Refresh token silently
                const refreshToken = localStorage.getItem('refresh_token');
                if (refreshToken) {
                    fetch('/api/auth/refresh', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refresh_token: refreshToken })
                    })
                    .then(r => r.json())
                    .then(data => {

                            if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
                            if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
                        }

                                jobs={jobs.filter(j => !j.contact_email || !j.contact_email.includes('@'))}

                                scraping={scraping}
                                savedJobs={savedJobs}
                                onSaveJob={handleSaveJob}
                                onOpenQuiz={() => setShowOnboarding(true)}
                                setActiveTab={setActiveTab}
                            />
                        )}

                        {activeTab === 'cvs' && (
                            <MinaCVPage />
                        )}

                        {activeTab === 'applications' && (
                            <ApplicationsPage
                                applications={applications}
                                onRefresh={fetchApplications}
                            />
                        )}

                        {activeTab === 'metrics' && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                <h2 className="text-lg font-semibold">Din statistik</h2>

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-white rounded-xl p-5 border border-slate-100">
                                        <div className="text-3xl font-bold text-pink-600">{stats.total_jobs || 0}</div>
                                        <div className="text-slate-500 text-sm mt-1">Jobb hittade</div>
                                    </div>
                                    <div className="bg-white rounded-xl p-5 border border-slate-100">
                                        <div className="text-3xl font-bold text-green-600">{stats.sent || 0}</div>
                                        <div className="text-slate-500 text-sm mt-1">Ansökningar skickade</div>
                                    </div>
                                    <div className="bg-white rounded-xl p-5 border border-slate-100">
                                        <div className="text-3xl font-bold text-amber-600">{stats.interviews || 0}</div>
                                        <div className="text-slate-500 text-sm mt-1">Intervjuer</div>
                                    </div>
                                    <div className="bg-white rounded-xl p-5 border border-slate-100">
                                        <div className="text-3xl font-bold text-purple-600">{userCVs.length || 0}</div>
                                        <div className="text-slate-500 text-sm mt-1">CV-versioner</div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl p-5 border border-slate-100">
                                    <h3 className="font-semibold text-slate-700 mb-3">Sparade jobb</h3>
                                    <div className="text-3xl font-bold text-blue-600">{(savedJobs || []).length}</div>
                                </div>

                                <div className="bg-white rounded-xl p-5 border border-slate-100">
                                    <h3 className="font-semibold text-slate-700 mb-3">Deadline idag</h3>
                                    <div className="text-3xl font-bold text-red-600">{stats.deadline_today || 0}</div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'quiz' && (
                            <div className="max-w-3xl mx-auto">
                                <QuizPage
                                    onComplete={(answers) => {
                                        localStorage.setItem('job_preferences', JSON.stringify(answers));
                                        setActiveTab('jobs');
                                    }}
                                    saving={false}
                                />
                            </div>
                        )}

                        {activeTab === 'preferences' && (
                            <PreferencesPage />
                        )}

                        {activeTab === 'platser' && (
                            <PlatserPage />
                        )}

                        {activeTab === 'letter' && (
                            <LetterPreferencesPage />
                        )}

                        {activeTab === 'profil' && (
                            <ProfilPage />
                        )}
                    </main>

                    <ApplyModal
                        isOpen={showApplyModal}
                        job={selectedJob}
                        result={applyResult}
                        onClose={() => { setShowApplyModal(false); fetchApplications(); fetchStats(); }}
                        onSaveApplication={() => { fetchApplications(); fetchStats(); }}
                    />

                    <CVModal
                        isOpen={showCVModal}
                        vibe={selectedVibe}
                        cvText={selectedCVText}
                        onClose={() => setShowCVModal(false)}
                        onSave={handleSaveCV}
                    />

                    <MasterCVEditor
                        isOpen={showMasterCVModal}
                        masterCV={masterCV}
                        onClose={() => setShowMasterCVModal(false)}
                        onSave={handleSaveMasterCV}
                        saving={savingMasterCV}
                    />

                    <footer className="border-t border-slate-200 mt-8">
                        <div className="max-w-6xl mx-auto px-4 py-6 text-center text-sm text-slate-500">
                            <div className="flex justify-center gap-4 mb-2">
                                <a href="/integritetspolicy" className="hover:text-indigo-600">Integritetspolicy</a>
                                <span>·</span>
                                <a href="/anvandarvillkor" className="hover:text-indigo-600">Användarvillkor</a>
                            </div>
                            <p>© 2026 Platsbanken AI</p>
                        </div>
                    </footer>

                    {/* Version badge */}
                    <div style={{position:'fixed',bottom:'10px',right:'10px',fontSize:'10px',color:'#999',background:'#fff',padding:'4px 8px',borderRadius:'4px',border:'1px solid #ddd',zIndex:9999}}>
                        v12-platser-2026-02-20
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
